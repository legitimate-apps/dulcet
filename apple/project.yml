name: Dulcet
options:
  bundleIdPrefix: com.legitimateapps.dulcet
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3LTL47SJ8C
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
    OTHER_LDFLAGS: "$(inherited) -framework DulcetCore"
    # One marketing version for every channel and platform (spec §22.1: DEV carries the
    # in-progress version). CFBundleShortVersionString cannot carry a "-dev" suffix, so DEV is
    # told apart by its bundle identifier, name and icon, never by this value.
    MARKETING_VERSION: "0.1.0"
packages:
  DulcetKit:
    path: DulcetKit
targets:
  DulcetMac:
    type: application
    platform: macOS
    sources:
      - DulcetMac
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.dev
        PRODUCT_MODULE_NAME: DulcetMac
        PRODUCT_NAME: Dulcet DEV
        CODE_SIGN_ENTITLEMENTS: DulcetMac/DulcetMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
      configs:
        # Release is what release.yml archives for the DEV channel; Debug keeps automatic
        # signing for local and CI builds. Beyond identity, name and icon, these match
        # DulcetMacRelease, because spec §22.3 lets nothing else differ between the channels.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Dulcet CI Mac Dev App Store"
          ENABLE_HARDENED_RUNTIME: YES
    info:
      # DEV's own plist, in a directory no PROD target reads. It is the one place a DEV-only
      # convenience value (spec §22.3) may ever be added; PROD's plist lives beside
      # DulcetMacRelease and tools/verify_release_policy.py holds it to a fixed key set.
      path: DulcetMacDev/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Dulcet DEV
        CFBundleIconFile: AppIconDev
        CFBundleIconName: AppIconDev
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Legitimate LLC. All rights reserved."
        # A server on the local network is the common case for a self-hosted library. Without
        # this the system refuses local-network access outright where it enforces the privacy.
        NSLocalNetworkUsageDescription: "Dulcet connects to the music server you choose, which may be on your local network."
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetSignedMacHost:
    type: application
    platform: macOS
    sources:
      - DulcetMac
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.signed-host
        PRODUCT_MODULE_NAME: DulcetMac
        PRODUCT_NAME: Dulcet Signed Host
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: DulcetSignedMacTests/Host.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(DULCET_SIGNED_HOST_PROFILE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
    info:
      path: DulcetSignedMacTests/Host-Info.plist
      properties:
        CFBundleDisplayName: Dulcet Signed Host
        NSLocalNetworkUsageDescription: "Dulcet connects to the disposable test server."
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetSignedMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DulcetSignedMacTests
        excludes:
          - Host.entitlements
          - Host-Info.plist
    dependencies:
      - target: DulcetSignedMacHost
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.signed-host.tests
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dulcet Signed Host.app/Contents/MacOS/Dulcet Signed Host"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DulcetMacRelease:
    type: application
    platform: macOS
    sources:
      - DulcetMac
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet
        PRODUCT_MODULE_NAME: DulcetMac
        PRODUCT_NAME: Dulcet
        CODE_SIGN_ENTITLEMENTS: DulcetMac/DulcetMacRelease.entitlements
        # The Mac App Store REQUIRES an asset catalog (ITMS-90546 rejects a bare .icns),
        # so actool must run. Dulcet has no .colorset, which is the input that deadlocks
        # actool when CoreSimulator is wedged — an .appiconset alone is safe.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Dulcet CI Mac App Store"
        CURRENT_PROJECT_VERSION: "4"
    info:
      # An explicit plist, NOT INFOPLIST_KEY_* settings: that mechanism only honours a fixed
      # allowlist, and CFBundleIconFile/CFBundleIconName are not on it — they were silently
      # dropped from the generated plist while the build still succeeded.
      # PROD-only directory: the shared DulcetMac source folder holds no plist, so no DEV target
      # can contribute a key to this one.
      path: DulcetMacRelease/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Dulcet
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        # Dulcet uses only standard TLS (system URLSession) to reach a user-named server,
        # plus the system Keychain — both are exempt. Declaring it here stops every upload
        # parking at internalBuildState=MISSING_EXPORT_COMPLIANCE, which silently blocks
        # TestFlight distribution even after the build is VALID.
        ITSAppUsesNonExemptEncryption: false
        # XcodeGen defaults these to a literal "1.0"/"1", which silently shipped a version
        # that disagreed with MARKETING_VERSION. Bind them to the build settings instead.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Legitimate LLC. All rights reserved."
        # A server on the local network is the common case for a self-hosted library. Without
        # this the system refuses local-network access outright where it enforces the privacy.
        NSLocalNetworkUsageDescription: "Dulcet connects to the music server you choose, which may be on your local network."
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DulcetMacTests
      # The counted reader proofs, shared with the iOS and iPadOS app-host bundle.
      - DulcetAppleAppHostTests/DulcetReaderCountedProofs.swift
    dependencies:
      - target: DulcetMac
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.dev.tests
        CODE_SIGN_ENTITLEMENTS: DulcetMac/DulcetMac.entitlements
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dulcet DEV.app/Contents/MacOS/Dulcet DEV"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DulcetPlaybackIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DulcetPlaybackIntegrationTests
      - DulcetAppleShared/DulcetCoreDownloads.swift
      - DulcetAppleShared/DulcetCorePlayback.swift
      - DulcetAppleShared/DulcetCorePlaybackController.swift
      - DulcetAppleShared/SQLiteLoadExtensionUnsupported.c
      - path: DulcetKit/Tests/DulcetKitTests/Fixtures/navidrome-reference.mp3
        group: DulcetKitTests/Fixtures
        buildPhase: resources
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.playback-integration-tests
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetiOS:
    type: application
    platform: iOS
    sources:
      - DulcetiOS
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        # Universal purchase (spec §22.2): one DEV identifier for macOS, iOS, iPadOS and tvOS, so
        # one App Store Connect record carries every platform. Test bundles keep suffixes.
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.dev
        PRODUCT_NAME: Dulcet DEV
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Every configuration, not Release only: this target now has an asset catalog, and actool
        # fails an iOS build whose catalog lacks the named icon set (XcodeGen's default is AppIcon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        # UIBackgroundModes is not on Xcode's INFOPLIST_KEY_* allowlist, so it lives in a partial
        # plist that Xcode merges into the generated one. Without `audio` iOS suspends playback
        # when the screen locks or the app leaves the foreground.
        INFOPLIST_FILE: DulcetiOS/BackgroundAudio.plist
      configs:
        # Release is what release.yml archives for the iOS DEV channel; Debug is untouched.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Dulcet CI Dev iOS App Store"
          INFOPLIST_KEY_CFBundleDisplayName: Dulcet DEV
          INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
          # An iPad build that supports multitasking must declare all four orientations or
          # App Store Connect rejects the upload. These are the platform defaults, stated.
          INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
          INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetSignedIPadHost:
    type: application
    platform: iOS
    sources:
      - path: DulcetiOS
        excludes:
          - BackgroundAudio.plist
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.signed-ipad
        PRODUCT_MODULE_NAME: DulcetiOS
        PRODUCT_NAME: Dulcet Signed iPad Host
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DULCET_SIGNED_IPAD_PROOF"
    info:
      path: DulcetSignedIPadUITests/Host-Info.plist
      properties:
        CFBundleDisplayName: Dulcet Signed iPad Host
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Dulcet connects to the disposable music server for this test."
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetSignedIPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DulcetSignedIPadUITests
        excludes:
          - Host-Info.plist
    dependencies:
      - target: DulcetSignedIPadHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.signed-ipad.ui-tests
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: DulcetSignedIPadHost
        CODE_SIGN_STYLE: Manual
  DulcetiOSRelease:
    type: application
    platform: iOS
    sources:
      # The shared DulcetiOS folder minus the DEV target's partial plist: this target's plist is
      # its own, below, and carries the background audio mode itself.
      - path: DulcetiOS
        excludes:
          - BackgroundAudio.plist
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        # Universal purchase (spec §22.2): the one PROD identifier, on the record macOS already uses.
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet
        PRODUCT_NAME: Dulcet
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Dulcet CI iOS App Store"
    info:
      # PROD-only directory, like DulcetMacRelease: no DEV target reads it, and
      # tools/verify_release_policy.py holds it to a fixed key set with no URL anywhere, so a
      # preconfigured server has no route into a PROD build (spec §22.3). Every key a DulcetiOS
      # Release build gets from INFOPLIST_KEY_* settings or its partial plist is stated here
      # instead, so the two channels differ only in identity, name and icon.
      path: DulcetiOSRelease/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Dulcet
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Without `audio` iOS suspends playback when the screen locks or the app leaves the
        # foreground.
        UIBackgroundModes:
          - audio
        # An empty UILaunchScreen is the generated launch screen DulcetiOS gets from
        # INFOPLIST_KEY_UILaunchScreen_Generation. Without one iOS runs the app in its 320x480
        # compatibility mode.
        UILaunchScreen: {}
        # An iPad build that supports multitasking must declare all four orientations or App
        # Store Connect rejects the upload.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Dulcet connects to the music server you choose, which may be on your local network."
        # The type a drag onto the queue carries (DulcetQueueDragAndDrop.swift declares it with
        # UTType(exportedAs:)); DEV gets it from its partial plist.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.legitimateapps.dulcet.queue-item
            UTTypeDescription: Dulcet queue item
            UTTypeConformsTo:
              - public.data
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetKitIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DulcetKit/Tests/DulcetKitTests
        excludes:
          - Fixtures
      - path: DulcetKit/Tests/DulcetKitTests/Fixtures/navidrome-reference.mp3
        group: DulcetKitTests/Fixtures
        buildPhase: resources
    dependencies:
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.ios.dev.tests
    preBuildScripts:
      # This bundle links -framework DulcetCore (project-wide OTHER_LDFLAGS) and resolves it from
      # BUILT_PRODUCTS_DIR, where it is placed only by a "Compile Kotlin Framework" phase. Without
      # a phase of its own the bundle had no ordering guarantee against DulcetiOS's copy, and on a
      # clean DerivedData it always lost: the Kotlin link takes ~80s while this target's Swift
      # compile takes ~13s, so ld ran first and CI failed with "framework 'DulcetCore' not found"
      # while a warm local tree passed. Its macOS twin is app-hosted (TEST_HOST + a dependency on
      # DulcetMac), which serialises it for free; these iOS tests are deliberately NOT app-hosted
      # — DulcetCore is a STATIC framework, so it is needed at link time only — hence its own phase
      # rather than a host. Concurrent gradle invocations serialise on gradle's own build lock.
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetiOSDownloadIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DulcetPlaybackIntegrationTests/DulcetAppleDownloadIntegrationTest.swift
      - DulcetAppleShared/DulcetCoreDownloads.swift
      - DulcetAppleShared/SQLiteLoadExtensionUnsupported.c
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.ios.download-integration-tests
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetKeychainIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DulcetAppleAppHostTests
    dependencies:
      - target: DulcetiOS
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.ios.dev.keychain-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dulcet DEV.app/Dulcet DEV"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DulcetiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DulcetiOSUITests
    dependencies:
      - target: DulcetiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.ios.dev.ui-tests
        TEST_TARGET_NAME: DulcetiOS
  DulcetTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - DulcetTVUITests
    dependencies:
      - target: DulcetTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.tvos.dev.ui-tests
        TEST_TARGET_NAME: DulcetTV
  DulcetTV:
    type: application
    platform: tvOS
    sources:
      - DulcetTV
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.dev
        PRODUCT_NAME: Dulcet DEV
        # See DulcetiOS: the background audio mode, merged into the generated plist.
        INFOPLIST_FILE: DulcetTV/BackgroundAudio.plist
        # The layered app icon and the top-shelf images, one brand-assets set (tvOS requires both
        # before App Store Connect accepts a build). Every configuration: actool fails a build
        # whose catalog lacks the named set.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
      configs:
        # Release is what release.yml archives for the tvOS DEV channel; Debug is untouched.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Dulcet CI Dev tvOS App Store"
          INFOPLIST_KEY_CFBundleDisplayName: Dulcet DEV
          INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetKitTVOSTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: DulcetKit/Tests/DulcetKitTests
        excludes:
          - Fixtures
      - path: DulcetKit/Tests/DulcetKitTests/Fixtures/navidrome-reference.mp3
        group: DulcetKitTests/Fixtures
        buildPhase: resources
    dependencies:
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.tvos.dev.tests
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          # Serialised: nine targets run this phase and Xcode builds targets in parallel. Two bare
          # Gradle invocations race for the configuration-cache and journal locks and one fails.
          tools/run-gradle-exclusive :core:embedAndSignAppleFrameworkForXcode
  DulcetKeychainTVOSTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - DulcetAppleAppHostTests
    dependencies:
      - target: DulcetTV
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.tvos.dev.keychain-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dulcet DEV.app/Dulcet DEV"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DulcetSignedIPadProof:
    build:
      targets:
