name: Dulcet
options:
  bundleIdPrefix: com.legitimateapps.dulcet
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3LTL47SJ8C
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
    OTHER_LDFLAGS: "$(inherited) -framework DulcetCore"
packages:
  DulcetKit:
    path: DulcetKit
targets:
  DulcetMac:
    type: application
    platform: macOS
    sources:
      - DulcetMac
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.dev
        PRODUCT_MODULE_NAME: DulcetMac
        PRODUCT_NAME: Dulcet DEV
        CODE_SIGN_ENTITLEMENTS: DulcetMac/DulcetMac.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(DULCET_RELEASE_PROFILE_NAME)"
          MARKETING_VERSION: "0.1.0"
          CURRENT_PROJECT_VERSION: "1"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode < /dev/null
  DulcetMacRelease:
    type: application
    platform: macOS
    sources:
      - DulcetMac
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet
        PRODUCT_MODULE_NAME: DulcetMac
        PRODUCT_NAME: Dulcet
        CODE_SIGN_ENTITLEMENTS: DulcetMac/DulcetMacRelease.entitlements
        # The Mac App Store REQUIRES an asset catalog (ITMS-90546 rejects a bare .icns),
        # so actool must run. Dulcet has no .colorset, which is the input that deadlocks
        # actool when CoreSimulator is wedged — an .appiconset alone is safe.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DULCET_RELEASE_PROFILE_NAME: "Dulcet Mac App Store"
        PROVISIONING_PROFILE_SPECIFIER: "$(DULCET_RELEASE_PROFILE_NAME)"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
    info:
      # An explicit plist, NOT INFOPLIST_KEY_* settings: that mechanism only honours a fixed
      # allowlist, and CFBundleIconFile/CFBundleIconName are not on it — they were silently
      # dropped from the generated plist while the build still succeeded.
      path: DulcetMac/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Dulcet
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        # Dulcet uses only standard TLS (system URLSession) to reach a user-named server,
        # plus the system Keychain — both are exempt. Declaring it here stops every upload
        # parking at internalBuildState=MISSING_EXPORT_COMPLIANCE, which silently blocks
        # TestFlight distribution even after the build is VALID.
        ITSAppUsesNonExemptEncryption: false
        # XcodeGen defaults these to a literal "1.0"/"1", which silently shipped a version
        # that disagreed with MARKETING_VERSION. Bind them to the build settings instead.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Legitimate LLC. All rights reserved."
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode < /dev/null
  DulcetMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DulcetMacTests
    dependencies:
      - target: DulcetMac
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.dev.tests
        CODE_SIGN_ENTITLEMENTS: DulcetMac/DulcetMac.entitlements
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dulcet DEV.app/Contents/MacOS/Dulcet DEV"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DulcetPlaybackIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DulcetPlaybackIntegrationTests
      - DulcetAppleShared/DulcetCoreDownloads.swift
      - DulcetAppleShared/DulcetCorePlayback.swift
      - DulcetAppleShared/SQLiteLoadExtensionUnsupported.c
      - path: DulcetKit/Tests/DulcetKitTests/Fixtures/navidrome-reference.mp3
        group: DulcetKitTests/Fixtures
        buildPhase: resources
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.playback-integration-tests
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode < /dev/null
  DulcetiOS:
    type: application
    platform: iOS
    sources:
      - DulcetiOS
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.ios.dev
        PRODUCT_NAME: Dulcet DEV
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode < /dev/null
  DulcetKitIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DulcetKit/Tests/DulcetKitTests
        excludes:
          - Fixtures
      - path: DulcetKit/Tests/DulcetKitTests/Fixtures/navidrome-reference.mp3
        group: DulcetKitTests/Fixtures
        buildPhase: resources
    dependencies:
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.ios.dev.tests
    preBuildScripts:
      # This bundle links -framework DulcetCore (project-wide OTHER_LDFLAGS) and resolves it from
      # BUILT_PRODUCTS_DIR, where it is placed only by a "Compile Kotlin Framework" phase. Without
      # a phase of its own the bundle had no ordering guarantee against DulcetiOS's copy, and on a
      # clean DerivedData it always lost: the Kotlin link takes ~80s while this target's Swift
      # compile takes ~13s, so ld ran first and CI failed with "framework 'DulcetCore' not found"
      # while a warm local tree passed. Its macOS twin is app-hosted (TEST_HOST + a dependency on
      # DulcetMac), which serialises it for free; these iOS tests are deliberately NOT app-hosted
      # — DulcetCore is a STATIC framework, so it is needed at link time only — hence its own phase
      # rather than a host. Concurrent gradle invocations serialise on gradle's own build lock.
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode < /dev/null
  DulcetiOSDownloadIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DulcetPlaybackIntegrationTests/DulcetAppleDownloadIntegrationTest.swift
      - DulcetAppleShared/DulcetCoreDownloads.swift
      - DulcetAppleShared/SQLiteLoadExtensionUnsupported.c
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.ios.download-integration-tests
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode < /dev/null
  DulcetiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DulcetiOSUITests
    dependencies:
      - target: DulcetiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.ios.dev.ui-tests
        TEST_TARGET_NAME: DulcetiOS
  DulcetTV:
    type: application
    platform: tvOS
    sources:
      - DulcetTV
      - DulcetAppleShared
    dependencies:
      - package: DulcetKit
      - sdk: libsqlite3.tbd
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -Wl,-export_dynamic"
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.tvos.dev
        PRODUCT_NAME: Dulcet DEV
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode < /dev/null
  DulcetKitTVOSTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: DulcetKit/Tests/DulcetKitTests
        excludes:
          - Fixtures
      - path: DulcetKit/Tests/DulcetKitTests/Fixtures/navidrome-reference.mp3
        group: DulcetKitTests/Fixtures
        buildPhase: resources
    dependencies:
      - package: DulcetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legitimateapps.dulcet.tvos.dev.tests
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode < /dev/null
schemes:
  DulcetPlaybackIntegration:
    build:
      targets:
        DulcetPlaybackIntegrationTests: [test]
    test:
      targets:
        - DulcetPlaybackIntegrationTests
  DulcetiOS:
    build:
      targets:
        DulcetiOS: all
    run:
      config: Debug
    test:
      targets:
        - DulcetKitIOSTests
        - DulcetiOSUITests
  DulcetiOSDownloadIntegration:
    build:
      targets:
        DulcetiOSDownloadIntegrationTests: [test]
    test:
      targets:
        - DulcetiOSDownloadIntegrationTests
  DulcetMac:
    build:
      targets:
        DulcetMac: all
        DulcetMacTests: [test]
    test:
      targets:
        - DulcetMacTests
        - DulcetPlaybackIntegrationTests
      environmentVariables:
        - variable: DULCET_CONFORMANCE_BASE_URL
          value: "$(DULCET_TEST_CONFORMANCE_BASE_URL)"
          isEnabled: true
        - variable: DULCET_CONFORMANCE_DISPOSABLE
          value: "$(DULCET_TEST_CONFORMANCE_DISPOSABLE)"
          isEnabled: true
  DulcetMacRelease:
    build:
      targets:
        DulcetMacRelease: all
    archive:
      config: Release
  DulcetTV:
    build:
      targets:
        DulcetTV: all
    run:
      config: Debug
    test:
      targets:
        - DulcetKitTVOSTests
