# Robolectric 4.16.1 has no android-all jar for compileSdk 36, and its DefaultSdkProvider throws
# UnsupportedOperationException rather than falling back -- OBSERVED locally as
# `java.lang.UnsupportedOperationException at DefaultSdkProvider.java:170`.
#
# Pin the emulated level to the newest one this Robolectric actually ships. This is the RUNTIME the
# controls are emulated on; it does not change the app's compileSdk or the minSdk 26 floor that
# spec 4.2 sets, and the behaviours under test (progress, cancellation, credential failure modes,
# proxy rejection) are not level-specific.
sdk=35
