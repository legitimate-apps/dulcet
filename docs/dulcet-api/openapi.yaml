  /tracks/{trackId}:
    get:
      tags: [Catalog]
      operationId: getTrack
      summary: Get a track
      security:
        - oauth2: [library:read]
        - personalToken: [library:read]
      parameters:
        - $ref: '#/components/parameters/TrackId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The track.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Dulcet-Sync-Cursor:
              $ref: '#/components/headers/SyncCursor'
