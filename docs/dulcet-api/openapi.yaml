      tags: [Account]
      operationId: exportUserData
      summary: Export everything the server holds about the user
      description: |
        Streams the user's favourites, ratings, My Library, playlists, queue, devices and full play history
        as JSON Lines, one record per line, each with a `kind` field. Catalog items carry their
        external ids (MusicBrainz, ISRC) so another server can match them. Portability is part of
        the standard: every Core server implements this.
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      responses:
        '200':
          description: The export.
          content:
            application/x-ndjson:
              schema:
                type: string
              example: |
                {"kind":"header","standard":"dulcet","apiVersion":"1.0","exportedAt":"2026-10-12T10:00:00Z","userId":"usr_01"}
                {"kind":"favorite","itemId":"trk_4f1","itemType":"track","favoritedAt":"2026-09-30T20:11:00Z","externalIds":{"isrc":"USXXX2600001"}}
                {"kind":"play","id":"7c0e4a52-1f8b-4f8e-9a51-2e0c35a5b0d1","trackId":"trk_4f1","startedAt":"2026-10-11T18:00:00Z","listenedMs":201000}
