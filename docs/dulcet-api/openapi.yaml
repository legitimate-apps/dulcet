  /playlists/{playlistId}/items:
    get:
      tags: [Playlists]
      operationId: listPlaylistItems
      summary: List a playlist's entries in order
      description: |
        Each entry has its own `entryId`, so the same track can appear twice and still be moved or
        removed exactly. `track` is embedded only when the token also holds `catalog:read`.
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of entries, with the playlist revision they were read at.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Dulcet-Sync-Cursor:
              $ref: '#/components/headers/SyncCursor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItemPage'
              example:
                revision: r_10450
                items:
                  - {entryId: ent_01, position: 0, itemId: trk_4f1, addedAt: '2026-10-12T10:00:00.000Z'}
                  - {entryId: ent_02, position: 1, itemId: trk_51a, addedAt: '2026-10-12T10:00:00.000Z'}
                nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Default'
    put:
      tags: [Playlists]
      operationId: replacePlaylistItems
      summary: Replace every entry of a playlist
      description: |
        Requires `If-Match` with the playlist's current revision, so one device cannot silently
        overwrite another's edit. Entries whose item stays in the list keep their `entryId` (matched
        in order). A replacement that drops any existing entry also needs `user:delete`; without it
        the call answers `403` and changes nothing.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistItemsReplace'
            example:
              itemIds: [trk_51a, trk_4f1]
      responses:
        '200':
          description: The playlist after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
              example:
                id: pl_3e
                type: playlist
                name: Late night
                description: Quiet ones.
                owner: {id: usr_01, name: Robin}
                visibility: private
                readOnly: false
                itemCount: 2
                durationMs: 512000
                createdAt: '2026-10-12T10:00:00.000Z'
                updatedAt: '2026-10-12T10:00:00.000Z'
                revision: r_10450
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Default'
    post:
      tags: [Playlists]
      operationId: insertPlaylistItems
      summary: Insert tracks into a playlist
      description: Appends by default, or inserts before `beforeEntryId`. `If-Match` is optional because an insert cannot lose another device's edit.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistItemsInsert'
            example:
              itemIds: [trk_77c]
      responses:
        '200':
          description: The playlist after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
              example:
                id: pl_3e
                type: playlist
                name: Late night
                description: Quiet ones.
                owner: {id: usr_01, name: Robin}
                visibility: private
                readOnly: false
                itemCount: 2
                durationMs: 512000
                createdAt: '2026-10-12T10:00:00.000Z'
                updatedAt: '2026-10-12T10:00:00.000Z'
                revision: r_10450
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        default:
