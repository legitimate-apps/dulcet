            application/json:
              schema:
                $ref: '#/components/schemas/LibraryMemberPage'
              example:
                items:
                  - {item: {id: alb_7d, type: album, name: Night Lines}, libraryAddedAt: '2026-09-01T12:00:00.000Z'}
                nextCursor: null
                counts: {artist: 1, album: 2, track: 14}
