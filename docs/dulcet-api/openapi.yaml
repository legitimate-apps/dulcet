          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Default'
    post:
      tags: [Queue]
      operationId: insertQueueEntries
      summary: Add items to the queue (play next, add to queue)
      description: |
        `at` is `next` (after the current entry), `end` (the default) or `before` with
        `beforeEntryId`. `If-Match` is optional, because an insert cannot lose another device's edit;
        a missing `beforeEntryId` answers `422`.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceIdHeader'
