          $ref: '#/components/responses/Default'

  /me/queue/playback:
    get:
      tags: [Queue]
      operationId: getQueuePlayback
      summary: Get the active device's playback state
      description: |
        Written only by the active device, often; it does not change the queue's `revision`. The
        live position is `positionMs + (now - positionAt)` while `state` is `playing`. `/events`
        pushes every change as a `playback` event, so controllers rarely need to poll this.
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      responses:
        '200':
          description: The playback state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePlayback'
              example:
                deviceId: dev_iphone_3c
                entryId: qe_a1
                state: playing
                positionMs: 64000
                positionAt: '2026-10-12T10:01:04.120Z'
                volume: 0.8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    put:
      tags: [Queue]
      operationId: reportQueuePlayback
      summary: Report playback state (active device only)
      description: |
        The active device sends this on play, pause, seek, entry change and at least every 30
        seconds while playing. Any other device gets `409` with problem type `not-active-device`
        and the current queue: it has lost the active role and must stop its audio. The server
        relays each report to the other devices as a `playback` event.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueuePlayback'
            example:
              deviceId: dev_iphone_3c
              entryId: qe_a1
              state: paused
              positionMs: 71250
              positionAt: '2026-10-12T10:01:11.370Z'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePlayback'
              example:
                deviceId: dev_iphone_3c
                entryId: qe_a1
                state: paused
                positionMs: 71250
                positionAt: '2026-10-12T10:01:11.370Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/NotActiveDevice'
        default:
          $ref: '#/components/responses/Default'

  /me/queue/transfer:
    post:
      tags: [Queue]
      operationId: transferPlayback
      summary: Make a device the one that plays (hand off, or start playing here)
      description: |
        Sets `activeDeviceId` and bumps the queue's revision. The previous active device receives a
        `queue` event naming another device and stops its audio within a second, keeping the
        position it last reported; the new one reads `/me/queue/playback` and starts there (at the
        extrapolated position if the queue was playing). A device starting playback on itself calls
        this with its own id.

        **Two devices starting at once:** the server applies transfers one at a time, so the last
        one wins, and the loser learns it from the `queue` event or from a `409` on its next
        playback report. A device that must not take over someone else's playback (an automatic
        resume) sends `If-Match` with the revision it saw; if anything changed it gets `412` and
        stays a controller. Transfer to a device that is not online and able to play answers `409`
        with problem type `device-unavailable`.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackTransfer'
            example:
              deviceId: dev_tv_81
              play: true
      responses:
        '200':
          description: The queue after the transfer.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
              example:
                revision: r_10476
                entryCount: 3
                currentEntryId: qe_a1
                shuffle: false
                repeat: 'off'
                activeDeviceId: dev_tv_81
                updatedAt: '2026-10-12T10:02:00.000Z'
                updatedBy: dev_iphone_3c
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Default'

  /me/queue/commands:
    post:
      tags: [Queue]
      operationId: sendPlaybackCommand
      summary: Control the active device (play, pause, seek, next, previous, skip to an entry)
      description: |
        The server relays the command to the active device as a `command` event on its `/events`
        stream; the device carries it out and reports the result through `PUT /me/queue/playback`
        (and `PATCH /me/queue` for an entry change). Answers `202`, because the effect is observed
        through the events that follow. With no active device, or one that holds no event stream,
        answers `409` with problem type `device-unavailable`: the controller offers to transfer
        playback instead. A command not carried out within 10 seconds is dropped.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackCommand'
            example:
              id: 0d6f3a10-5c1e-4f7b-9e2a-6b8c1d2e3f40
              command: seek
              positionMs: 120000
      responses:
        '202':
          description: Relayed to the active device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackCommandAccepted'
              example:
                id: 0d6f3a10-5c1e-4f7b-9e2a-6b8c1d2e3f40
                deviceId: dev_tv_81
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DeviceUnavailable'
        default:
          $ref: '#/components/responses/Default'

  /sync/changes:
    get:
      tags: [Sync]
      operationId: listChanges
      summary: Read the user's change feed
      description: |
        The one sync mechanism (README "Sync"). Three ways in:

        - `start=now` returns no changes and a cursor at the current position. A client that reads
          live and caches what it saw (a reader) starts here, then applies later changes to what it
          holds and ignores the rest.
        - `start=snapshot` begins a full snapshot: every visible entity of the requested types as an
          `upsert`, in pages, then the changes made while the snapshot ran. A client that keeps a
          whole copy starts here.
        - `cursor=...` continues from a cursor returned by any earlier call, or by the
          `Dulcet-Sync-Cursor` header of any read.

        Follow `nextCursor` while `hasMore` is true. When it is false the client is caught up, and
        `nextCursor` is the cursor to store. Rules every server keeps:

        - **Cursors are replayable.** The same cursor may be sent any number of times within
          retention and returns the same changes (or their coalesced later state) plus newer ones, so
          a client that crashed before storing a new cursor simply asks again. Applying a change twice
          is harmless: upserts carry whole state and deletes are idempotent.
        - **A cursor is bound to its `types`.** Sending a cursor with a different `types` value
          answers `400` with problem type `cursor-types-mismatch`. To sync more types, start a second
          feed for the new types (`start=snapshot&types=track`) and keep both cursors, or start over.
          A cursor from a list read's `Dulcet-Sync-Cursor` header covers every type the token may read.
        - **Order.** Changes come in commit order. Within one page an entity appears at most once.
        - **Pages.** A page may be empty while `hasMore` is true (the server is skipping changes this
          user cannot see); a client keeps following `nextCursor`. `limit` is at most
          `limits.maxPageSize`.
        - **Visibility.** When an entity stops being visible to the user (an admin removes a source
          from them, an item moves to a source they cannot see, another user's playlist becomes
          private), the feed carries a `delete` with `reason: hidden`; when it becomes visible again,
          an `upsert`. A server that cannot list such entities answers `410` to that user's cursors
          instead.
        - **When albums merge.** After a scan, two albums that carry the same
          `externalIds.musicbrainzReleaseId` are one album: the server merges them, and the survivor
          is the id it issued first. A server may merge in other cases it can justify; it never
          merges albums whose release ids differ.
        - **Merges and splits.** A `delete` with `reason: merged` names the survivors in
          `replacedBy` (one id for a merge, several for a split, always live ids even after chains).
          Before that tombstone, the server has already moved the user's data onto the survivor and
          emitted it: an `itemState` upsert for the survivor (earliest `favoritedAt`, the survivor's
          rating or else the merged one, summed `playCount`, latest `lastPlayedAt`, earliest
          `libraryAddedAt`), and `playlist` and `queue` upserts with new revisions for every list
          whose entries it rewrote (entry ids are kept). Plays are re-pointed to the survivor.
        - **Restores.** A cursor from another server instance, or one ahead of the journal's head,
          answers `410` with problem type `cursor-expired`, as does one older than retention.
          Discard derived state (keep unsent writes) and start again.

        Scopes: catalog types (`artist`, `album`, `track`, `genre`, `source`) need `catalog:read`;
        user types (`itemState`, `playlist`, `play`, `queue`, `wish`) need `user:read`. Asking for a type the
        token cannot read answers `403`; the default `types` is every type the token can read.
      security:
        - oauth2: [catalog:read]
        - oauth2: [user:read]
        - personalToken: [catalog:read]
        - personalToken: [user:read]
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: start
          in: query
          description: 'Only without `cursor`. Known values: `now`, `snapshot`.'
          schema: {type: string}
        - name: types
          in: query
          description: |
            Comma-separated entity types to include; default all the token may read. Must equal the
            value the cursor was created with. Omitted types on continuation retain the original verified filter, including cursors issued before wish support. Known values: `artist`, `album`, `track`, `genre`,
            `source`, `itemState`, `playlist`, `play`, `queue`, `wish`.
          schema: {type: string}
          example: itemState,playlist
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 500}
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
              example:
                changes:
                  - op: upsert
                    type: itemState
                    id: trk_4f1
                    revision: r_10452
                    at: '2026-10-12T10:02:00.000Z'
                    resource: {itemId: trk_4f1, itemType: track, favoritedAt: '2026-10-12T10:02:00.000Z', rating: 10, playCount: 7, lastPlayedAt: '2026-10-11T18:00:00.000Z', libraryAddedAt: null, revision: r_10452}
                  - op: upsert
                    type: playlist
                    id: pl_3e
                    revision: r_10453
                    at: '2026-10-12T10:03:00.000Z'
                    resource: {id: pl_3e, type: playlist, name: Late night, owner: {id: usr_01, name: Robin}, visibility: private, readOnly: false, itemCount: 3, revision: r_10453}
                  - op: delete
                    type: track
                    id: trk_0aa
                    revision: r_10454
                    at: '2026-10-12T10:05:00.000Z'
                    reason: deleted
                  - op: delete
                    type: album
                    id: alb_dup
                    revision: r_10455
                    at: '2026-10-12T10:05:00.000Z'
                    reason: merged
                    replacedBy: [alb_7d]
                  - op: delete
                    type: album
                    id: alb_c3
                    revision: r_10456
                    at: '2026-10-12T10:06:00.000Z'
                    reason: hidden
                nextCursor: sc_AQAAAAAAKNY
                hasMore: false
                phase: changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Default'

  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Open a Server-Sent Events stream of live changes
      description: |
        `text/event-stream` with the token in the `Authorization` header (browsers use a fetch-based
        reader, since `EventSource` cannot send headers). A device sends `Dulcet-Device-Id` so it
        counts as online and can receive `command` events. Each event's `data` is one JSON object
        whose schema is named in `components.schemas` (`ChangesEvent`, `QueueEvent`,
        `PlaybackEvent`, `CommandEvent`, `NowPlayingEvent`, `ScanEvent`, `RevokedEvent`,
        `HeartbeatEvent`). Events are hints, not data of record, except `command`, which is how
        the active device receives control: the change feed and the queue resources are the truth.
        Reconnect with `Last-Event-ID` to resume; a gap the server cannot replay is reported as a
        `changes` event, which a client answers by pulling the feed, and as a `queue` event, which a
        device answers by reading `/me/queue`. A `heartbeat` comes at least every 30 seconds.
        Event types need the scope of the data they describe. Without `types`, the stream leaves
        out, silently, the events the token cannot read; naming one of those in `types` answers
        `403`.
      security:
        - oauth2: [catalog:read]
        - oauth2: [user:read]
        - personalToken: [catalog:read]
        - personalToken: [user:read]
      parameters:
        - name: types
          in: query
          description: 'Comma-separated event types; default all the token may read. Known values: `changes`, `queue`, `playback`, `command`, `nowPlaying`, `scan`, `revoked`, `heartbeat`.'
          schema: {type: string}
        - name: Last-Event-ID
          in: header
          schema: {type: string}
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '200':
          description: An open event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Each event's `data` line is one JSON object matching `EventData` for its event type.
                contentSchema:
                  $ref: '#/components/schemas/EventData'
              example: |
                id: ev_10452
                event: changes
                data: {"cursor":"sc_AQAAAAAAKNY","types":["itemState"]}

                id: ev_10453
                event: queue
                data: {"revision":"r_10476","activeDeviceId":"dev_tv_81","changed":["activeDevice"]}

                id: ev_10454
                event: playback
                data: {"deviceId":"dev_tv_81","entryId":"qe_a1","state":"playing","positionMs":71250,"positionAt":"2026-10-12T10:02:01.020Z"}

                id: ev_10455
                event: command
                data: {"id":"0d6f3a10-5c1e-4f7b-9e2a-6b8c1d2e3f40","command":"seek","positionMs":120000,"from":"dev_iphone_3c"}

                event: heartbeat
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Default'

  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List the user's webhooks
      security:
        - oauth2: [account]
        - personalToken: [account]
      responses:
        '200':
          description: Webhooks. Secrets are never returned after creation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
              example:
                items:
                  - {id: wh_12, url: 'https://hooks.example.net/dulcet', events: [play.recorded], active: true, createdAt: '2026-10-12T10:00:00.000Z', lastDeliveryAt: null, consecutiveFailures: 0, disabledReason: null}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Subscribe a URL to events
      description: |
        Deliveries follow the Standard Webhooks signing scheme: headers `webhook-id`,
        `webhook-timestamp` and `webhook-signature` (HMAC-SHA256 over `id.timestamp.body` with the
        secret returned here, once). Receivers reject timestamps more than five minutes off. The
        server retries failures with backoff for about a day, then disables the hook and says why.
        Delivery bodies are defined in this document's `webhooks` section.

        **A webhook carries no more than the token that made it.** Its events are limited to what the
        creating token's scopes can read: asking for an event type outside them answers
        `403 insufficient-scope`, with `requiredScopes` and the refused event types in `events`. A
        webhook belongs to the grant or token that created it and is deleted (not disabled) when that
        grant or token is revoked or expires. `disabledReason` covers only delivery failures and an
        admin's disabling.

        **Targets.** HTTPS only, on port 443 unless an admin allows other ports. The server resolves
        the host, checks the address, and connects to that same address (no second lookup); it
        follows no redirects. Loopback, private, carrier-grade NAT, unique-local and link-local
        addresses are refused unless an admin allows private targets, and link-local and cloud
        metadata addresses are refused even then. A refused target answers
        `422 webhook-target-refused`. In test mode, the Testing override
        `webhooks.allowPrivateTargets` also allows `http://`, any port, and loopback and private
        addresses (still never link-local or cloud metadata ones).
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            example:
              url: https://hooks.example.net/dulcet
              events: [play.recorded, nowPlaying.changed]
              description: Listening stats
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreated'
              example:
                id: wh_12
                url: https://hooks.example.net/dulcet
                events: [play.recorded, nowPlaying.changed]
                description: Listening stats
                active: true
                createdAt: '2026-10-12T10:00:00.000Z'
                lastDeliveryAt: null
                consecutiveFailures: 0
                disabledReason: null
                secret: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        default:
          $ref: '#/components/responses/Default'

