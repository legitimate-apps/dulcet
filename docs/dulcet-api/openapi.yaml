            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
              example:
                id: pl_3e
                type: playlist
                name: Late night
                description: Quiet ones.
                owner: {id: usr_01, name: Robin}
                visibility: private
                readOnly: false
                itemCount: 2
                durationMs: 512000
