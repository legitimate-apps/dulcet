            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntryPage'
              example:
                revision: r_10472
                items:
                  - {entryId: qe_a1, position: 0, itemId: trk_4f1, addedBy: dev_iphone_3c}
                  - {entryId: qe_a2, position: 1, itemId: trk_51a, addedBy: dev_iphone_3c}
