                album: {id: alb_7d, title: Night Lines}
                credits:
                  - {artist: {id: art_2b, name: Example Quartet}, role: artist, creditedAs: Example Quartet}
                  - {artist: {id: art_9e, name: A. Composer}, role: composer, creditedAs: A. Composer}
                artistDisplay: Example Quartet
                discNumber: 1
                trackNumber: 3
                durationMs: 284000
                genres: [{id: gen_jazz, name: Jazz}]
                releaseDate: '2024-03-15'
                audio: {codec: flac, container: flac, bitrate: 912000, sampleRate: 44100, bitDepth: 16, channels: 2, sizeBytes: 32374000, lossless: true}
                loudness: {trackGainDb: -6.2, trackPeak: 0.98, albumGainDb: -5.9, albumPeak: 0.99}
                lyrics: {available: true, synced: true}
                artwork: {id: img_a81c}
                externalIds: {musicbrainzRecordingId: 2a7e9b3c-1d4f-4e6a-9b8c-7d6e5f4a3b2c, isrc: USXXX2600001}
                addedAt: '2026-09-01T12:00:00Z'
                userState: {favoritedAt: '2026-09-30T20:11:00Z', rating: 10, playCount: 7, lastPlayedAt: '2026-10-11T18:00:00Z', libraryAddedAt: null}
                revision: r_10431
        '304':
          $ref: '#/components/responses/NotModified'
        '308':
