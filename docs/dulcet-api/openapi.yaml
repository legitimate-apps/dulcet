  /sync/changes:
    get:
      tags: [Sync]
      operationId: listChanges
      summary: Read the user's change feed
      description: |
        The one sync mechanism (README "Sync"). Three ways in:

        - `start=now` returns no changes and a cursor at the current position. A client that reads
          live and caches what it saw (a reader) starts here, then applies later changes to what it
          holds and ignores the rest.
        - `start=snapshot` begins a full snapshot: every visible entity as an `upsert`, in pages,
          then the changes made while the snapshot ran. A client that keeps a whole copy starts here.
        - `cursor=...` continues from a cursor returned by any earlier call, or by the
          `Dulcet-Sync-Cursor` header of any read.

        Follow `nextCursor` while `hasMore` is true. When it is false the client is caught up, and
        `nextCursor` is the cursor to store. A cursor older than the server's retention window, or
        from a different server incarnation (a restore from backup), answers `410` with problem type
        `urn:dulcet:problem:cursor-expired`: discard derived state and start again.
      security:
        - oauth2: [library:read]
        - personalToken: [library:read]
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: start
          in: query
          description: 'Only without `cursor`. Known values: `now`, `snapshot`.'
          schema: {type: string}
        - name: types
          in: query
          description: |
            Comma-separated entity types to include; default all the token may read. A cursor stays
            valid for any `types` value. Known values: `artist`, `album`, `track`, `genre`, `library`,
            `itemState`, `playlist`, `play`, `queue`.
          schema: {type: string}
          example: itemState,playlist
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
              example:
                changes:
                  - op: upsert
                    type: itemState
                    id: trk_4f1
                    revision: r_10452
                    at: '2026-10-12T10:02:00Z'
                    resource: {itemId: trk_4f1, itemType: track, favoritedAt: '2026-10-12T10:02:00Z', rating: 10, playCount: 7, lastPlayedAt: '2026-10-11T18:00:00Z', libraryAddedAt: null, revision: r_10452}
                  - op: delete
                    type: track
                    id: trk_0aa
                    revision: r_10453
                    at: '2026-10-12T10:05:00Z'
                  - op: delete
                    type: album
                    id: alb_dup
                    revision: r_10454
                    at: '2026-10-12T10:05:00Z'
                    replacedBy: alb_7d
                nextCursor: sc_AQAAAAAAKNY
                hasMore: false
                phase: changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Open a Server-Sent Events stream of live changes
      description: |
        `text/event-stream` with the token in the `Authorization` header (browsers use a fetch-based
        reader, since `EventSource` cannot send headers). Event types: `changes` (the feed advanced;
        pull `/sync/changes`), `nowPlaying`, `queue`, `scan`, `revoked` and `heartbeat`. Events are
        hints, not data of record: the change feed is the truth. Reconnect with `Last-Event-ID` to
        resume; a gap the server cannot replay is reported as a `changes` event, which a client
        answers by pulling the feed.
      security:
        - oauth2: [library:read]
        - personalToken: [library:read]
      parameters:
        - name: types
          in: query
          description: Comma-separated event types; default all the token may read.
          schema: {type: string}
        - name: Last-Event-ID
          in: header
          schema: {type: string}
      responses:
        '200':
          description: An open event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: ev_10452
                event: changes
                data: {"cursor":"sc_AQAAAAAAKNY","types":["itemState"]}

                id: ev_10453
                event: nowPlaying
                data: {"userId":"usr_01","deviceId":"dev_iphone_3c","trackId":"trk_4f1","state":"playing","positionMs":64000}

                event: heartbeat
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List the user's webhooks
      security:
        - oauth2: [account]
        - personalToken: [account]
      responses:
        '200':
          description: Webhooks. Secrets are never returned after creation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Subscribe a URL to events
      description: |
        Deliveries follow the Standard Webhooks signing scheme: headers `webhook-id`,
        `webhook-timestamp` and `webhook-signature` (HMAC-SHA256 over `id.timestamp.body` with the
        secret returned here, once). Receivers reject timestamps more than five minutes off. The
        server retries failures with backoff for about a day, then disables the hook and says why.
        HTTPS targets only, and no private-network targets unless an admin allows them.
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            example:
              url: https://hooks.example.net/dulcet
              events: [play.recorded, nowPlaying.changed]
              description: Listening stats
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /webhooks/{webhookId}:
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Get a webhook and its delivery health
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Change a webhook's events or re-enable it
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WebhookUpdate'
            example:
              active: true
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/{webhookId}/test:
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a signed `ping` delivery now
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: The delivery attempt and the receiver's status code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a user
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              username: sam
              displayName: Sam
              password: correct horse battery staple
              roles: []
              permissions: {download: true, share: false}
              libraryIds: [lib_main]
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /users/{userId}:
    get:
      tags: [Admin]
      operationId: getUser
      summary: Get a user
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Change a user's roles, permissions, libraries or password
      description: Changing a password or removing a role revokes the user's existing tokens that depended on it.
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              permissions: {download: false}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Delete a user and everything they own
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/scans:
    get:
      tags: [Admin]
      operationId: listScans
      summary: List recent library scans, newest first
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      responses:
        '200':
          description: Scans.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      operationId: startScan
      summary: Start a library scan
      description: Answers 202 with the scan. If a scan is already running, answers 202 with that scan.
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanStart'
            example:
              kind: quick
      responses:
        '202':
          description: Accepted.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/scans/{scanId}:
    get:
      tags: [Admin]
      operationId: getScan
      summary: Get a scan's progress
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      parameters:
        - name: scanId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
              example:
                id: scan_88
                kind: quick
                state: running
                startedAt: '2026-10-12T10:00:00Z'
                finishedAt: null
                counts: {added: 12, updated: 3, removed: 0}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /mcp:
    post:
      tags: [AI]
      operationId: mcpMessage
      summary: Model Context Protocol endpoint (Streamable HTTP transport)
      description: |
        A JSON-RPC 2.0 message from an MCP client. Authorization follows the MCP authorization
        specification with this server's OAuth 2.1 authorization server, found through
        `/.well-known/oauth-protected-resource`. The tool list depends on the token's scopes: read
        tools need `library:read` or `user:read`; write tools need `user:write` and are never listed
        without it. No tool deletes anything, administers the server, or reaches outside the user's
        own data. Tool contracts are in README "AI and MCP".
      security:
        - oauth2: [library:read]
        - personalToken: [library:read]
      parameters:
        - name: Mcp-Session-Id
          in: header
          schema: {type: string}
        - name: MCP-Protocol-Version
          in: header
          schema: {type: string}
          example: '2025-11-25'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcMessage'
            example:
              jsonrpc: '2.0'
              id: 1
              method: tools/call
              params:
                name: search_catalog
                arguments: {query: blue hour, types: [track]}
      responses:
        '200':
          description: A JSON-RPC response, or an SSE stream of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcMessage'
            text/event-stream:
              schema:
                type: string
        '202':
          description: Accepted (for notifications and responses sent by the client).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [AI]
      operationId: mcpStream
      summary: Open the MCP server-to-client SSE stream
      security:
        - oauth2: [library:read]
        - personalToken: [library:read]
      parameters:
        - name: Mcp-Session-Id
          in: header
          schema: {type: string}
      responses:
        '200':
          description: An SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: The server offers no standalone stream.

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.1. Public clients use the authorization code flow with S256 PKCE, or the device
        authorization grant (RFC 8628) on TVs and command lines. Access tokens are short-lived
        (an hour is typical); refresh tokens rotate on every use and need `offline_access`.
        Endpoint locations come from `/.well-known/oauth-authorization-server`.
      flows:
        authorizationCode:
          authorizationUrl: https://music.example.com/oauth/authorize
          tokenUrl: https://music.example.com/oauth/token
          refreshUrl: https://music.example.com/oauth/token
          scopes:
            library:read: Browse and search the catalog, read lyrics and fetch artwork.
            media:read: Stream and download audio through playback decisions and signed URLs.
            user:read: Read the user's favourites, ratings, My Library, playlists, queues and play history.
            user:write: Change the user's favourites, ratings, My Library, playlists and queues.
            plays:write: Record plays and report now playing. Nothing else.
            account: Manage the user's personal access tokens, app sessions and webhooks.
            admin: Manage users, scans and server settings. Only granted to admins.
            offline_access: Receive a refresh token.
    personalToken:
      type: http
      scheme: bearer
      description: |
        A personal access token created with `POST /me/tokens`, sent as `Authorization: Bearer`.
        Tokens start with `dulcet_pat_`, access tokens with `dulcet_at_` and refresh tokens with
        `dulcet_rt_`, so secret scanners can find a leaked one. The required scopes listed on each
        operation apply to personal tokens too.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: An opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size. The server may return fewer items than asked, even zero, and still have more.
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    Scope:
      name: scope
      in: query
      description: |
        `all` (default) is everything the user can see (Browse). `library` is My Library: items that
        are members, plus artists and albums that contain a member. `favorites` is favourites.
        Open set.
      schema: {type: string, default: all}
    LibraryId:
      name: libraryId
      in: query
      description: Only items in this library (top-level folder). Repeatable.
      schema: {type: string}
    Ids:
      name: ids
      in: query
      description: Comma-separated ids to fetch, at most `limits.maxBatchSize`. Unknown ids are left out of the result.
      schema: {type: string}
    ArtistId:
      name: artistId
      in: path
      required: true
      schema: {type: string}
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: {type: string}
    TrackId:
      name: trackId
      in: path
      required: true
      schema: {type: string}
    ItemId:
      name: itemId
      in: path
      required: true
      description: Any artist, album, track or (for favourites) playlist id. Ids are unique across types, so the type is implied.
      schema: {type: string}
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: {type: string}
    EntryId:
      name: entryId
      in: path
      required: true
      schema: {type: string}
    QueueId:
      name: queueId
      in: path
      required: true
      description: Chosen by the client; normally its stable device id.
      schema: {type: string, maxLength: 128}
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: {type: string}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string}
    Grant:
      name: grant
      in: path
      required: true
      description: An opaque, signed, expiring grant. Never log it.
      schema: {type: string}
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag from an earlier response. A match answers 304 with no body.
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      description: The revision ETag last read. A mismatch answers 412 with the current state.
      schema: {type: string}
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: The revision ETag last read. Absent answers 428; a mismatch answers 412.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A client-generated unique string (a UUID) that makes a POST safe to retry. The server keeps
        each key with a fingerprint of its request for at least 24 hours. A repeat returns the first
        response; the same key with a different request answers 422 `idempotency-key-reused`.
      schema: {type: string, maxLength: 255}

  headers:
    ETag:
      description: The representation's version; quote-wrapped, strong.
      schema: {type: string}
      example: '"r_10431"'
    SyncCursor:
      description: |
        The change-feed position this response was read at. A client that caches the response can
        bring it up to date by reading `/sync/changes` from this cursor.
      schema: {type: string}
      example: sc_AQAAAAAAKNY
    Location:
      description: The new resource's URL.
      schema: {type: string, format: uri-reference}
    CacheControl:
      description: Caching directives.
      schema: {type: string}
      example: public, max-age=31536000, immutable
    NoStore:
      description: The response holds a secret or a signed URL and must not be cached.
      schema: {type: string, const: no-store}
    RetryAfter:
      description: Seconds to wait before retrying (RFC 9110 §10.2.3).
      schema: {type: integer, minimum: 0}

  responses:
    NotModified:
      description: The representation has not changed since the ETag sent.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    Replaced:
      description: |
        The id was merged into another. `Location` points at the surviving resource; the change feed
        carries a tombstone with `replacedBy`. Clients rewrite stored references.
      headers:
        Location:
          $ref: '#/components/headers/Location'
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:invalid-request
            title: The request is not valid.
            status: 400
            detail: limit must be between 1 and 500.
            errors:
              - {pointer: '#/limit', detail: must be between 1 and 500}
    Unauthorized:
      description: No valid token. The `WWW-Authenticate` header names the scheme and, for OAuth clients, the resource metadata.
      headers:
        WWW-Authenticate:
          schema: {type: string}
          example: Bearer resource_metadata="https://music.example.com/.well-known/oauth-protected-resource"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:unauthenticated
            title: A valid token is required.
            status: 401
    Forbidden:
      description: The token lacks a scope, or the user lacks a permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:insufficient-scope
            title: The token does not hold the required scope.
            status: 403
            requiredScopes: [user:write]
    NotFound:
      description: No such resource, or the user cannot see it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:not-found
            title: Not found.
            status: 404
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:conflict
            title: The resource changed while this list was being read.
            status: 409
    PreconditionFailed:
      description: '`If-Match` did not match. The body carries the current representation in `current`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:revision-mismatch
            title: The resource was changed by someone else.
            status: 412
            currentRevision: r_10460
    PreconditionRequired:
      description: This write requires `If-Match`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:precondition-required
            title: Send If-Match with the revision you last read.
            status: 428
    UnprocessableContent:
      description: The request is well-formed but cannot be applied (for example an unknown track id in a playlist, or a reused idempotency key).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:unknown-item
            title: An id in the request is not in the catalog.
            status: 422
            errors:
              - {pointer: '#/trackIds/1', detail: trk_zzz is not in the catalog}
    TooManyRequests:
      description: Rate limited. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:rate-limited
            title: Too many requests.
            status: 429
    CursorExpired:
      description: The sync cursor is too old or from another server incarnation. Resync from `start=snapshot` or `start=now`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:cursor-expired
            title: This sync cursor can no longer be served.
            status: 410
            detail: The server keeps 90 days of changes. Start a new sync.
    MediaGrantInvalid:
      description: The signed URL expired, was revoked or was tampered with. Ask for a new one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:media-grant-expired
            title: This media URL has expired.
            status: 403

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `type` is a stable URN that clients switch on; `title` and `detail` are for people and may be localised.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            Known values: `urn:dulcet:problem:` + `invalid-request`, `unauthenticated`,
            `insufficient-scope`, `permission-denied`, `not-found`, `conflict`, `revision-mismatch`,
            `precondition-required`, `unknown-item`, `idempotency-key-reused`, `rate-limited`,
            `cursor-expired`, `media-grant-expired`, `unsupported-media`, `server-error`,
            `unavailable`. Open set; treat an unknown type by its `status`.
          examples: ['urn:dulcet:problem:not-found']
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance:
          type: string
          description: An id for this occurrence, which the server's own logs also carry.
        errors:
          type: array
          description: Per-field problems, each pointing into the request.
          items:
            type: object
            required: [detail]
            properties:
              pointer: {type: string, description: 'A JSON Pointer into the request body, or `#/<name>` for a parameter.'}
              detail: {type: string}
        requiredScopes:
          type: array
          items: {type: string}
        currentRevision: {type: string}
        current:
          description: The current representation, on a 412.
          type: object

    Extensions:
      type: object
      description: Vendor data, keyed by a reverse-DNS capability name the server advertises. Clients ignore keys they do not know.
      additionalProperties: true
      examples:
        - org.example.moods: {energy: 0.42}

    Discovery:
      type: object
      required: [standard, apis, server]
      properties:
        standard:
          type: string
          const: dulcet
        apis:
          type: array
          items:
            type: object
            required: [version, baseUrl, status]
            properties:
              version: {type: string, description: The major version.}
              baseUrl: {type: string, format: uri}
              status: {type: string, description: 'Known values: `current`, `deprecated`, `preview`.'}
              sunsetAt: {type: [string, 'null'], format: date-time}
        server:
          $ref: '#/components/schemas/ServerInfo'
        authorizationServer: {type: string, format: uri, description: The OAuth issuer; append `/.well-known/oauth-authorization-server`.}
        openapi: {type: string, format: uri}
        mcp: {type: [string, 'null'], format: uri}
        opensubsonic:
          type: [string, 'null']
          format: uri
          description: Where this server also serves OpenSubsonic `/rest`, if it does.

    ServerInfo:
      type: object
      required: [name, version, instanceId]
      properties:
        name: {type: string}
        version: {type: string}
        instanceId:
          type: string
          description: Changes when the server's database is replaced or restored, which also invalidates sync cursors.

    Capabilities:
      type: object
      required: [apiVersion, server, capabilities, limits, auth]
      properties:
        apiVersion:
          type: string
          description: '`1.<minor>`. Minor versions only add.'
          pattern: '^1\.[0-9]+$'
        server:
          $ref: '#/components/schemas/ServerInfo'
        capabilities:
          type: object
          description: |
            Capability name to descriptor. Core names start with `dulcet.`; vendor names are
            reverse-DNS (`org.example.radio`). Clients act only on names and versions they know.
          additionalProperties:
            $ref: '#/components/schemas/Capability'
        limits:
          type: object
          required: [maxPageSize, maxBatchSize, syncRetentionDays, mediaUrlTtlSeconds]
          properties:
            maxPageSize: {type: integer}
            maxBatchSize: {type: integer}
            syncRetentionDays: {type: integer, minimum: 30}
            mediaUrlTtlSeconds: {type: integer, minimum: 3600}
        auth:
          type: object
          required: [flows, scopes]
          properties:
            flows:
              type: array
              description: 'Known values: `authorization_code`, `device_code`, `refresh_token`, `personal_token`.'
              items: {type: string}
            scopes:
              type: array
              items: {type: string}
        permissions:
          type: object
          description: Present only with a token. What this token and user may do.
          properties:
            scopes:
              type: array
              items: {type: string}
            download: {type: boolean}
            share: {type: boolean}
            admin: {type: boolean}

    Capability:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: {type: integer, minimum: 1}
      additionalProperties: true

    AuthorizationServerMetadata:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, response_types_supported]
      properties:
        issuer: {type: string, format: uri}
        authorization_endpoint: {type: string, format: uri}
        token_endpoint: {type: string, format: uri}
        device_authorization_endpoint: {type: string, format: uri}
        revocation_endpoint: {type: string, format: uri}
        registration_endpoint: {type: string, format: uri}
        grant_types_supported:
          type: array
          items: {type: string}
        response_types_supported:
          type: array
          items: {type: string}
        code_challenge_methods_supported:
          type: array
          items: {type: string}
        token_endpoint_auth_methods_supported:
          type: array
          items: {type: string}
        client_id_metadata_document_supported: {type: boolean}
        scopes_supported:
          type: array
          items: {type: string}
      additionalProperties: true

    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource: {type: string, format: uri}
        authorization_servers:
          type: array
          items: {type: string, format: uri}
        bearer_methods_supported:
          type: array
          items: {type: string}
        scopes_supported:
          type: array
          items: {type: string}
      additionalProperties: true

    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          description: '`authorization_code`, `refresh_token` or `urn:ietf:params:oauth:grant-type:device_code`.'
        client_id: {type: string}
        code: {type: string}
        redirect_uri: {type: string}
        code_verifier: {type: string}
        refresh_token: {type: string}
        device_code: {type: string}
        scope: {type: string, description: 'On refresh, an equal or narrower scope.'}
        resource: {type: string, format: uri}

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer}
        refresh_token: {type: string}
        scope: {type: string}

    OAuthError:
      type: object
      required: [error]
      properties:
        error: {type: string}
        error_description: {type: string}

    DeviceAuthorizationRequest:
      type: object
      required: [client_id]
      properties:
        client_id: {type: string}
        scope: {type: string}

    DeviceAuthorizationResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in]
      properties:
        device_code: {type: string}
        user_code: {type: string}
        verification_uri: {type: string, format: uri}
        verification_uri_complete: {type: string, format: uri}
        expires_in: {type: integer}
        interval: {type: integer, default: 5}

    RevocationRequest:
      type: object
      required: [token]
      properties:
        token: {type: string}
        token_type_hint: {type: string}
        client_id: {type: string}

    ClientRegistrationRequest:
      type: object
      required: [client_name, redirect_uris]
      properties:
        client_name: {type: string}
        client_uri: {type: string, format: uri}
        logo_uri: {type: string, format: uri}
        redirect_uris:
          type: array
          items: {type: string}
        grant_types:
          type: array
          items: {type: string}
        token_endpoint_auth_method: {type: string, const: none}
      additionalProperties: true

    ClientRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/ClientRegistrationRequest'
        - type: object
          required: [client_id]
          properties:
            client_id: {type: string}

    User:
      type: object
      required: [id, username, roles, permissions, libraryIds, createdAt]
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        roles:
          type: array
          description: 'Known values: `admin`.'
          items: {type: string}
        permissions:
          $ref: '#/components/schemas/UserPermissions'
        libraryIds:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        extensions:
          $ref: '#/components/schemas/Extensions'

    UserPermissions:
      type: object
      properties:
        download: {type: boolean, description: May download original files.}
        share: {type: boolean, description: May make playlists visible to others and share now playing.}
      additionalProperties: {type: boolean}

    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [token]
          properties:
            token:
              type: object
              required: [id, kind, scopes]
              properties:
                id: {type: string}
                kind: {type: string, description: 'Known values: `oauth`, `personal`.'}
                scopes:
                  type: array
                  items: {type: string}
                clientName: {type: string}

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        displayName: {type: string}
        password: {type: string, minLength: 8, writeOnly: true}
        roles:
          type: array
          items: {type: string}
        permissions:
          $ref: '#/components/schemas/UserPermissions'
        libraryIds:
          type: array
          items: {type: string}

    UserUpdate:
      type: object
      properties:
        displayName: {type: string}
        password: {type: string, minLength: 8, writeOnly: true}
        roles:
          type: array
          items: {type: string}
        permissions:
          $ref: '#/components/schemas/UserPermissions'
        libraryIds:
          type: array
          items: {type: string}

    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'

    Token:
      type: object
      required: [id, kind, name, scopes, createdAt]
      properties:
        id: {type: string}
        kind: {type: string, description: 'Known values: `personal`, `oauth`.'}
        name: {type: string}
        clientName: {type: string}
        scopes:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        hint: {type: string, description: 'The first characters of the secret, to recognise it.'}

    TokenPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Token'

    PersonalTokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        scopes:
          type: array
          minItems: 1
          items: {type: string}
        expiresInDays: {type: [integer, 'null'], minimum: 1, description: Null for no expiry.}

    PersonalTokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [secret]
          properties:
            secret: {type: string, description: Shown once. Store it like a password.}

    PageInfo:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Null on the last page. Opaque; never parse or build one.
        total:
          type: integer
          description: The collection's size when this page was read, when the server can count cheaply. May be absent.

    ItemRef:
      type: object
      required: [id]
      properties:
        id: {type: string}
        type: {type: string, description: 'Known values: `artist`, `album`, `track`, `playlist`.'}
        name: {type: string, description: An artist's name or a playlist's name.}
        title: {type: string, description: An album's or track's title.}

    ArtistRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}

    AlbumRef:
      type: object
      required: [id, title]
      properties:
        id: {type: string}
        title: {type: string}
        artwork:
          $ref: '#/components/schemas/Artwork'

    Artwork:
      type: object
      required: [id]
      description: An image. Fetch with `GET /artwork/{id}` or a signed URL.
      properties:
        id: {type: string}
        width: {type: integer}
        height: {type: integer}
        color: {type: string, description: 'A dominant colour as `#rrggbb`, for placeholders.', pattern: '^#[0-9a-fA-F]{6}$'}

    ExternalIds:
      type: object
      description: Identifiers in public registries, so items can be matched across servers and services.
      properties:
        musicbrainzArtistId: {type: string, format: uuid}
        musicbrainzReleaseId: {type: string, format: uuid}
        musicbrainzReleaseGroupId: {type: string, format: uuid}
        musicbrainzRecordingId: {type: string, format: uuid}
        musicbrainzTrackId: {type: string, format: uuid}
        isrc: {type: string}
        barcode: {type: string}
      additionalProperties: {type: string}

    Credit:
      type: object
      required: [artist, role]
      properties:
        artist:
          $ref: '#/components/schemas/ArtistRef'
        role:
          type: string
          description: 'Known values: `artist`, `albumArtist`, `featured`, `composer`, `lyricist`, `producer`, `remixer`, `conductor`, `performer`, `arranger`. Open set.'
        creditedAs: {type: string, description: 'The name exactly as tagged, when it differs from the artist''s name.'}

    Genre:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        type: {type: string, const: genre}
        name: {type: string}
        albumCount: {type: integer}
        trackCount: {type: integer}

    Library:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        type: {type: string, const: library}
        name: {type: string}
        trackCount: {type: integer}

    UserState:
      type: object
      description: The requesting user's state for an item. Present on every catalog read; absent from catalog entries in the change feed, where it travels as `itemState`.
      required: [favoritedAt, rating, playCount, lastPlayedAt, libraryAddedAt]
      properties:
        favoritedAt: {type: [string, 'null'], format: date-time}
        rating: {type: [integer, 'null'], minimum: 1, maximum: 10, description: 1 to 10. A five-star client shows half stars or maps n stars to 2n.}
        playCount: {type: integer, minimum: 0}
        lastPlayedAt: {type: [string, 'null'], format: date-time}
        libraryAddedAt: {type: [string, 'null'], format: date-time, description: When the item became a direct My Library member; null if it is not one.}

    ItemState:
      allOf:
        - type: object
          required: [itemId, itemType, revision]
          properties:
            itemId: {type: string}
            itemType: {type: string, description: 'Known values: `artist`, `album`, `track`, `playlist`.'}
            revision: {type: string}
        - $ref: '#/components/schemas/UserState'

    Artist:
      type: object
      required: [id, type, name, revision]
      properties:
        id: {type: string}
        type: {type: string, const: artist}
        name: {type: string}
        sortName: {type: string}
        albumCount: {type: integer}
        trackCount: {type: integer}
        artwork:
          $ref: '#/components/schemas/Artwork'
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        userState:
          $ref: '#/components/schemas/UserState'
        revision: {type: string}
        extensions:
          $ref: '#/components/schemas/Extensions'

    ArtistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Artist'

    Album:
      type: object
      required: [id, type, title, credits, artistDisplay, trackCount, durationMs, revision]
      properties:
        id: {type: string}
        type: {type: string, const: album}
        title: {type: string}
        sortTitle: {type: string}
        edition: {type: string, description: 'An edition or version name, such as "Deluxe".'}
        credits:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
        artistDisplay: {type: string, description: 'The artist line to show, as tagged.'}
        releaseDate:
          type: string
          description: A partial date, `YYYY`, `YYYY-MM` or `YYYY-MM-DD`.
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
        originalReleaseDate:
          type: string
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
        releaseTypes:
          type: array
          description: 'Known values: `album`, `ep`, `single`, `compilation`, `live`, `soundtrack`, `remix`, `demo`. Open set.'
          items: {type: string}
        isCompilation: {type: boolean}
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        label: {type: string}
        trackCount: {type: integer}
        discCount: {type: integer}
        durationMs: {type: integer}
        artwork:
          $ref: '#/components/schemas/Artwork'
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        addedAt: {type: string, format: date-time}
        userState:
          $ref: '#/components/schemas/UserState'
        revision: {type: string}
        extensions:
          $ref: '#/components/schemas/Extensions'

    AlbumDetail:
      allOf:
        - $ref: '#/components/schemas/Album'
        - type: object
          required: [discs]
          properties:
            discs:
              type: array
              items:
                type: object
                required: [number, tracks]
                properties:
                  number: {type: integer}
                  title: {type: string}
                  tracks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Track'

    AlbumPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Album'

    AudioInfo:
      type: object
      properties:
        codec: {type: string, description: 'Known values: `flac`, `alac`, `aac`, `mp3`, `opus`, `vorbis`, `wav`, `aiff`, `wavpack`, `ape`. Open set.'}
        container: {type: string}
        bitrate: {type: integer, description: 'Bits per second of the audio stream, without embedded pictures or padding.'}
        sampleRate: {type: integer}
        bitDepth: {type: integer}
        channels: {type: integer}
        sizeBytes: {type: integer}
        lossless: {type: boolean}

    Loudness:
      type: object
      description: ReplayGain-style values.
      properties:
        trackGainDb: {type: number}
        trackPeak: {type: number}
        albumGainDb: {type: number}
        albumPeak: {type: number}

    Track:
      type: object
      required: [id, type, title, album, credits, artistDisplay, durationMs, revision]
      properties:
        id: {type: string}
        type: {type: string, const: track}
        title: {type: string}
        sortTitle: {type: string}
        album:
          $ref: '#/components/schemas/AlbumRef'
        credits:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
        artistDisplay: {type: string}
        discNumber: {type: integer}
        trackNumber: {type: integer}
        durationMs: {type: integer}
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        releaseDate:
          type: string
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
        explicit: {type: [boolean, 'null']}
        bpm: {type: number}
        audio:
          $ref: '#/components/schemas/AudioInfo'
        loudness:
          $ref: '#/components/schemas/Loudness'
        lyrics:
          type: object
          properties:
            available: {type: boolean}
            synced: {type: boolean}
        artwork:
          $ref: '#/components/schemas/Artwork'
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        addedAt: {type: string, format: date-time}
        userState:
          $ref: '#/components/schemas/UserState'
        revision: {type: string}
        extensions:
          $ref: '#/components/schemas/Extensions'

    TrackPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Track'

    GenrePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Genre'

    LibraryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Library'

    Lyrics:
      type: object
      required: [trackId, documents]
      properties:
        trackId: {type: string}
        documents:
          type: array
          items:
            $ref: '#/components/schemas/LyricsDocument'

    LyricsDocument:
      type: object
      required: [kind, synced, lines]
      properties:
        kind: {type: string, description: 'Known values: `main`, `translation`, `pronunciation`. Open set.'}
        language: {type: string, description: A BCP 47 tag; `und` when unknown.}
        synced: {type: boolean}
        offsetMs: {type: integer, default: 0, description: Already applied to every time below; informational.}
        source: {type: string, description: 'Known values: `embedded`, `sidecar`, `provider`. Open set.'}
        provider: {type: string, description: 'When `source` is `provider`, its name, for attribution.'}
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LyricsLine'

    LyricsLine:
      type: object
      required: [text]
      properties:
        startMs: {type: integer, description: Absent on unsynced lyrics.}
        endMs: {type: integer}
        text: {type: string}
        voice: {type: string, description: 'A singer or part label, for duets and backing vocals.'}
        words:
          type: array
          description: Word or syllable timing, when the source has it.
          items:
            type: object
            required: [startMs, text]
            properties:
              startMs: {type: integer}
              endMs: {type: integer}
              text: {type: string}

    SearchResults:
      type: object
      properties:
        artists:
          $ref: '#/components/schemas/ArtistPage'
        albums:
          $ref: '#/components/schemas/AlbumPage'
        tracks:
          $ref: '#/components/schemas/TrackPage'
        playlists:
          $ref: '#/components/schemas/PlaylistPage'

    DeviceProfile:
      type: object
      required: [directPlay]
      properties:
        name: {type: string}
        maxBitrate: {type: integer, description: Bits per second; the ceiling for whatever the server sends.}
        network: {type: string, description: 'Known values: `wifi`, `cellular`, `ethernet`, `unknown`.'}
        directPlay:
          type: array
          description: Formats the device plays as-is.
          items:
            $ref: '#/components/schemas/FormatSupport'
        transcodeTargets:
          type: array
          description: Formats the device accepts from a transcode, in order of preference.
          items:
            $ref: '#/components/schemas/FormatSupport'

    FormatSupport:
      type: object
      required: [container, codec]
      properties:
        container: {type: string}
        codec: {type: string}
        maxSampleRate: {type: integer}
        maxBitDepth: {type: integer}
        maxChannels: {type: integer}

    PlaybackRequest:
      type: object
      required: [trackId, profile]
      properties:
        trackId: {type: string}
        purpose: {type: string, description: '`stream` (default) or `download`.', default: stream}
        startMs: {type: integer, minimum: 0, default: 0, description: Start a transcode here. Direct files seek by byte range instead.}
        profile:
          $ref: '#/components/schemas/DeviceProfile'

    PlaybackPlan:
      type: object
      required: [trackId, mode, url, expiresAt, mimeType, container, codec, durationMs, lengthExact, byteRanges]
      properties:
        trackId: {type: string}
        mode: {type: string, description: '`direct` (the original file) or `transcode`. Open set.'}
        reasons:
          type: array
          description: 'Why a transcode was chosen. Known values: `containerNotSupported`, `codecNotSupported`, `bitrateAboveLimit`, `sampleRateAboveLimit`, `bitDepthAboveLimit`, `channelsAboveLimit`, `startOffset`.'
          items: {type: string}
        url: {type: string, format: uri, description: A signed URL. Open it with no headers. Never log it.}
        expiresAt: {type: string, format: date-time}
        mimeType: {type: string}
        container: {type: string}
        codec: {type: string}
        bitrate: {type: integer}
        sampleRate: {type: integer}
        bitDepth: {type: integer}
        channels: {type: integer}
        startMs: {type: integer}
        durationMs: {type: integer}
        contentLength: {type: [integer, 'null'], description: Bytes; an estimate unless `lengthExact`.}
        lengthExact: {type: boolean}
        byteRanges: {type: boolean, description: Whether the URL serves byte ranges now.}

    MediaUrlRequest:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [kind, id]
            properties:
              kind: {type: string, description: '`artwork` (an artwork id) or `original` (a track id; the unaltered file).'}
              id: {type: string}
              size: {type: integer, description: 'For artwork, the longest edge in pixels.'}

    MediaUrls:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: object
            required: [kind, id, url, expiresAt]
            properties:
              kind: {type: string}
              id: {type: string}
              url: {type: string, format: uri}
              expiresAt: {type: string, format: date-time}

    LibraryMemberPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items, counts]
          properties:
            items:
              type: array
              items:
                type: object
                required: [item, libraryAddedAt]
                properties:
                  item:
                    $ref: '#/components/schemas/ItemRef'
                  libraryAddedAt: {type: string, format: date-time}
            counts:
              type: object
              description: Whole-library totals for the user, whatever the page or filter.
              properties:
                artist: {type: integer}
                album: {type: integer}
                track: {type: integer}

    FavoritePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [item, favoritedAt]
                properties:
                  item:
                    $ref: '#/components/schemas/ItemRef'
                  favoritedAt: {type: string, format: date-time}

    RatingSet:
      type: object
      required: [rating]
      properties:
        rating: {type: integer, minimum: 1, maximum: 10}

    UserStateBatch:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [op, itemId]
            properties:
              op: {type: string, enum: [favorite, unfavorite, rate, unrate, libraryAdd, libraryRemove]}
              itemId: {type: string}
              rating: {type: integer, minimum: 1, maximum: 10}

    UserStateBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [status]
            properties:
              status: {type: integer, description: The HTTP status the single-item endpoint would have answered.}
              problem:
                $ref: '#/components/schemas/Problem'

    Play:
      type: object
      required: [id, trackId, startedAt, listenedMs]
      properties:
        id: {type: string, format: uuid, description: Generated by the client when the listen begins. The server records each id once.}
        trackId: {type: string}
        startedAt: {type: string, format: date-time, description: Wall-clock time the listen began.}
        listenedMs: {type: integer, minimum: 0, description: 'Progressing media time actually played, excluding pauses, buffering and skipped-over spans.'}
        completed: {type: boolean, description: Whether playback reached the end of the track.}
        deviceId: {type: string}
        client: {type: string, description: 'The client''s name and version, such as "Dulcet/1.4".'}
        context:
          type: object
          description: Where the play came from.
          properties:
            type: {type: string, description: 'Known values: `album`, `artist`, `playlist`, `search`, `library`, `queue`, `radio`.'}
            id: {type: string}
        offline: {type: boolean, description: Played without a connection and submitted later.}
        recordedAt: {type: string, format: date-time, readOnly: true}

    PlayPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Play'

    PlaySubmission:
      type: object
      required: [plays]
      properties:
        plays:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Play'

    PlaySubmissionResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: {type: string}
              status: {type: string, description: 'Known values: `recorded`, `duplicate`, `unknownTrack`, `ignored`. Only `recorded` changed a count.'}
              detail: {type: string}

    NowPlayingReport:
      type: object
      required: [deviceId, trackId, state, positionMs]
      properties:
        deviceId: {type: string}
        deviceName: {type: string}
        trackId: {type: string}
        state: {type: string, description: 'Known values: `playing`, `paused`, `buffering`.'}
        positionMs: {type: integer, minimum: 0}
        ttlSeconds: {type: integer, minimum: 30, maximum: 600, default: 120}

    NowPlaying:
      allOf:
        - $ref: '#/components/schemas/NowPlayingReport'
        - type: object
          required: [userId, updatedAt, expiresAt]
          properties:
            userId: {type: string}
            userName: {type: string}
            track:
              $ref: '#/components/schemas/Track'
            updatedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}

    PlaylistCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        visibility: {type: string, description: '`private` (default) or `public` (every user of this server can read it).', default: private}
        trackIds:
          type: array
          maxItems: 10000
          items: {type: string}

    PlaylistUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null']}
        visibility: {type: string}

    Playlist:
      type: object
      required: [id, type, name, owner, visibility, readOnly, itemCount, revision]
      properties:
        id: {type: string}
        type: {type: string, const: playlist}
        name: {type: string}
        description: {type: string}
        owner:
          $ref: '#/components/schemas/UserRef'
        visibility: {type: string, description: 'Known values: `private`, `public`.'}
        readOnly: {type: boolean, description: True when the requesting user cannot edit it.}
        itemCount: {type: integer}
        durationMs: {type: integer}
        artwork:
          $ref: '#/components/schemas/Artwork'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        revision: {type: string, description: Changes on every edit to the playlist or its entries; send it as `If-Match`.}
        extensions:
          $ref: '#/components/schemas/Extensions'

    PlaylistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Playlist'

    PlaylistItem:
      type: object
      required: [entryId, position, track]
      properties:
        entryId: {type: string}
        position: {type: integer, minimum: 0}
        track:
          $ref: '#/components/schemas/Track'
        addedAt: {type: string, format: date-time}

    PlaylistItemPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items, revision]
          properties:
            revision:
              type: string
              description: The playlist revision every page of this walk was read at. If the playlist changes mid-walk, the next page answers 409 and the walk restarts.
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlaylistItem'

    PlaylistItemsReplace:
      type: object
      required: [trackIds]
      properties:
        trackIds:
          type: array
          maxItems: 10000
          items: {type: string}

    PlaylistItemsInsert:
      type: object
      required: [trackIds]
      properties:
        trackIds:
          type: array
          minItems: 1
          maxItems: 10000
          items: {type: string}
        beforeEntryId: {type: [string, 'null'], description: Insert before this entry; null or absent appends.}

    PlaylistItemMove:
      type: object
      properties:
        beforeEntryId: {type: [string, 'null'], description: Move before this entry; null moves to the end.}

    QueueEntry:
      type: object
      required: [entryId, trackId]
      properties:
        entryId: {type: string, description: 'Chosen by the client, unique within the queue.'}
        trackId: {type: string}
        track:
          $ref: '#/components/schemas/Track'

    QueueSave:
      type: object
      required: [entries]
      properties:
        deviceName: {type: string}
        entries:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/QueueEntry'
        currentEntryId: {type: [string, 'null']}
        positionMs: {type: integer, minimum: 0, default: 0}
        shuffle: {type: boolean, default: false}
        repeat: {type: string, description: 'Known values: `off`, `all`, `one`.', default: 'off'}

    QueueSummary:
      type: object
      required: [id, entryCount, updatedAt, revision]
      properties:
        id: {type: string}
        deviceName: {type: string}
        entryCount: {type: integer}
        currentTrack:
          $ref: '#/components/schemas/Track'
        positionMs: {type: integer}
        updatedAt: {type: string, format: date-time}
        revision: {type: string}

    Queue:
      allOf:
        - $ref: '#/components/schemas/QueueSave'
        - type: object
          required: [id, updatedAt, revision]
          properties:
            id: {type: string}
            updatedAt: {type: string, format: date-time}
            updatedBy: {type: string, description: The client that saved it last.}
            revision: {type: string}

    Change:
      type: object
      required: [op, type, id, revision, at]
      properties:
        op: {type: string, description: '`upsert` (the entity now looks like `resource`) or `delete` (a tombstone). Open set; skip an op you do not know.'}
        type: {type: string, description: 'Known values: `artist`, `album`, `track`, `genre`, `library`, `itemState`, `playlist`, `play`, `queue`. Open set; skip a type you do not know.'}
        id: {type: string, description: 'The entity''s id. For `itemState`, the item''s id.'}
        revision: {type: string, description: Matches the entity's `revision` and ETag after this change.}
        at: {type: string, format: date-time}
        resource:
          type: object
          description: On `upsert`, the entity's current representation, shaped as its own endpoint returns it (catalog entities without `userState`). A server may coalesce several changes to one entity into its latest state.
        replacedBy: {type: string, description: 'On `delete`, the id this entity was merged into, if any.'}

    ChangePage:
      type: object
      required: [changes, nextCursor, hasMore, phase]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        nextCursor: {type: string, description: Always present. Store it once `hasMore` is false.}
        hasMore: {type: boolean}
        phase: {type: string, description: '`snapshot` while a snapshot is being delivered, then `changes`.'}

    Webhook:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id: {type: string}
        url: {type: string, format: uri}
        events:
          type: array
          description: 'Known values: `play.recorded`, `nowPlaying.changed`, `itemState.changed`, `playlist.changed`, `library.changed`, `scan.completed`, `ping`. `*` for all the creator may read.'
          items: {type: string}
        description: {type: string}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastDeliveryAt: {type: [string, 'null'], format: date-time}
        consecutiveFailures: {type: integer}
        disabledReason: {type: [string, 'null']}

    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url: {type: string, format: uri}
        events:
          type: array
          minItems: 1
          items: {type: string}
        description: {type: string}

    WebhookUpdate:
      type: object
      properties:
        events:
          type: array
          items: {type: string}
        description: {type: string}
        active: {type: boolean}

    WebhookCreated:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          required: [secret]
          properties:
            secret: {type: string, description: '`whsec_` plus base64. Shown once.'}

    WebhookDelivery:
      type: object
      required: [id, event, attemptedAt]
      properties:
        id: {type: string}
        event: {type: string}
        attemptedAt: {type: string, format: date-time}
        responseStatus: {type: [integer, 'null']}
        error: {type: [string, 'null']}

    Scan:
      type: object
      required: [id, kind, state]
      properties:
        id: {type: string}
        kind: {type: string, description: '`quick` (changed files only) or `full`.'}
        state: {type: string, description: 'Known values: `queued`, `running`, `completed`, `failed`.'}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        counts:
          type: object
          properties:
            added: {type: integer}
            updated: {type: integer}
            removed: {type: integer}
        error: {type: string}

    ScanStart:
      type: object
      properties:
        kind: {type: string, default: quick}

    JsonRpcMessage:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {type: [string, integer]}
        method: {type: string}
        params: {type: object}
        result: {type: object}
        error:
          type: object
          properties:
            code: {type: integer}
            message: {type: string}
