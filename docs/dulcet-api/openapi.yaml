  /me/devices:
    get:
      tags: [Queue]
      operationId: listDevices
      summary: List the user's devices, with which are online and which one is playing
      description: |
        A device is one installation of a client, named by a stable id it generates once (a UUID)
        and sends as `Dulcet-Device-Id`. A device is `online` while it holds an `/events` stream
        with that header, or has made any authenticated request carrying that header within the
        last two minutes. Registering is such a request, so a newly registered device is online for
        two minutes. Only online devices with
        `canPlay` can receive a transfer.
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      responses:
        '200':
          description: Devices seen in the last 30 days, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
              example:
                items:
                  - {id: dev_iphone_3c, name: Robin's iPhone, kind: phone, canPlay: true, online: true, active: true, lastSeenAt: '2026-10-12T10:00:00.000Z'}
                  - {id: dev_tv_81, name: Living room TV, kind: tv, canPlay: true, online: true, active: false, lastSeenAt: '2026-10-12T09:59:41.000Z'}
                  - {id: dev_web_02, name: Firefox on the laptop, kind: web, canPlay: false, online: false, active: false, lastSeenAt: '2026-10-10T21:12:00.000Z'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'

  /me/devices/{deviceId}:
    put:
      tags: [Queue]
      operationId: registerDevice
      summary: Name this device and say whether it can play
      description: Idempotent. Call on first launch and whenever the name changes.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
            example:
              name: Living room TV
              kind: tv
              canPlay: true
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example: {id: dev_tv_81, name: Living room TV, kind: tv, canPlay: true, online: true, active: false, lastSeenAt: '2026-10-12T10:00:00.000Z'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    delete:
      tags: [Queue]
      operationId: forgetDevice
      summary: Forget a device
      description: Removes it from the list. If it was the active device, the queue has no active device afterwards.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '204':
          description: Forgotten, or unknown.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'

  /me/queue:
    get:
      tags: [Queue]
      operationId: getQueue
      summary: Get the user's shared queue (without its entries)
      description: |
        Every user has exactly one queue, which every device follows (README "Queue"). It always
        exists; a new user's is empty. This returns its state; entries are paged from
        `/me/queue/entries`, and the live position from `/me/queue/playback`. The ETag is the
        queue's `revision`.
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The queue.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Dulcet-Sync-Cursor:
              $ref: '#/components/headers/SyncCursor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
              example:
                revision: r_10471
                entryCount: 2
                currentEntryId: qe_91
                shuffle: false
                repeat: 'off'
                context: {type: album, id: alb_7d}
                activeDeviceId: dev_iphone_3c
                updatedAt: '2026-10-12T10:00:00.000Z'
                updatedBy: dev_iphone_3c
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    put:
      tags: [Queue]
      operationId: replaceQueue
      summary: Replace the queue's contents, as when playing an album or playlist
      description: |
        Requires `If-Match` with the queue's current revision; a stale revision answers `412` with
        the current queue in `current`. Server-assigned `entryId`s are new for every entry. With
        `play: true` the calling device (from `Dulcet-Device-Id`) also becomes the active device,
        exactly as `POST /me/queue/transfer` would make it.

        A person's explicit action (they tapped play) retries a `412` once with the new revision,
        since their intent is to replace. An automatic write (restoring a queue on launch, an offline
        session reconnecting) never retries: it shows the current queue and lets the person choose.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueReplace'
            example:
              itemIds: [trk_4f1, trk_51a]
              currentIndex: 0
              positionMs: 0
              shuffle: false
              repeat: 'off'
              context: {type: album, id: alb_7d}
              play: true
      responses:
        '200':
          description: The queue after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
              example:
                revision: r_10472
                entryCount: 2
                currentEntryId: qe_a1
                shuffle: false
                repeat: 'off'
                context: {type: album, id: alb_7d}
                activeDeviceId: dev_iphone_3c
                updatedAt: '2026-10-12T10:00:05.000Z'
                updatedBy: dev_iphone_3c
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Default'
    patch:
      tags: [Queue]
      operationId: updateQueue
      summary: Change the current entry, shuffle or repeat
      description: |
        JSON Merge Patch. Requires `If-Match`. The active device sends this when it moves to the next
        entry; a controller sends it to change shuffle or repeat. A `412` returns the current queue:
        re-apply the change to it (a next-entry move stays valid unless its entry was removed).
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/QueueUpdate'
            example:
              currentEntryId: qe_a2
      responses:
        '200':
          description: The queue after the change.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
              example:
                revision: r_10473
                entryCount: 2
                currentEntryId: qe_a2
                shuffle: false
                repeat: 'off'
                activeDeviceId: dev_iphone_3c
                updatedAt: '2026-10-12T10:04:44.000Z'
                updatedBy: dev_iphone_3c
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Default'

  /me/queue/entries:
    get:
      tags: [Queue]
      operationId: listQueueEntries
      summary: List the queue's entries in play order
      description: |
        In shuffle mode this is the shuffled order every device plays. A walk is read at one
        revision; if the queue changes mid-walk the next page answers `409` and the walk restarts.
        `track` is embedded only when the token also holds `catalog:read`.
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
