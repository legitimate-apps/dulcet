openapi: 3.1.0
info:
  title: Dulcet API
  version: 1.0.0
  summary: An open, resource-oriented HTTPS + JSON standard for music servers and clients.
  description: |
    Dulcet API v1 is a public standard for talking to a personal or shared music server: browsing a
    catalog, streaming, per-user state (favourites, ratings, plays, playlists, My Library), syncing
    through a per-user change feed, live events, signed webhooks and an MCP endpoint for AI agents.

    This document is the single source of truth for the contract. The human guide is
    `docs/dulcet-api/README.md`; a compact guide for language models is `docs/dulcet-api/llms.txt`.

    Rules every client and server follows (README "Principles" and "Evolution"):

    - **Header-only authentication.** A token is sent as `Authorization: Bearer <token>` and never in
      a URL. The only URLs that grant access are short-lived signed media URLs, which reach one
      resource and nothing else.
    - **Ignore what you do not know.** Clients ignore unknown fields. Enumerated string values are
      open: a client maps a value it does not recognise to a neutral default and keeps working.
    - **v1 is built to last; there is no planned v2.** v1 changes only by addition: new fields,
      new values in open sets, new endpoints and new capabilities. Nothing documented here is
      removed or changes meaning. If a v2 is ever published, v1 is served beside it for at least
      three years, and a server keeps v1 for as long as that is practical (README "Evolution").
    - **Servers ignore unknown query parameters and unknown request-body fields**, and every write
      answers with the resulting representation, so a client can see what took effect.
    - **Ids are opaque strings**, unique across every resource type on a server, never reused (not
      even after a restore from backup), and stable across retags and file moves.
    - **Errors are RFC 9457 problem details** (`application/problem+json`) with a stable `type` URN.
      Any operation may answer `429`, `500` or `503`; the `default` response covers them.
    - **Collections page by cursor**, never by offset.
    - **Durations are integer milliseconds; timestamps are RFC 3339 in UTC with millisecond
      precision; bitrates are bits per second; byte sizes are 64-bit integers.**
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Dulcet project
    url: https://github.com/legitimate-apps/dulcet

servers:
  - url: https://{host}/dulcet/v1
    description: |
      Any Dulcet API server. The base URL is discovered from `/.well-known/dulcet`; `/dulcet/v1` is
      the path every conforming server uses for v1.
    variables:
      host:
        default: music.example.com
        description: The server's host and optional port.

security:
  - oauth2: []
  - personalToken: []

tags:
  - name: Wishlist
    description: Optional per-user wishes for outside music, with scan fulfilment.
  - name: Discover
    description: Optional public metadata discovery through Dulcet Server.
  - name: Discovery
    description: Finding a server's API versions, capabilities and authorization server.
  - name: Auth
    description: OAuth 2.1 endpoints. Their real locations come from the authorization server metadata.
  - name: Account
    description: The signed-in user, their tokens and their authorized apps.
  - name: Catalog
    description: Artists, albums, tracks, genres and sources, as the server holds them (Browse).
  - name: Media
    description: Artwork, playback decisions and short-lived signed media URLs.
  - name: Search
    description: Full-text search across the catalog or My Library.
  - name: My Library
    description: The user's personal collection, separate from the whole catalog.
  - name: User state
    description: Favourites and ratings, and a batch endpoint for offline outboxes.
  - name: Plays
    description: Play history, play submission (scrobbling) and now playing.
  - name: Playlists
    description: Ordered, user-owned lists of tracks.
  - name: Queue
    description: One shared play queue per user that every device follows live; one device plays, the others view and control it.
  - name: Sync
    description: The per-user change feed.
  - name: Events
    description: Server-Sent Events for live changes.
  - name: Webhooks
    description: Signed HTTP callbacks for integrations.
  - name: Admin
    description: Users, scans and server administration.
  - name: AI
    description: The Model Context Protocol endpoint.
  - name: Testing
    description: The optional Testing profile, present only on a server started in test mode (README "Testing").

paths:
  /rest/getDulcetConnections.view:
    servers:
      - url: https://{host}{basePath}
        variables:
          host: {default: music.example.test}
          basePath: {default: ''}
    post:
      tags: [Discovery]
      operationId: getDulcetConnections
      summary: Authenticated HTTPS connection directory (dulcetRoutes version 1)
      description: |
        OpenSubsonic compatibility bridge, not a Dulcet API bearer endpoint. Requires prior
        authenticated ping and exact confirmed principal/accepted nonempty lineage. All auth is
        in the form body; reject GET/query credentials and redirects. Response capped at 65536
        bytes. Public discovery never authorizes an alias. Candidate OS TLS and same-origin
        lineage/base mapping must pass without secrets before credentials reach a listed HTTPS
        route. HTTP aliases receive zero bytes. See connections.md for frozen-anchor semantics.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [u, t, s, v, c, f]
              properties:
                u: {type: string, description: 'Username, secret form field.'}
                t: {type: string, description: 'Standard salted token, never logged.'}
                s: {type: string, pattern: '^[0-9a-f]{32}$'}
                v: {type: string, example: '1.16.1'}
                c: {type: string, example: Dulcet}
                f: {type: string, const: json}
      responses:
        '200':
          description: Standard OpenSubsonic JSON success or error envelope.
          headers:
            Cache-Control:
              schema: {type: string, const: 'private, no-store'}
          content:
            application/json:
              schema:
                type: object
                required: [subsonic-response]
                properties:
                  subsonic-response:
                    type: object
                    required: [status, version]
                    properties:
                      status: {type: string, enum: [ok, failed]}
                      version: {type: string}
                      dulcetConnections: {$ref: '#/components/schemas/ConnectionDirectory'}
                      error:
                        type: object
                        required: [code]
                        properties:
                          code: {type: integer}
                          message: {type: string}
        '400':
          description: Query authentication, malformed form or unconfigured receiving authority/base.
        '405':
          description: GET is not supported; no query fallback.
        '413':
          description: Request exceeds the bounded form limit.
        default:
          description: Authentication, rate or server error; private, no-store.

  /.well-known/dulcet:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [Discovery]
      operationId: getDiscovery
      summary: Discover the API versions and endpoints a server offers
      description: |
        The first request a client makes. Needs no authentication. A server that does not answer it
        with this document does not speak Dulcet API; a Dulcet app then falls back to OpenSubsonic.
      security: []
      responses:
        '200':
          description: The discovery document.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
              example:
                standard: dulcet
                apis:
                  - version: '1'
                    baseUrl: https://music.example.com/dulcet/v1
                    status: current
                server:
                  name: Dulcet Server
                  version: 0.2.0
                  instanceId: srv_9f2c41d0
                authorizationServer: https://music.example.com
                openapi: https://music.example.com/dulcet/v1/openapi.yaml
                mcp: https://music.example.com/dulcet/v1/mcp
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /recommendations/home:
    get:
      tags: [Catalog]
      operationId: getHomeRecommendations
      summary: Read this user's Listen Now shelves
      description: |
        Optional dulcet.home version 1 capability. Clients request this only when advertised.
        Returns bounded shelves computed on the server from the authenticated user's plays,
        favourites and ratings, including imported history. Empty shelves may be omitted or hidden.
        Shelf ids are stable opaque strings; titles and reasons are display text. Ranking and shelf
        names are implementation choices. Items must be visible to this user. A random catalog
        selection must be described as exploration, never as evidence of a personal preference.
        Track shelves are playable mixes in the returned order; they do not create saved playlists.
        This is a bounded home snapshot, not a paginated catalog collection. Revalidate with ETag.
      security:
        - oauth2: [catalog:read, user:read]
        - personalToken: []
      parameters:
        - name: limit
          in: query
          description: Maximum items per shelf, from 1 to 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: This user's home shelves.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeRecommendations'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'

  /capabilities:
    get:
      tags: [Discovery]
      operationId: getCapabilities
      summary: List the capabilities, limits and minor API version this server supports
      description: |
        Authentication is optional. Without a token the server answers with what any client may know
        (API version, auth flows, public capabilities). With a token it also reports what that user
        may do, so a client can show or hide features without trial requests.
      security:
        - {}
        - oauth2: []
        - personalToken: []
      responses:
        '200':
          description: Capabilities.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              example:
                apiVersion: '1.0'
                server:
                  name: Dulcet Server
                  version: 0.2.0
                  instanceId: srv_9f2c41d0
                capabilities:
                  dulcet.home: {versions: [1]}
                  dulcet.discover: {versions: [1]}
                  dulcet.wishlist: {versions: [1]}
                  dulcet.sync: {versions: [1]}
                  dulcet.events: {versions: [1]}
                  dulcet.webhooks: {versions: [1]}
                  dulcet.transcoding: {versions: [1]}
                  dulcet.lyrics: {versions: [1]}
                  dulcet.queue: {versions: [1]}
                  dulcet.mcp: {versions: [1]}
                  dulcet.admin: {versions: [1]}
                  org.example.radio: {versions: [2]}
                limits:
                  maxPageSize: 500
                  maxBatchSize: 500
                  maxAlbumTracks: 500
                  syncRetentionDays: 90
                  maxTokenLifetimeDays: 365
                  mediaUrlTtlSeconds: 21600
                  artworkUrlTtlSeconds: 604800
                auth:
                  flows: [authorization_code, device_code, refresh_token, personal_token]
                  scopes: [catalog:read, media:read, user:read, user:write, user:delete, plays:write, account, admin, offline_access]
                permissions:
                  scopes: [catalog:read, media:read, user:read, user:write, plays:write]
                  download: true
                  admin: false
        '304':
          $ref: '#/components/responses/NotModified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Default'

  /openapi.yaml:
    get:
      tags: [Discovery]
      operationId: getOpenApiDocument
      summary: Fetch this OpenAPI document as the server implements it
      security: []
      responses:
        '200':
          description: The OpenAPI document, including any vendor extensions the server adds.
          content:
            application/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /.well-known/oauth-authorization-server:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [Auth]
      operationId: getAuthorizationServerMetadata
      summary: OAuth 2.0 authorization server metadata (RFC 8414)
      description: |
        Names the authorize, token, device authorization, revocation and registration endpoints.
        Clients must read endpoint locations from here, never assume the paths below.
      security: []
      responses:
        '200':
          description: Authorization server metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'
              example:
                issuer: https://music.example.com
                authorization_endpoint: https://music.example.com/oauth/authorize
                token_endpoint: https://music.example.com/oauth/token
                device_authorization_endpoint: https://music.example.com/oauth/device_authorization
                revocation_endpoint: https://music.example.com/oauth/revoke
                registration_endpoint: https://music.example.com/oauth/register
                grant_types_supported: [authorization_code, refresh_token, 'urn:ietf:params:oauth:grant-type:device_code']
                response_types_supported: [code]
                code_challenge_methods_supported: [S256]
                token_endpoint_auth_methods_supported: [none]
                client_id_metadata_document_supported: true
                authorization_response_iss_parameter_supported: true
                scopes_supported: [catalog:read, media:read, user:read, user:write, user:delete, plays:write, account, admin, offline_access]
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /.well-known/oauth-protected-resource:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [Auth]
      operationId: getProtectedResourceMetadata
      summary: OAuth 2.0 protected resource metadata for the API (RFC 9728)
      description: |
        Lets generic OAuth clients find the authorization server. `resource` is the API base URL.
        The MCP endpoint has its own document, whose `resource` is the MCP URL itself, because MCP
        clients check that the two match.
      security: []
      responses:
        '200':
          description: Protected resource metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'
              example:
                resource: https://music.example.com/dulcet/v1
                authorization_servers: [https://music.example.com]
                bearer_methods_supported: [header]
                scopes_supported: [catalog:read, media:read, user:read, user:write, user:delete, plays:write, account, admin, offline_access]
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /.well-known/oauth-protected-resource/dulcet/v1/mcp:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [AI]
      operationId: getMcpProtectedResourceMetadata
      summary: OAuth 2.0 protected resource metadata for the MCP endpoint (RFC 9728)
      security: []
      responses:
        '200':
          description: Protected resource metadata whose `resource` is the MCP URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'
              example:
                resource: https://music.example.com/dulcet/v1/mcp
                authorization_servers: [https://music.example.com]
                bearer_methods_supported: [header]
                scopes_supported: [catalog:read, user:read, user:write, user:delete]
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /oauth/authorize:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [Auth]
      operationId: authorize
      summary: Start an authorization code flow with PKCE (browser redirect)
      description: |
        Opened in a browser or system authentication session, never called by a client's HTTP stack.
        The server signs the user in on its own page, shows the client's name and requested scopes,
        and redirects to `redirect_uri` with `code`, `state` and `iss` (RFC 9207; clients compare
        `iss` with the issuer they started with). Only `S256` PKCE is accepted. The location comes
        from metadata; this path is the reference server's.

        **Client identity works with no internet** (README "Auth"). `client_id` is one of:

        - a client id metadata document URL. The server fetches it SSRF-safely (HTTPS only, no
          redirects, private, loopback and link-local addresses refused unless an admin allows them,
          5-second timeout, 64 KiB cap, cached at most 24 hours) and requires `redirect_uri` to match
          one listed there exactly (a loopback redirect's port excepted);
        - when that fetch fails or the server has no internet, the same URL treated as an
          **unverified** client: the consent screen says "Unverified app" and shows the redirect
          host, and only a loopback redirect (`http://127.0.0.1:{port}/...` or `http://[::1]:{port}/...`)
          or a private-use scheme in reverse-DNS form (`com.example.player:/oauth/callback`) is
          accepted;
        - an id from dynamic registration, when the server offers it.

        A server may preload metadata documents for clients it trusts, so they show as verified
        offline. Unverified clients are never granted `admin` or `account`. Redirect URIs match
        exactly, with no wildcards and no prefix matching.
      security: []
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, const: code}}
        - {name: client_id, in: query, required: true, schema: {type: string}, description: 'A client id metadata document URL (verified or, offline, unverified), or an id from dynamic registration.'}
        - {name: redirect_uri, in: query, required: true, schema: {type: string, format: uri}}
        - {name: scope, in: query, required: true, schema: {type: string}, example: 'catalog:read media:read user:read user:write plays:write offline_access'}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, const: S256}}
        - {name: resource, in: query, required: false, schema: {type: string, format: uri}, description: RFC 8707 resource indicator; the API base URL.}
      responses:
        '200':
          description: The server's own sign-in and consent page.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect back to the client with `code`, `state` and `iss`, or with `error`, `state` and `iss`.
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Default'

  /oauth/token:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    post:
      tags: [Auth]
      operationId: requestToken
      summary: Exchange a code, device code or refresh token for tokens
      description: |
        Standard OAuth 2.1 token endpoint. Errors use the OAuth error format (RFC 6749 §5.2), not
        problem details, so stock OAuth libraries work. Refresh tokens rotate: each use returns a new
        refresh token. **Retry window:** for 60 seconds after a refresh, presenting the same old
        refresh token again returns the same successor tokens, so a response lost on a bad network
        does not sign the user out. After that window, replaying a used refresh token revokes the
        whole grant. A client stores the new refresh token durably before it uses the new access
        token. Refresh tokens also end after 90 days unused and may carry an absolute lifetime the
        server sets. The endpoint is rate limited per client and per user.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              grant_type: authorization_code
              code: SplxlOBeZQQYbYS6WxSbIA
              redirect_uri: com.example.player:/oauth/callback
              client_id: https://player.example.org/oauth/client.json
              code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      responses:
        '200':
          description: Tokens.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: dulcet_at_3kTq9LZb0mR2vX7yN4pW8cJ1
                token_type: Bearer
                expires_in: 3600
                refresh_token: dulcet_rt_Hq2nV8sK5tY1zB6xM3fR9dL0
                scope: catalog:read media:read user:read user:write plays:write offline_access
        '400':
          description: An OAuth error, such as `invalid_grant`, `authorization_pending` or `slow_down`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: authorization_pending
                error_description: The user has not finished signing in yet.
        default:
          $ref: '#/components/responses/Default'

  /oauth/device_authorization:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    post:
      tags: [Auth]
      operationId: requestDeviceAuthorization
      summary: Start a device authorization grant (RFC 8628) for TVs and CLIs
      description: |
        The device shows `user_code` and `verification_uri` (and may render
        `verification_uri_complete` as a QR code), then polls the token endpoint with
        `grant_type=urn:ietf:params:oauth:grant-type:device_code` no faster than `interval` seconds,
        adding 5 seconds on each `slow_down`. User codes carry at least 20 bits of entropy from an
        unambiguous alphabet, expire with the device code, and lock after 5 wrong entries per code;
        the verification page is on the server's own origin and shows the client's name, whether it
        is verified, and the scopes before the user approves.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
            example:
              client_id: https://tv.example.org/oauth/client.json
              scope: catalog:read media:read user:read plays:write offline_access
      responses:
        '200':
          description: Device codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
              example:
                device_code: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
                user_code: WDJB-MJHT
                verification_uri: https://music.example.com/device
                verification_uri_complete: https://music.example.com/device?user_code=WDJB-MJHT
                expires_in: 900
                interval: 5
        '400':
          description: An OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        default:
          $ref: '#/components/responses/Default'

  /oauth/revoke:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    post:
      tags: [Auth]
      operationId: revokeToken
      summary: Revoke an access or refresh token (RFC 7009)
      description: Revoking a refresh token revokes its whole grant, including every access token and signed media URL issued from it.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevocationRequest'
            example:
              token: dulcet_rt_Hq2nV8sK5tY1zB6xM3fR9dL0
              token_type_hint: refresh_token
              client_id: https://player.example.org/oauth/client.json
      responses:
        '200':
          description: Revoked, or the token was already invalid.
        '400':
          description: An OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        default:
          $ref: '#/components/responses/Default'

  /oauth/register:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    post:
      tags: [Auth]
      operationId: registerClient
      summary: Register a public client dynamically (RFC 7591)
      description: |
        For clients that cannot publish a client id metadata document. Servers may require an admin
        to approve registrations, or turn this endpoint off; the metadata says whether it exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
            example:
              client_name: Example Player
              redirect_uris: ['http://127.0.0.1/callback']
              grant_types: [authorization_code, refresh_token]
              token_endpoint_auth_method: none
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'
              example:
                client_id: cli_5d1a7e
                client_name: Example Player
                redirect_uris: ['http://127.0.0.1/callback']
                grant_types: [authorization_code, refresh_token]
                token_endpoint_auth_method: none
        '400':
          description: An OAuth registration error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        default:
          $ref: '#/components/responses/Default'

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the signed-in user
      security:
        - oauth2: []
        - personalToken: []
      responses:
        '200':
          description: The user behind the token, with the scopes that token holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: usr_01
                username: robin
                displayName: Robin
                roles: []
                permissions: {download: true, share: true}
                sourceIds: [src_main]
                settings: {shareNowPlaying: false}
                createdAt: '2026-10-01T09:00:00.000Z'
                token:
                  id: tok_7a
                  kind: oauth
                  scopes: [catalog:read, media:read, user:read, user:write, plays:write, offline_access]
                  clientName: Dulcet
                  verified: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Default'
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Change the signed-in user's display name or settings
      description: JSON Merge Patch. Sharing now playing with other users is off until the user turns it on.
      security:
        - oauth2: [account]
        - personalToken: [account]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
            example:
              settings: {shareNowPlaying: true}
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: usr_01
                username: robin
                displayName: Robin
                roles: []
                permissions: {download: true, share: true}
                sourceIds: [src_main]
                settings: {shareNowPlaying: true}
                createdAt: '2026-10-01T09:00:00.000Z'
                token: {id: tok_7a, kind: oauth, scopes: [account], clientName: Dulcet, verified: true}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: Erase the signed-in user's account and everything they own
      description: |
        Erases the user's favourites, ratings, My Library, playlists, queue, play history, tokens and
        webhooks. Needs both `account` and `user:delete`, and a sign-in within the last 10 minutes
        (otherwise `403` with problem type `reauthentication-required`). A server may refuse for its
        last admin (`409`). Export first with `GET /me/export`.
      security:
        - oauth2: [account, user:delete]
        - personalToken: [account, user:delete]
      responses:
        '204':
          description: Erased.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Default'

