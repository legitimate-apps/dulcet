          description: The queue after the change, with the new entries' ids.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueInsertResult'
              example:
                entryIds: [qe_b7]
                queue:
                  revision: r_10474
                  entryCount: 3
                  currentEntryId: qe_a1
                  shuffle: false
                  repeat: 'off'
                  activeDeviceId: dev_iphone_3c
                  updatedAt: '2026-10-12T10:01:00.000Z'
                  updatedBy: dev_tv_81
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        default:
