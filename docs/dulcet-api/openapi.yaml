webhooks:
  delivery:
    post:
      tags: [Webhooks]
      operationId: webhookDelivery
      summary: A signed delivery to a subscriber's URL
      description: |
        Sent with `webhook-id`, `webhook-timestamp` and `webhook-signature` (Standard Webhooks). A
        `2xx` within 10 seconds counts as delivered; anything else is retried with backoff.
      security: []
      parameters:
        - {name: webhook-id, in: header, required: true, schema: {type: string}}
        - {name: webhook-timestamp, in: header, required: true, schema: {type: integer}}
        - {name: webhook-signature, in: header, required: true, schema: {type: string}, example: 'v1,K5oZfzN95Z9UVu1EsfQmfVNQhnkZ2pj9o9NDN/H/pI4='}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            example:
              id: msg_2KWPBgLlAfxdpx2AI54pPJ85f4W
              type: play.recorded
              timestamp: '2026-10-11T18:03:22.410Z'
              userId: usr_01
              data: {id: 7c0e4a52-1f8b-4f8e-9a51-2e0c35a5b0d1, trackId: trk_4f1, startedAt: '2026-10-11T18:00:00.000Z', listenedMs: 201000}
      responses:
        '204':
          description: Accepted by the receiver.

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.1. Public clients use the authorization code flow with S256 PKCE, or the device
        authorization grant (RFC 8628) on TVs and command lines. Access tokens are short-lived
        (an hour is typical); refresh tokens rotate on every use and need `offline_access`.
        Endpoint locations come from `/.well-known/oauth-authorization-server`.
      flows:
        authorizationCode:
          authorizationUrl: https://music.example.com/oauth/authorize
          tokenUrl: https://music.example.com/oauth/token
          refreshUrl: https://music.example.com/oauth/token
          scopes:
            catalog:read: Browse and search the whole catalog, read lyrics and fetch artwork.
            media:read: Stream and download audio through playback decisions and signed URLs.
            user:read: Read the user's favourites, ratings, My Library, playlists, queue, devices and play history.
            user:write: Add to and change the user's favourites, ratings, My Library, playlists and queue, and control playback. Never deletes a playlist, a playlist entry, a My Library member or a play.
            user:delete: Delete playlists and playlist entries, remove My Library members, delete plays. Granted separately from user:write.
            plays:write: Record plays and report now playing. Nothing else.
            account: Manage the user's profile, personal access tokens, app sessions and webhooks. Never granted to an unverified client.
            admin: Manage users, scans and server settings. Only granted to admins.
            offline_access: Receive a refresh token.
    personalToken:
      type: http
      scheme: bearer
      description: |
        A personal access token created with `POST /me/tokens`, sent as `Authorization: Bearer`.
        Tokens start with `dulcet_pat_`, access tokens with `dulcet_at_` and refresh tokens with
        `dulcet_rt_`, so secret scanners can find a leaked one. The required scopes listed on each
        operation apply to personal tokens too.

  parameters:
    DiscoverLimit:
      name: limit
      in: query
      description: Discover page size; default 20, maximum 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      description: An opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size. The server may return fewer items than asked, even zero, and still have more.
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    Scope:
      name: scope
      in: query
      description: |
        `all` (default) is everything the user can see (Browse). `library` is My Library: items that
        are members, plus artists and albums that contain a member. `favorites` is favourites.
        Open set.
      schema: {type: string, default: all}
    SourceId:
      name: sourceId
      in: query
      description: Comma-separated source ids; only items in these sources.
      schema: {type: string}
    Ids:
      name: ids
      in: query
      description: Comma-separated ids to fetch, at most `limits.maxBatchSize`. Unknown ids are left out of the result.
      schema: {type: string}
    ArtistId:
      name: artistId
      in: path
      required: true
      schema: {type: string}
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: {type: string}
    TrackId:
      name: trackId
      in: path
      required: true
      schema: {type: string}
    ItemId:
      name: itemId
      in: path
      required: true
      description: Any artist, album, track or (for favourites) playlist id. Ids are unique across types, so the type is implied.
      schema: {type: string}
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: {type: string}
    EntryId:
      name: entryId
      in: path
      required: true
      schema: {type: string}
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: The device's own stable id, generated once per installation.
      schema: {type: string, maxLength: 128}
    DeviceIdHeader:
      name: Dulcet-Device-Id
      in: header
      description: The calling device's stable id (README "Queue"). Required on queue writes that act for a device.
      schema: {type: string, maxLength: 128}
      example: dev_iphone_3c
    ActionTime:
      name: Dulcet-Action-Time
      in: header
      description: |
        When the person acted, for a write sent later from an offline outbox. The server orders
        edits to one field by this time (last writer wins) and stores it as the timestamp. A future
        time counts as the time of receipt. Absent means now.
      schema: {type: string, format: date-time}
      example: '2026-10-12T09:58:12.250Z'
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: {type: string}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string}
    Grant:
      name: grant
      in: path
      required: true
      description: An opaque, signed, expiring grant. Never log it.
      schema: {type: string}
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag from an earlier response. A match answers 304 with no body.
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      description: The quoted `revision` last read (on these resources it is also the ETag). A mismatch answers 412 with the current state.
      schema: {type: string}
      example: '"r_10450"'
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: The quoted `revision` last read (on these resources it is also the ETag). Absent answers 428; a mismatch answers 412.
      schema: {type: string}
      example: '"r_10450"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A client-generated unique string (a UUID) that makes a POST safe to retry. The server keeps
        each key with a fingerprint of its request for at least 24 hours. A repeat returns the first
        response; the same key with a different request answers 422 `idempotency-key-reused`.
      schema: {type: string, maxLength: 255}

  headers:
    ETag:
      description: |
        A strong tag of this exact representation for this user, so it changes when the catalog
        entry changes and when the user's own state embedded in it changes. It is not the
        `revision`, except on resources that take `If-Match` (playlists and the queue), where it is
        the quoted `revision`. Authenticated responses are sent with `Cache-Control: private` and
        `Vary: Authorization`. Values embed the server's `instanceId`, so a tag from before a restore
        never matches after it.
      schema: {type: string}
      example: '"t_10431.4471"'
    SyncCursor:
      description: |
        The change-feed position this response was read at. A client that caches the response can
        bring it up to date by reading `/sync/changes` from this cursor.
      schema: {type: string}
      example: sc_AQAAAAAAKNY
    Location:
      description: The new resource's URL.
      schema: {type: string, format: uri-reference}
    CacheControl:
      description: Caching directives.
      schema: {type: string}
      example: private, max-age=31536000, immutable
    NoStore:
      description: The response holds a secret or a signed URL and must not be cached.
      schema: {type: string, const: no-store}
    RetryAfter:
      description: Seconds to wait before retrying (RFC 9110 §10.2.3).
      schema: {type: integer, minimum: 0}

  responses:
    NotModified:
      description: The representation has not changed since the ETag sent.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    Replaced:
      description: |
        The id was merged into another. `Location` points at the surviving resource; the change feed
        carries a tombstone with `replacedBy`. Clients rewrite stored references. Servers keep the
        old-to-new mapping for as long as they run, not only for the feed's retention, so a device
        offline for a year still finds its references. An id that was split answers `410` with its
        successors in `replacedBy`.
      headers:
        Location:
          $ref: '#/components/headers/Location'
    Gone:
      description: The id existed and was deleted, or was split; it will never come back. `404` means the server never knew it or the user cannot see it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:gone
            title: This item was removed from the catalog.
            status: 410
            replacedBy: []
    NotActiveDevice:
      description: This device is not the active device. The body's `current` is the queue; stop playing and become a controller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:not-active-device
            title: Another device is playing this queue.
            status: 409
            current: {revision: r_10476, entryCount: 3, currentEntryId: qe_a1, shuffle: false, repeat: 'off', activeDeviceId: dev_tv_81, updatedAt: '2026-10-12T10:02:00.000Z'}
    DeviceUnavailable:
      description: The target or active device is offline, cannot play, or holds no event stream.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:device-unavailable
            title: That device is not reachable right now.
            status: 409
    Default:
      description: Any other problem, including `429`, `500` and `503` (with `Retry-After` when retrying can help).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:unavailable
            title: The server is starting up.
            status: 503
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:invalid-request
            title: The request is not valid.
            status: 400
            detail: limit must be between 1 and 500.
            errors:
              - {pointer: '#/limit', detail: must be between 1 and 500}
    Unauthorized:
      description: No valid token. The `WWW-Authenticate` header names the scheme and, for OAuth clients, the resource metadata.
      headers:
        WWW-Authenticate:
          schema: {type: string}
          example: Bearer resource_metadata="https://music.example.com/.well-known/oauth-protected-resource"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:unauthenticated
            title: A valid token is required.
            status: 401
    Forbidden:
      description: The token lacks a scope, or the user lacks a permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:insufficient-scope
            title: The token does not hold the required scope.
            status: 403
            requiredScopes: [user:write]
    NotFound:
      description: No such resource, or the user cannot see it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:not-found
            title: Not found.
            status: 404
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:conflict
            title: The resource changed while this list was being read.
            status: 409
    PreconditionFailed:
      description: '`If-Match` did not match. The body carries the current representation in `current` and its revision in `currentRevision`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:revision-mismatch
            title: The resource was changed by someone else.
            status: 412
            currentRevision: r_10460
            current: {id: pl_3e, type: playlist, name: Late night, owner: {id: usr_01, name: Robin}, visibility: private, readOnly: false, itemCount: 3, revision: r_10460}
    PreconditionRequired:
      description: This write requires `If-Match`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:precondition-required
            title: Send If-Match with the revision you last read.
            status: 428
    UnprocessableContent:
      description: The request is well-formed but cannot be applied (for example an unknown track id in a playlist, or a reused idempotency key).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:unknown-item
            title: An id in the request is not in the catalog.
            status: 422
            errors:
              - {pointer: '#/itemIds/1', detail: trk_zzz is not in the catalog}
    TooManyRequests:
      description: Rate limited. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:rate-limited
            title: Too many requests.
            status: 429
    CursorExpired:
      description: The sync cursor is older than retention, from another server instance (a restore), ahead of the journal, or the server could not express a visibility change. Resync from `start=snapshot` or `start=now`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:cursor-expired
            title: This sync cursor can no longer be served.
            status: 410
            detail: The server keeps 90 days of changes. Start a new sync.
    MediaGrantInvalid:
      description: The signed URL expired, was revoked or was tampered with. Ask for a new one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:dulcet:problem:media-grant-expired
            title: This media URL has expired.
            status: 403

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `type` is a stable URN that clients switch on; `title` and `detail` are for people and may be localised.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            Known values: `urn:dulcet:problem:` + `invalid-request`, `unauthenticated`,
            `insufficient-scope`, `permission-denied`, `not-found`, `conflict`, `revision-mismatch`,
            `precondition-required`, `unknown-item`, `idempotency-key-reused`, `token-lifetime-too-long`,
            `webhook-target-refused`, `rate-limited`,
            `cursor-expired`, `cursor-types-mismatch`, `gone`, `media-grant-expired`,
            `unsupported-media`, `not-active-device`, `device-unavailable`,
            `reauthentication-required`, `server-error`, `unavailable`. Open set; treat an unknown
            type by its `status`.
          examples: ['urn:dulcet:problem:not-found']
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance:
          type: string
          description: An id for this occurrence, which the server's own logs also carry.
        errors:
          type: array
          description: Per-field problems, each pointing into the request.
          items:
            type: object
            required: [detail]
            properties:
              pointer: {type: string, description: 'A JSON Pointer into the request body, or `#/<name>` for a parameter.'}
              detail: {type: string}
        requiredScopes:
          type: array
          items: {type: string}
        events:
          type: array
          description: On a `403 insufficient-scope` from creating or changing a webhook, the event types the token may not read.
          items: {type: string}
        currentRevision: {type: string}
        current:
          description: The current representation, on a `412` or a `409 not-active-device`.
          type: object
        replacedBy:
          type: array
          description: On a `410`, the ids that replaced this one, if any.
          items: {type: string}

    Extensions:
      type: object
      description: Vendor data, keyed by a reverse-DNS capability name the server advertises. Clients ignore keys they do not know.
      additionalProperties: true
      examples:
        - org.example.moods: {energy: 0.42}

    ConnectionDirectory:
      type: object
      required: [version, revision, instanceId, principal, routes, legacyOwnershipAnchors, authAliases]
      description: |
        dulcet.routes:1, shared with the dulcetRoutes:1 REST bridge. Revision increases durably
        within accepted lineage and authenticated principal. At most eight exact normalized
        HTTPS bases. Unknown optional fields are ignored; rollback and duplicates are refused.
        Legacy anchors attest adoption only and are never eligible for dialing.
      properties:
        version: {type: integer, const: 1}
        revision: {type: integer, format: int64, minimum: 1}
        instanceId: {type: string, minLength: 1, maxLength: 512}
        principal:
          type: object
          required: [id, username]
          properties:
            id: {type: string, minLength: 1}
            username: {type: string, minLength: 1}
        routes:
          type: array
          maxItems: 8
          items:
            type: object
            required: [id, baseUrl, role, priority]
            properties:
              id: {type: string, minLength: 1}
              baseUrl: {type: string, format: uri, pattern: '^https://'}
              label: {type: string}
              role: {type: string, description: 'Topology label, for example local, private or public; no VPN proof.'}
              priority: {type: integer}
        legacyOwnershipAnchors:
          type: array
          maxItems: 8
          items: {type: string, format: uri}
        authAliases:
          type: array
          maxItems: 8
          description: Explicit refresh authorization, not implied by resource admission.
          items:
            type: object
            required: [routeId, issuer, tokenEndpoint]
            properties:
              routeId: {type: string}
              issuer: {type: string, format: uri, pattern: '^https://'}
              tokenEndpoint: {type: string, format: uri, pattern: '^https://'}

    Discovery:
      type: object
      required: [standard, apis, server]
      properties:
        standard:
          type: string
          const: dulcet
        apis:
          type: array
          items:
            type: object
            required: [version, baseUrl, status]
            properties:
              version: {type: string, description: The major version.}
              baseUrl: {type: string, format: uri}
              status: {type: string, description: 'Known values: `current`, `deprecated`, `preview`.'}
              sunsetAt: {type: [string, 'null'], format: date-time}
        server:
          $ref: '#/components/schemas/ServerInfo'
        routeDirectory:
          type: object
          description: Same-origin dulcetRoutes bridge pointer only; never an authorized alias list.
          required: [method, url]
          properties:
            method: {type: string, const: POST}
            url: {type: string, format: uri}
        authorizationServer: {type: string, format: uri, description: The OAuth issuer; append `/.well-known/oauth-authorization-server`.}
        openapi: {type: string, format: uri}
        mcp: {type: [string, 'null'], format: uri}
        opensubsonic:
          type: [string, 'null']
          format: uri
          description: Where this server also serves OpenSubsonic `/rest`, if it does.
        testMode:
          type: boolean
          default: false
          description: |
            True only on a server started in test mode (README "Testing"), which exposes the test
            hooks under `/admin/test/`. Test mode is set only by a server-start setting, never through
            the API, and a server refuses to start in test mode on data that was ever served without
            it. A client that is not a test tool should warn when it sees `true`.

    ServerInfo:
      type: object
      required: [name, instanceId]
      properties:
        name: {type: string}
        version: {type: string, description: Optional; a server may leave it out of unauthenticated responses.}
        instanceId:
          type: string
          description: |
            Names one continuous history of the server's data (README "Sync", "Restores"). It is a
            random value of at least 64 bits, kept outside the database it describes, and it changes
            whenever the server cannot prove its journal is continuous: a restore from backup, a copy
            to a new host, a rollback, an import, or a journal that lost entries. Every cursor,
            revision and ETag embeds it, so none from an earlier instance is ever accepted or matched.
            A client stores it beside its cursor and, when it changes, discards derived state and
            starts sync again, keeping its unsent writes.

    Capabilities:
      type: object
      required: [apiVersion, server, capabilities, limits, auth]
      properties:
        apiVersion:
          type: string
          description: '`1.<minor>`. Minor versions only add.'
          pattern: '^1\.[0-9]+$'
        server:
          $ref: '#/components/schemas/ServerInfo'
        capabilities:
          type: object
          description: |
            Capability name to descriptor. Core names start with `dulcet.`; vendor names are
            reverse-DNS (`org.example.radio`). Clients act only on names and versions they know.
          additionalProperties:
            $ref: '#/components/schemas/Capability'
        limits:
          type: object
          required: [maxPageSize, maxBatchSize, syncRetentionDays, mediaUrlTtlSeconds, maxTokenLifetimeDays]
          properties:
            maxPageSize: {type: integer}
            maxBatchSize: {type: integer}
            maxAlbumTracks: {type: integer, minimum: 500, description: The most tracks one album response holds before it pages.}
            syncRetentionDays: {type: integer, minimum: 30}
            maxTokenLifetimeDays: {type: integer, minimum: 1, description: 'The longest `expiresInDays` a personal token may ask for; more answers `422` with problem type `token-lifetime-too-long`.'}
            mediaUrlTtlSeconds: {type: integer, minimum: 3600}
            artworkUrlTtlSeconds: {type: integer, minimum: 3600, description: 'How long a signed artwork URL lives and stays the same for one user, id and size.'}
        auth:
          type: object
          required: [flows, scopes]
          properties:
            flows:
              type: array
              description: 'Known values: `authorization_code`, `device_code`, `refresh_token`, `personal_token`.'
              items: {type: string}
            scopes:
              type: array
              items: {type: string}
        permissions:
          type: object
          description: Present only with a token. What this token and user may do.
          properties:
            scopes:
              type: array
              items: {type: string}
            download: {type: boolean}
            share: {type: boolean}
            admin: {type: boolean}

    Capability:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: {type: integer, minimum: 1}
      additionalProperties: true

    AuthorizationServerMetadata:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, response_types_supported]
      properties:
        issuer: {type: string, format: uri}
        authorization_endpoint: {type: string, format: uri}
        token_endpoint: {type: string, format: uri}
        device_authorization_endpoint: {type: string, format: uri}
        revocation_endpoint: {type: string, format: uri}
        registration_endpoint: {type: string, format: uri}
        grant_types_supported:
          type: array
          items: {type: string}
        response_types_supported:
          type: array
          items: {type: string}
        code_challenge_methods_supported:
          type: array
          items: {type: string}
        token_endpoint_auth_methods_supported:
          type: array
          items: {type: string}
        client_id_metadata_document_supported: {type: boolean}
        authorization_response_iss_parameter_supported: {type: boolean, description: Always true on a Dulcet API server (RFC 9207).}
        scopes_supported:
          type: array
          items: {type: string}
      additionalProperties: true

    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource: {type: string, format: uri}
        authorization_servers:
          type: array
          items: {type: string, format: uri}
        bearer_methods_supported:
          type: array
          items: {type: string}
        scopes_supported:
          type: array
          items: {type: string}
      additionalProperties: true

    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          description: '`authorization_code`, `refresh_token` or `urn:ietf:params:oauth:grant-type:device_code`.'
        client_id: {type: string}
        code: {type: string}
        redirect_uri: {type: string}
        code_verifier: {type: string}
        refresh_token: {type: string}
        device_code: {type: string}
        scope: {type: string, description: 'On refresh, an equal or narrower scope.'}
        resource: {type: string, format: uri}

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer}
        refresh_token: {type: string}
        scope: {type: string}

    OAuthError:
      type: object
      required: [error]
      properties:
        error: {type: string}
        error_description: {type: string}

    DeviceAuthorizationRequest:
      type: object
      required: [client_id]
      properties:
        client_id: {type: string}
        scope: {type: string}

    DeviceAuthorizationResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in]
      properties:
        device_code: {type: string}
        user_code: {type: string}
        verification_uri: {type: string, format: uri}
        verification_uri_complete: {type: string, format: uri}
        expires_in: {type: integer}
        interval: {type: integer, default: 5}

    RevocationRequest:
      type: object
      required: [token]
      properties:
        token: {type: string}
        token_type_hint: {type: string}
        client_id: {type: string}

    ClientRegistrationRequest:
      type: object
      required: [client_name, redirect_uris]
      properties:
        client_name: {type: string}
        client_uri: {type: string, format: uri}
        logo_uri: {type: string, format: uri}
        redirect_uris:
          type: array
          items: {type: string}
        grant_types:
          type: array
          items: {type: string}
        token_endpoint_auth_method: {type: string, const: none}
      additionalProperties: true

    ClientRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/ClientRegistrationRequest'
        - type: object
          required: [client_id]
          properties:
            client_id: {type: string}

    User:
      type: object
      required: [id, username, roles, permissions, sourceIds, createdAt]
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        roles:
          type: array
          description: 'Known values: `admin`.'
          items: {type: string}
        permissions:
          $ref: '#/components/schemas/UserPermissions'
        sourceIds:
          type: array
          description: The sources this user can see. Empty means none; the user sees no catalog.
          items: {type: string}
        settings:
          $ref: '#/components/schemas/UserSettings'
        createdAt: {type: string, format: date-time}
        extensions:
          $ref: '#/components/schemas/Extensions'

    UserSettings:
      type: object
      properties:
        shareNowPlaying: {type: boolean, default: false, description: Whether other users of this server see what this user is playing. Off until the user turns it on.}
      additionalProperties: true

    MeUpdate:
      type: object
      properties:
        displayName: {type: string, minLength: 1, maxLength: 100}
        settings:
          $ref: '#/components/schemas/UserSettings'

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, writeOnly: true}
        newPassword: {type: string, minLength: 8, writeOnly: true}
        keepTokens: {type: boolean, default: false}

    UserPermissions:
      type: object
      properties:
        download: {type: boolean, description: May download original files.}
        share: {type: boolean, description: May make playlists visible to others and share now playing.}
      additionalProperties: {type: boolean}

    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [token]
          properties:
            token:
              type: object
              required: [id, kind, scopes]
              properties:
                id: {type: string}
                kind: {type: string, description: 'Known values: `oauth`, `personal`.'}
                scopes:
                  type: array
                  items: {type: string}
                clientName: {type: string}
                verified: {type: boolean, description: False when the client's metadata could not be verified at sign-in.}

    TestSettings:
      type: object
      description: Test-mode overrides (Testing profile). Every field is optional; absent means normal behaviour.
      properties:
        autoApprove:
          type: array
          items:
            type: object
            required: [clientId, userId]
            properties:
              clientId: {type: string}
              userId: {type: string}
        syncRetentionSeconds: {type: integer, minimum: 1}
        mediaUrlTtlSeconds: {type: integer, minimum: 1}
        artworkUrlTtlSeconds: {type: integer, minimum: 1}
        discoverArtworkAllowLoopback:
          type: boolean
          description: Test-mode only. Permit loopback artwork fixtures; other private and metadata addresses remain refused. Resets on restart.
        rateLimit:
          type: object
          required: [requestsPerWindow, windowSeconds]
          properties:
            requestsPerWindow: {type: integer, minimum: 1}
            windowSeconds: {type: integer, minimum: 1}
        trustedClients:
          type: array
          description: Client id metadata documents the server treats as fetched and verified.
          items:
            type: object
            required: [client_id, client_name, redirect_uris]
            properties:
              client_id: {type: string, format: uri}
              client_name: {type: string}
              redirect_uris:
                type: array
                minItems: 1
                items: {type: string}
            additionalProperties: true
        webhooks:
          type: object
          properties:
            allowPrivateTargets: {type: boolean}
            retryScheduleSeconds:
              type: array
              items: {type: integer, minimum: 0}
            disableAfterFailures: {type: integer, minimum: 1}

    TestCheckpoint:
      type: object
      required: [id, createdAt, instanceId]
      properties:
        id: {type: string}
        createdAt: {type: string, format: date-time}
        instanceId: {type: string, description: The instance the checkpoint was taken from.}

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        displayName: {type: string}
        password: {type: string, minLength: 8, writeOnly: true}
        roles:
          type: array
          items: {type: string}
        permissions:
          $ref: '#/components/schemas/UserPermissions'
        sourceIds:
          type: array
          description: 'Omitted: every source that exists now. An empty list: none, so the user sees no catalog.'
          items: {type: string}

    UserUpdate:
      type: object
      properties:
        displayName: {type: string}
        password: {type: string, minLength: 8, writeOnly: true}
        roles:
          type: array
          items: {type: string}
        permissions:
          $ref: '#/components/schemas/UserPermissions'
        sourceIds:
          type: array
          items: {type: string}

    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'

    Token:
      type: object
      required: [id, kind, name, scopes, createdAt]
      properties:
        id: {type: string}
        kind: {type: string, description: 'Known values: `personal`, `oauth`.'}
        name: {type: string}
        clientName: {type: string}
        scopes:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        hint: {type: string, description: 'The first characters of the secret, to recognise it.'}
        parentId: {type: [string, 'null'], description: The grant or token this one was created under; it is revoked with it.}

    TokenPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Token'

    PersonalTokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        scopes:
          type: array
          minItems: 1
          items: {type: string}
        expiresInDays: {type: integer, minimum: 1, description: 'Required unless `noExpiry` is true; at most the server''s maximum.'}
        noExpiry: {type: boolean, default: false, description: 'Ask for a token that never expires. The server may refuse with `422`.'}

    PersonalTokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [secret]
          properties:
            secret: {type: string, description: Shown once. Store it like a password.}

    PageInfo:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Null on the last page. Opaque; never parse or build one.
        total:
          type: integer
          description: The collection's size when this page was read, when the server can count cheaply. May be absent.

    ItemRef:
      type: object
      required: [id]
      properties:
        id: {type: string}
        type: {type: string, description: 'Known values: `artist`, `album`, `track`, `playlist`.'}
        name: {type: string, description: 'The display name: an artist''s or playlist''s name, an album''s or track''s title.'}

    ArtistRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}

    AlbumRef:
      type: object
      required: [id, title]
      properties:
        id: {type: string}
        title: {type: string}
        artwork:
          $ref: '#/components/schemas/Artwork'

    Artwork:
      type: object
      required: [id]
      description: An image. Fetch with `GET /artwork/{id}` or a signed URL.
      properties:
        id: {type: string}
        width: {type: integer}
        height: {type: integer}
        color: {type: string, description: 'A dominant colour as `#rrggbb`, for placeholders.', pattern: '^#[0-9a-fA-F]{6}$'}

    ExternalIds:
      type: object
      description: Identifiers in public registries, so items can be matched across servers and services.
      properties:
        musicbrainzArtistId: {type: string, format: uuid}
        musicbrainzReleaseId: {type: string, format: uuid}
        musicbrainzReleaseGroupId: {type: string, format: uuid}
        musicbrainzRecordingId: {type: string, format: uuid}
        musicbrainzTrackId: {type: string, format: uuid}
        isrc: {type: string}
        barcode: {type: string}
      additionalProperties: {type: string}

    Credit:
      type: object
      required: [artist, role]
      properties:
        artist:
          $ref: '#/components/schemas/ArtistRef'
        role:
          type: string
          description: 'Known values: `artist`, `albumArtist`, `featured`, `composer`, `lyricist`, `producer`, `remixer`, `conductor`, `performer`, `arranger`. Open set.'
        creditedAs: {type: string, description: 'The name exactly as tagged, when it differs from the artist''s name.'}

    Genre:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        type: {type: string, const: genre}
        name: {type: string}
        albumCount: {type: integer}
        trackCount: {type: integer}

    GenreRef:
      type: object
      description: A genre as embedded in an album or track, without counts, so the embedding stays stable.
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}

    Source:
      type: object
      description: A top-level music folder the server reads from. An admin decides which sources each user can see.
      required: [id, name]
      properties:
        id: {type: string}
        type: {type: string, const: source}
        name: {type: string}
        trackCount: {type: integer}

    UserState:
      type: object
      description: The requesting user's state for an item. Present on every catalog read (and part of that read's ETag); absent from catalog entries in the change feed, where it travels as `itemState` with its own revision.
      required: [favoritedAt, rating, playCount, lastPlayedAt, libraryAddedAt]
      properties:
        favoritedAt: {type: [string, 'null'], format: date-time}
        rating: {type: [integer, 'null'], minimum: 1, maximum: 10, description: 1 to 10. A five-star client shows half stars or maps n stars to 2n.}
        playCount: {type: integer, minimum: 0}
        lastPlayedAt: {type: [string, 'null'], format: date-time}
        libraryAddedAt: {type: [string, 'null'], format: date-time, description: When the item became a direct My Library member; null if it is not one.}

    ItemState:
      allOf:
        - type: object
          required: [itemId, itemType, revision]
          properties:
            itemId: {type: string}
            itemType: {type: string, description: 'Known values: `artist`, `album`, `track`, `playlist`.'}
            revision: {type: string, description: 'The revision of this user''s state for the item, independent of the item''s catalog revision.'}
            applied: {type: boolean, readOnly: true, description: 'On a write response, false when a later action already applied made this one a no-op.'}
        - $ref: '#/components/schemas/UserState'

    Artist:
      type: object
      required: [id, type, name, revision]
      properties:
        id: {type: string}
        type: {type: string, const: artist}
        name: {type: string}
        sortName: {type: string}
        albumCount: {type: integer}
        trackCount: {type: integer}
        artwork:
          $ref: '#/components/schemas/Artwork'
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        userState:
          $ref: '#/components/schemas/UserState'
        revision: {type: string}
        extensions:
          $ref: '#/components/schemas/Extensions'

    ArtistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Artist'

    HomeRecommendations:
      type: object
      required: [shelves]
      properties:
        shelves:
          type: array
          maxItems: 50
          description: Independent shelves, in presentation order. Each id occurs once.
          items:
            $ref: '#/components/schemas/HomeShelf'
    HomeShelf:
      type: object
      required: [id, title, reason, items]
      properties:
        id: {type: string, description: Stable opaque shelf identity.}
        title: {type: string, description: Human-readable shelf heading.}
        reason: {type: string, description: Why these items were selected.}
        items:
          type: array
          maxItems: 50
          description: Play or display in this order; no duplicate item ids within a shelf.
          items:
            oneOf:
              - $ref: '#/components/schemas/Album'
              - $ref: '#/components/schemas/Track'
              - $ref: '#/components/schemas/Playlist'

    Album:
      type: object
      required: [id, type, title, revision]
      properties:
        id: {type: string}
        type: {type: string, const: album}
        title: {type: string}
        sortTitle: {type: string}
        edition: {type: string, description: 'An edition or version name, such as "Deluxe".'}
        credits:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
        artistDisplay: {type: string, description: 'The artist line to show, as tagged.'}
        releaseDate:
          type: string
          description: A partial date, `YYYY`, `YYYY-MM` or `YYYY-MM-DD`.
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
        originalReleaseDate:
          type: string
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
        releaseTypes:
          type: array
          description: 'Known values: `album`, `ep`, `single`, `compilation`, `live`, `soundtrack`, `remix`, `demo`. Open set.'
          items: {type: string}
        isCompilation: {type: boolean}
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreRef'
        label: {type: string}
        trackCount: {type: integer}
        discCount: {type: integer}
        durationMs: {type: integer}
        artwork:
          $ref: '#/components/schemas/Artwork'
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        addedAt: {type: string, format: date-time}
        userState:
          $ref: '#/components/schemas/UserState'
        revision: {type: string}
        extensions:
          $ref: '#/components/schemas/Extensions'

    AlbumDetail:
      allOf:
        - $ref: '#/components/schemas/Album'
        - type: object
          required: [discs]
          properties:
            tracksNextCursor:
              type: [string, 'null']
              description: Present when the album has more than `limits.maxAlbumTracks` tracks; continue with `GET /tracks?albumId=...&sort=album&cursor=...`.
            discs:
              type: array
              items:
                type: object
                required: [number, tracks]
                properties:
                  number: {type: integer}
                  title: {type: string}
                  tracks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Track'

    AlbumPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Album'

    AudioInfo:
      type: object
      properties:
        codec: {type: string, description: 'Known values: `flac`, `alac`, `aac`, `mp3`, `opus`, `vorbis`, `wav`, `aiff`, `wavpack`, `ape`. Open set.'}
        container: {type: string}
        bitrate: {type: integer, description: 'Bits per second of the audio stream, without embedded pictures or padding.'}
        sampleRate: {type: integer}
        bitDepth: {type: integer}
        channels: {type: integer}
        sizeBytes: {type: integer, format: int64}
        lossless: {type: boolean}
        encoderDelaySamples: {type: integer, description: 'Priming samples to drop at the start, for gapless playback.'}
        paddingSamples: {type: integer, description: 'Padding samples to drop at the end, for gapless playback.'}
        totalSamples: {type: integer, format: int64, description: 'Exact sample count of the audio, for gapless playback.'}

    Loudness:
      type: object
      description: ReplayGain-style values.
      properties:
        trackGainDb: {type: number}
        trackPeak: {type: number}
        albumGainDb: {type: number}
        albumPeak: {type: number}

    Track:
      type: object
      required: [id, type, title, revision]
      properties:
        id: {type: string}
        type: {type: string, const: track}
        title: {type: string}
        sortTitle: {type: string}
        album:
          $ref: '#/components/schemas/AlbumRef'
        credits:
          type: array
          items:
            $ref: '#/components/schemas/Credit'
        artistDisplay: {type: string}
        discNumber: {type: integer}
        trackNumber: {type: integer}
        durationMs: {type: integer}
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreRef'
        releaseDate:
          type: string
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
        explicit: {type: [boolean, 'null']}
        bpm: {type: number}
        audio:
          $ref: '#/components/schemas/AudioInfo'
        loudness:
          $ref: '#/components/schemas/Loudness'
        lyrics:
          type: object
          properties:
            available: {type: boolean}
            synced: {type: boolean}
        artwork:
          $ref: '#/components/schemas/Artwork'
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        addedAt: {type: string, format: date-time}
        userState:
          $ref: '#/components/schemas/UserState'
        revision: {type: string}
        extensions:
          $ref: '#/components/schemas/Extensions'

    TrackPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Track'

    GenrePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Genre'

    SourcePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Source'

    Lyrics:
      type: object
      required: [trackId, documents]
      properties:
        trackId: {type: string}
        documents:
          type: array
          items:
            $ref: '#/components/schemas/LyricsDocument'

    LyricsDocument:
      type: object
      required: [kind, synced, lines]
      properties:
        kind: {type: string, description: 'Known values: `main`, `translation`, `pronunciation`. Open set.'}
        language: {type: string, description: A BCP 47 tag; `und` when unknown.}
        synced: {type: boolean}
        offsetMs: {type: integer, default: 0, description: Already applied to every time below; informational.}
        source: {type: string, description: 'Known values: `embedded`, `sidecar`, `provider`. Open set.'}
        provider: {type: string, description: 'When `source` is `provider`, its name, for attribution.'}
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LyricsLine'

    LyricsLine:
      type: object
      required: [text]
      properties:
        startMs: {type: integer, description: Absent on unsynced lyrics.}
        endMs: {type: integer}
        text: {type: string}
        voice: {type: string, description: 'A singer or part label, for duets and backing vocals.'}
        words:
          type: array
          description: Word or syllable timing, when the source has it.
          items:
            type: object
            required: [startMs, text]
            properties:
              startMs: {type: integer}
              endMs: {type: integer}
              text: {type: string}

    SearchResults:
      type: object
      properties:
        artists:
          $ref: '#/components/schemas/ArtistPage'
        albums:
          $ref: '#/components/schemas/AlbumPage'
        tracks:
          $ref: '#/components/schemas/TrackPage'
        playlists:
          $ref: '#/components/schemas/PlaylistPage'

    DeviceProfile:
      type: object
      required: [directPlay]
      properties:
        name: {type: string}
        maxBitrate: {type: integer, description: Bits per second; the ceiling for whatever the server sends.}
        network: {type: string, description: 'Known values: `wifi`, `cellular`, `ethernet`, `unknown`.'}
        directPlay:
          type: array
          description: Formats the device plays as-is.
          items:
            $ref: '#/components/schemas/FormatSupport'
        transcodeTargets:
          type: array
          description: Formats the device accepts from a transcode, in order of preference.
          items:
            $ref: '#/components/schemas/FormatSupport'

    FormatSupport:
      type: object
      required: [container, codec]
      properties:
        container: {type: string}
        codec: {type: string}
        maxSampleRate: {type: integer}
        maxBitDepth: {type: integer}
        maxChannels: {type: integer}

    PlaybackRequest:
      type: object
      required: [trackId, profile]
      properties:
        trackId: {type: string}
        purpose: {type: string, description: '`stream` (default) or `download`.', default: stream}
        startMs: {type: integer, minimum: 0, default: 0, description: Start a transcode here. Direct files seek by byte range instead.}
        profile:
          $ref: '#/components/schemas/DeviceProfile'

    PlaybackPlan:
      type: object
      required: [id, trackId, mode, url, expiresAt, mimeType, container, codec, offsetMs, lengthExact, byteRanges]
      properties:
        id: {type: string, description: Names this plan. A play may cite it; later versions may let a client end a transcode early with it.}
        trackId: {type: string}
        mode: {type: string, description: '`direct` (the original file) or `transcode`. Open set; `hls` and `dash` are reserved for adaptive streaming.'}
        reasons:
          type: array
          description: 'Why a transcode was chosen. Known values: `containerNotSupported`, `codecNotSupported`, `bitrateAboveLimit`, `sampleRateAboveLimit`, `bitDepthAboveLimit`, `channelsAboveLimit`, `startOffset`.'
          items: {type: string}
        url: {type: string, format: uri-reference, description: 'Signed resource relative to the receiving route base as a directory, or absolute within its exact origin and segment-bounded base. Validate before dispatch and each redirect; no alias rewriting. Open without headers; never log.'}
        expiresAt: {type: string, format: date-time}
        mimeType: {type: string}
        container: {type: string}
        codec: {type: string}
        bitrate: {type: integer}
        sampleRate: {type: integer}
        bitDepth: {type: integer}
        channels: {type: integer}
        offsetMs: {type: integer, minimum: 0, description: Media time at stream time zero.}
        durationMs: {type: integer, description: 'The whole track''s duration, whatever the offset.'}
        streamDurationMs: {type: integer, description: 'The duration the stream holds, from `offsetMs`.'}
        contentLength: {type: [integer, 'null'], format: int64, description: Bytes in the stream; an estimate unless `lengthExact`.}
        encoderDelaySamples: {type: integer}
        paddingSamples: {type: integer}
        lengthExact: {type: boolean}
        byteRanges: {type: boolean, description: Whether the URL serves byte ranges now.}

    MediaUrlRequest:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [kind, id]
            properties:
              kind: {type: string, description: '`artwork` (an artwork id) or `original` (a track id; the unaltered file).'}
              id: {type: string}
              size: {type: integer, description: 'For artwork, the longest edge in pixels.'}

    MediaUrls:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: object
            required: [kind, id, url, expiresAt]
            properties:
              kind: {type: string}
              id: {type: string}
              url: {type: string, format: uri-reference, description: 'Resolve against the requesting route base directory; exact origin and base containment required.'}
              expiresAt: {type: string, format: date-time}

    LibraryMemberPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items, counts]
          properties:
            items:
              type: array
              items:
                type: object
                required: [item, libraryAddedAt]
                properties:
                  item:
                    $ref: '#/components/schemas/ItemRef'
                  libraryAddedAt: {type: string, format: date-time}
            counts:
              type: object
              description: Whole-My-Library totals for the user, whatever the page or filter.
              properties:
                artist: {type: integer}
                album: {type: integer}
                track: {type: integer}

    FavoritePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [item, favoritedAt]
                properties:
                  item:
                    $ref: '#/components/schemas/ItemRef'
                  favoritedAt: {type: string, format: date-time}

    RatingSet:
      type: object
      required: [rating]
      properties:
        rating: {type: integer, minimum: 1, maximum: 10}

    UserStateBatch:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [op, itemId]
            properties:
              op: {type: string, enum: [favorite, unfavorite, rate, unrate, libraryAdd, libraryRemove]}
              itemId: {type: string}
              rating: {type: integer, minimum: 1, maximum: 10}
              at: {type: string, format: date-time, description: When the person acted. Absent means now.}

    UserStateBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [status]
            properties:
              status: {type: integer, description: The HTTP status the single-item endpoint would have answered.}
              applied: {type: boolean, description: False when a later action already applied made this one a no-op.}
              problem:
                $ref: '#/components/schemas/Problem'

    Play:
      type: object
      required: [id, trackId, startedAt, listenedMs]
      properties:
        id: {type: string, format: uuid, description: Generated by the client when the listen begins. The server records each id once.}
        trackId: {type: string}
        startedAt: {type: string, format: date-time, description: Wall-clock time the listen began.}
        listenedMs: {type: integer, minimum: 0, description: 'Progressing media time actually played, excluding pauses, buffering and skipped-over spans.'}
        completed: {type: boolean, description: Whether playback reached the end of the track.}
        deviceId: {type: string}
        client: {type: string, description: 'The client''s name and version, such as "Dulcet/1.4".'}
        context:
          type: object
          description: Where the play came from.
          properties:
            type: {type: string, description: 'Known values: `album`, `artist`, `playlist`, `search`, `library` (My Library), `queue`, `radio`.'}
            id: {type: string}
        offline: {type: boolean, description: Played without a connection and submitted later.}
        recordedAt: {type: string, format: date-time, readOnly: true}

    PlayPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Play'

    PlaySubmission:
      type: object
      required: [plays]
      properties:
        plays:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Play'

    PlaySubmissionResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: {type: string}
              status: {type: string, description: 'Known values: `recorded`, `duplicate`, `unknownTrack`, `ignored`. Only `recorded` changed a count.'}
              detail: {type: string}

    NowPlayingReport:
      type: object
      required: [deviceId, trackId, state, positionMs]
      properties:
        deviceId: {type: string}
        deviceName: {type: string}
        trackId: {type: string}
        state: {type: string, description: 'Known values: `playing`, `paused`, `buffering`.'}
        positionMs: {type: integer, minimum: 0}
        ttlSeconds: {type: integer, minimum: 30, maximum: 600, default: 120}

    NowPlaying:
      allOf:
        - $ref: '#/components/schemas/NowPlayingReport'
        - type: object
          required: [userId, updatedAt, expiresAt]
          properties:
            userId: {type: string}
            userName: {type: string}
            track:
              description: Present only when the token holds `catalog:read`.
              $ref: '#/components/schemas/Track'
            updatedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}

    PlaylistCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        visibility: {type: string, description: '`private` (default) or `public` (every user of this server can read it).', default: private}
        itemIds:
          type: array
          description: Track ids today; other playable item types may be allowed later, behind a capability.
          maxItems: 10000
          items: {type: string}

    PlaylistUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null']}
        visibility: {type: string}

    Playlist:
      type: object
      required: [id, type, name, owner, visibility, readOnly, itemCount, revision]
      properties:
        id: {type: string}
        type: {type: string, const: playlist}
        name: {type: string}
        description: {type: string}
        owner:
          $ref: '#/components/schemas/UserRef'
        visibility: {type: string, description: 'Known values: `private`, `public`.'}
        readOnly: {type: boolean, description: True when the requesting user cannot edit it.}
        itemCount: {type: integer}
        durationMs: {type: integer}
        artwork:
          $ref: '#/components/schemas/Artwork'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        revision: {type: string, description: Changes on every edit to the playlist or its entries; send it as `If-Match`.}
        extensions:
          $ref: '#/components/schemas/Extensions'

    PlaylistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Playlist'

    PlaylistItem:
      type: object
      required: [entryId, position, itemId]
      properties:
        entryId: {type: string}
        position: {type: integer, minimum: 0}
        itemId: {type: string}
        track:
          description: Present only when the token holds `catalog:read`.
          $ref: '#/components/schemas/Track'
        addedAt: {type: string, format: date-time}

    PlaylistItemPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items, revision]
          properties:
            revision:
              type: string
              description: The playlist revision every page of this walk was read at. If the playlist changes mid-walk, the next page answers 409 and the walk restarts.
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlaylistItem'

    PlaylistItemsReplace:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          maxItems: 10000
          items: {type: string}

    PlaylistItemsInsert:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 10000
          items: {type: string}
        beforeEntryId: {type: [string, 'null'], description: Insert before this entry; null or absent appends.}

    PlaylistItemMove:
      type: object
      properties:
        beforeEntryId: {type: [string, 'null'], description: Move before this entry; null moves to the end.}

    Device:
      type: object
      required: [id, name, canPlay, online, active, lastSeenAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, description: 'Known values: `phone`, `tablet`, `computer`, `tv`, `speaker`, `car`, `watch`, `web`. Open set.'}
        canPlay: {type: boolean, description: Whether it can be the active device.}
        online: {type: boolean}
        active: {type: boolean, description: Whether it is the queue's active device.}
        lastSeenAt: {type: string, format: date-time}
        client: {type: string, description: 'The client''s name and version.'}

    DeviceRegistration:
      type: object
      required: [name, canPlay]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string}
        canPlay: {type: boolean}
        client: {type: string}

    QueueEntry:
      type: object
      required: [entryId, position, itemId]
      properties:
        entryId: {type: string, description: 'Assigned by the server, unique within the queue, kept across moves and merges.'}
        position: {type: integer, minimum: 0}
        itemId: {type: string}
        track:
          description: Present only when the token holds `catalog:read`.
          $ref: '#/components/schemas/Track'
        addedBy: {type: string, description: The device that added it.}

    QueueEntryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items, revision]
          properties:
            revision: {type: string, description: The queue revision this walk was read at.}
            items:
              type: array
              items:
                $ref: '#/components/schemas/QueueEntry'

    Queue:
      type: object
      description: |
        The user's one shared queue, without its entries. `revision` changes on every change to the
        entries, the current entry, shuffle, repeat or the active device, and never on playback
        position reports.
      required: [revision, entryCount, currentEntryId, shuffle, repeat, activeDeviceId, updatedAt]
      properties:
        revision: {type: string}
        entryCount: {type: integer, minimum: 0}
        currentEntryId: {type: [string, 'null']}
        shuffle: {type: boolean}
        repeat: {type: string, description: 'Known values: `off`, `all`, `one`.'}
        context:
          type: [object, 'null']
          description: What the queue was started from, for display.
          properties:
            type: {type: string, description: 'Known values: `album`, `artist`, `playlist`, `search`, `library`, `radio`.'}
            id: {type: string}
        activeDeviceId: {type: [string, 'null'], description: The device that plays; null when none does.}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, description: The device that made the last change.}

    QueueReplace:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          maxItems: 10000
          items: {type: string}
        currentIndex: {type: integer, minimum: 0, default: 0}
        positionMs: {type: integer, minimum: 0, default: 0}
        shuffle: {type: boolean, default: false}
        repeat: {type: string, default: 'off'}
        context:
          type: [object, 'null']
          properties:
            type: {type: string}
            id: {type: string}
        play: {type: boolean, default: false, description: Also make the calling device the active device and start playing.}

    QueueUpdate:
      type: object
      properties:
        currentEntryId: {type: string}
        shuffle: {type: boolean, description: Turning shuffle on reorders the entries after the current one; every device reads the same order.}
        repeat: {type: string}

    QueueInsert:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 10000
          items: {type: string}
        at: {type: string, default: end, description: 'Known values: `next`, `end`, `before`.'}
        beforeEntryId: {type: string, description: 'With `at: before`.'}

    QueueInsertResult:
      type: object
      required: [entryIds, queue]
      properties:
        entryIds:
          type: array
          items: {type: string}
        queue:
          $ref: '#/components/schemas/Queue'

    QueuePlayback:
      type: object
      required: [deviceId, state, positionMs, positionAt]
      properties:
        deviceId: {type: string, description: The active device that reported this.}
        entryId: {type: [string, 'null']}
        state: {type: string, description: 'Known values: `playing`, `paused`, `buffering`, `stopped`.'}
        positionMs: {type: integer, minimum: 0}
        positionAt: {type: string, format: date-time, description: The wall-clock time `positionMs` was true.}
        volume: {type: number, minimum: 0, maximum: 1}

    PlaybackTransfer:
      type: object
      required: [deviceId]
      properties:
        deviceId: {type: string, description: The device to make active; the caller's own id to start playing here.}
        play: {type: boolean, default: true, description: Whether the new device starts playing or waits paused.}

    PlaybackCommand:
      type: object
      required: [id, command]
      properties:
        id: {type: string, format: uuid, description: 'Generated by the sender, so the active device carries out each command once.'}
        command: {type: string, description: 'Known values: `play`, `pause`, `seek`, `next`, `previous`, `skipTo`, `setVolume`. Open set; a device ignores a command it does not know.'}
        positionMs: {type: integer, minimum: 0, description: For `seek`.}
        entryId: {type: string, description: For `skipTo`.}
        volume: {type: number, minimum: 0, maximum: 1, description: For `setVolume`.}

    PlaybackCommandAccepted:
      type: object
      required: [id, deviceId]
      properties:
        id: {type: string}
        deviceId: {type: string, description: The active device the command was relayed to.}

    Change:
      type: object
      required: [op, type, id, revision, at]
      properties:
        op: {type: string, description: '`upsert` (the entity now looks like `resource`) or `delete` (a tombstone). Open set; skip an op you do not know.'}
        type: {type: string, description: 'Known values: `artist`, `album`, `track`, `genre`, `source`, `itemState`, `playlist`, `play`, `queue`, `wish`. Open set; skip a type you do not know.'}
        id: {type: string, description: 'The entity''s id. For `itemState`, the item''s id; for `queue`, the literal `queue`.'}
        revision: {type: string, description: The entity's `revision` after this change.}
        at: {type: string, format: date-time}
        resource:
          type: object
          description: |
            On `upsert`, the entity's current representation, shaped as its own endpoint returns it:
            catalog entities without `userState`, a `playlist` without entries, the `queue` without
            entries. A `playlist` or `queue` upsert with a new revision means its entries changed or
            may have: re-read `/playlists/{id}/items` or `/me/queue/entries`. A server may coalesce
            several changes to one entity into its latest state. A `wish` upsert carries Wish, including all fulfilled history. Wish deletions retain owner-only tombstones even when the capability is disabled. Hidden library references are redacted without reopening fulfilled wishes.
        reason:
          type: string
          description: 'On `delete`. Known values: `deleted` (gone for good), `merged` (see `replacedBy`), `hidden` (no longer visible to this user; it may come back as an `upsert`). Open set; treat an unknown reason as `deleted`.'
        replacedBy:
          type: array
          description: 'With `reason: merged`, the live ids that took this entity''s place: one for a merge, several for a split.'
          items: {type: string}

    ChangePage:
      type: object
      required: [changes, nextCursor, hasMore, phase]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        nextCursor: {type: string, description: Always present. Store it once `hasMore` is false.}
        hasMore: {type: boolean}
        phase: {type: string, description: '`snapshot` while a snapshot is being delivered, then `changes`.'}

    EventData:
      description: The `data` of one `/events` event; which schema applies is named by the event type.
      oneOf:
        - $ref: '#/components/schemas/ChangesEvent'
        - $ref: '#/components/schemas/QueueEvent'
        - $ref: '#/components/schemas/PlaybackEvent'
        - $ref: '#/components/schemas/CommandEvent'
        - $ref: '#/components/schemas/NowPlayingEvent'
        - $ref: '#/components/schemas/ScanEvent'
        - $ref: '#/components/schemas/RevokedEvent'
        - $ref: '#/components/schemas/HeartbeatEvent'

    ChangesEvent:
      type: object
      description: '`changes`: the feed advanced. Pull `/sync/changes`.'
      required: [cursor]
      properties:
        cursor: {type: string, description: A cursor at or after the change.}
        types:
          type: array
          items: {type: string}

    QueueEvent:
      type: object
      description: '`queue`: the queue''s revision changed. Read `/me/queue` (and its entries if `changed` names them).'
      required: [revision, activeDeviceId, changed]
      properties:
        revision: {type: string}
        activeDeviceId: {type: [string, 'null']}
        changed:
          type: array
          description: 'Known values: `entries`, `current`, `mode` (shuffle or repeat), `activeDevice`.'
          items: {type: string}

    PlaybackEvent:
      description: '`playback`: the active device reported its playback state.'
      $ref: '#/components/schemas/QueuePlayback'

    CommandEvent:
      type: object
      description: '`command`: sent only to the active device''s stream. Carry it out once per `id`.'
      required: [id, command, from]
      properties:
        id: {type: string, format: uuid}
        command: {type: string}
        positionMs: {type: integer}
        entryId: {type: string}
        volume: {type: number}
        from: {type: string, description: The device that sent it.}

    NowPlayingEvent:
      type: object
      description: '`nowPlaying`: a now-playing entry the user may see changed or ended.'
      required: [userId, deviceId, state]
      properties:
        userId: {type: string}
        deviceId: {type: string}
        trackId: {type: [string, 'null']}
        state: {type: string, description: 'Known values: `playing`, `paused`, `buffering`, `ended`.'}
        positionMs: {type: integer}

    ScanEvent:
      type: object
      description: '`scan`: an admin-visible scan changed state. Sent only to admins.'
      required: [scanId, state]
      properties:
        scanId: {type: string}
        state: {type: string}
        counts:
          type: object
          additionalProperties: {type: integer}

    RevokedEvent:
      type: object
      description: '`revoked`: the token behind this stream was revoked. The stream closes after this event.'
      properties:
        reason: {type: string}

    HeartbeatEvent:
      type: object
      description: '`heartbeat`: sent at least every 30 seconds so dead connections are noticed.'

    WebhookEvent:
      allOf:
        - if:
            properties:
              type: {const: wishlist.changed}
            required: [type]
          then:
            properties:
              data: {$ref: '#/components/schemas/WishlistChangedEvent'}
        - if:
            properties:
              type: {const: wishlist.requested}
            required: [type]
          then:
            properties:
              data: {$ref: '#/components/schemas/WishlistRequestedEvent'}
      type: object
      description: The body of every webhook delivery. Unknown `type` values are skipped by receivers.
      required: [id, type, timestamp, data]
      properties:
        id: {type: string, description: Equal to the `webhook-id` header; a receiver dedupes on it.}
        type: {type: string, description: 'Known values: `wishlist.changed` (user:read, owner only), `wishlist.requested` (admin, all owners), `play.recorded`, `nowPlaying.changed`, `itemState.changed`, `playlist.changed`, `queue.changed`, `catalog.changed`, `scan.completed`, `ping`.'}
        timestamp: {type: string, format: date-time}
        userId: {type: string}
        data:
          type: object
          description: |
            `play.recorded`: a `Play`. `nowPlaying.changed`: a `NowPlayingEvent`. `itemState.changed`:
            an `ItemState`. `playlist.changed`: a `Playlist`. `queue.changed`: a `QueueEvent`.
            `catalog.changed`: a `ChangesEvent`. `scan.completed`: a `Scan`. `ping`: empty.
            `wishlist.changed`: a `WishlistChangedEvent` (user:read, owner only).
            `wishlist.requested`: a `WishlistRequestedEvent` (admin, all owners).

    Webhook:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id: {type: string}
        url: {type: string, format: uri}
        events:
          type: array
          description: 'Known values: `wishlist.changed` (user:read, owner only), `wishlist.requested` (admin, all owners), `play.recorded`, `nowPlaying.changed`, `itemState.changed`, `playlist.changed`, `queue.changed`, `catalog.changed`, `scan.completed`, `ping`. `*` for all the creating token may read.'
          items: {type: string}
        description: {type: string}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastDeliveryAt: {type: [string, 'null'], format: date-time}
        consecutiveFailures: {type: integer}
        disabledReason:
          type: [string, 'null']
          description: 'Why `active` is false. Known values: `delivery-failures` (retries ran out), `admin` (an admin disabled it). A webhook whose grant or token ends is deleted instead.'

    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url: {type: string, format: uri}
        events:
          type: array
          minItems: 1
          items: {type: string}
        description: {type: string}

    WebhookUpdate:
      type: object
      properties:
        events:
          type: array
          items: {type: string}
        description: {type: string}
        active: {type: boolean}

    WebhookCreated:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          required: [secret]
          properties:
            secret: {type: string, description: '`whsec_` plus base64. Shown once.'}

    WebhookDelivery:
      type: object
      required: [id, event, attemptedAt]
      properties:
        id: {type: string}
        event: {type: string}
        attemptedAt: {type: string, format: date-time}
        responseStatus: {type: [integer, 'null']}
        error: {type: [string, 'null']}

    Scan:
      type: object
      required: [id, kind, state]
      properties:
        id: {type: string}
        kind: {type: string, description: '`quick` (changed files only) or `full`.'}
        state: {type: string, description: 'Known values: `queued`, `running`, `completed`, `failed`.'}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        counts:
          type: object
          properties:
            added: {type: integer}
            updated: {type: integer}
            removed: {type: integer}
        error: {type: string}

    ScanStart:
      type: object
      properties:
        kind: {type: string, default: quick}

    JsonRpcMessage:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {type: [string, integer]}
        method: {type: string}
        params: {type: object}
        result: {type: object}
        error:
          type: object
          properties:
            code: {type: integer}
            message: {type: string}

    DiscoverLink:
      type: object
      required:
      - relation
      - url
      properties:
        relation:
          type: string
        url:
          type: string
          format: uri
          description: Explicit HTTP(S) link to open outside the app, never an artwork source URL.
    DiscoverAvailability:
      type: object
      required:
      - status
      - libraryItems
      - completeness
      properties:
        status:
          type: string
          description: 'Open set: held, partlyHeld, notHeld.'
        libraryItems:
          type: array
          items:
            type: object
            required:
            - id
            - type
            properties:
              id:
                type: string
              type:
                type: string
                description: artist, album or track; only visible local resources.
        completeness:
          type: string
          description: 'Open set: known or unknown. Unknown totals are omitted.'
        matchedBy:
          type: string
          description: 'Open set: mbid or name.'
        matchedTrackCount:
          type: integer
          minimum: 0
        totalTrackCount:
          type: integer
          minimum: 1
        editionReleaseId:
          type: string
          format: uuid
      description: Album completeness requires every slot of one edition within one local album, one file per slot.
        Extra tracks are allowed. Never pool editions or infer completeness from equal counts. Name fallback applies
        only to local candidates without the relevant MBID and preserves live, remix, demo, acoustic and instrumental
        words.
    DiscoverCacheAge:
      type: object
      required:
      - fetchedAt
      - ageSeconds
      - stale
      properties:
        fetchedAt:
          type: string
          format: date-time
        ageSeconds:
          type: integer
          minimum: 0
        stale:
          type: boolean
    DiscoverItem:
      type: object
      required:
      - id
      - kind
      - title
      - externalIds
      - links
      - wishable
      - availability
      properties:
        id:
          type: string
          description: Persisted opaque server id, not a MusicBrainz id.
        kind:
          type: string
          description: 'Open set: artist, album, song.'
        title:
          type: string
        artist:
          type: string
        year:
          type: integer
        releaseDate:
          type: string
          description: 'Source precision preserved: YYYY, YYYY-MM or YYYY-MM-DD.'
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        artworkId:
          type: string
          description: Opaque id for GET /discover/artwork/{artworkId}; never an outside image URL.
        links:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverLink'
        wishable:
          type: boolean
          description: False for playlist/edition slots with no canonical MBID.
        availability:
          $ref: '#/components/schemas/DiscoverAvailability'
        disc:
          type: integer
          minimum: 1
        position:
          type: integer
          minimum: 1
        listenCount:
          type: integer
          minimum: 0
        artistMbids:
          type: array
          items:
            type: string
            format: uuid
        primaryType:
          type: string
          description: Open MusicBrainz release-group primary type.
    DiscoverPlaylistSummary:
      type: object
      required:
      - id
      - title
      - creator
      - trackCount
      properties:
        id:
          type: string
          format: uuid
          description: ListenBrainz playlist UUID.
        title:
          type: string
        creator:
          type:
          - string
          - 'null'
        trackCount:
          type:
          - integer
          - 'null'
    DiscoverPlaylistEntry:
      type: object
      required:
      - position
      - item
      properties:
        position:
          type: integer
          minimum: 1
        item:
          $ref: '#/components/schemas/DiscoverItem'
    DiscoverEdition:
      type: object
      required:
      - releaseId
      - releaseDate
      - trackCount
      - links
      properties:
        releaseId:
          type: string
          format: uuid
        releaseDate:
          type:
          - string
          - 'null'
        trackCount:
          type: integer
          minimum: 0
        links:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverLink'
    DiscoverItemPage:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/DiscoverCacheAge'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/DiscoverItem'
    DiscoverPlaylistSummaryPage:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/DiscoverCacheAge'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/DiscoverPlaylistSummary'
    DiscoverPlaylistEntryPage:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - $ref: '#/components/schemas/DiscoverCacheAge'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/DiscoverPlaylistEntry'
    DiscoverShelfPage:
      oneOf:
      - $ref: '#/components/schemas/DiscoverItemPage'
      - $ref: '#/components/schemas/DiscoverPlaylistSummaryPage'
    DiscoverArtist:
      type: object
      required:
      - item
      - albums
      properties:
        item:
          $ref: '#/components/schemas/DiscoverItem'
        albums:
          $ref: '#/components/schemas/DiscoverItemPage'
    DiscoverAlbum:
      type: object
      required:
      - item
      - editions
      - selectedReleaseId
      - tracks
      properties:
        item:
          $ref: '#/components/schemas/DiscoverItem'
        editions:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverEdition'
        selectedReleaseId:
          type:
          - string
          - 'null'
        tracks:
          $ref: '#/components/schemas/DiscoverItemPage'
    DiscoverPlaylistPage:
      $ref: '#/components/schemas/DiscoverPlaylist'

    DiscoverPlaylist:
      type: object
      required:
      - summary
      - entries
      properties:
        summary:
          $ref: '#/components/schemas/DiscoverPlaylistSummary'
        entries:
          $ref: '#/components/schemas/DiscoverPlaylistEntryPage'

    WishSnapshot:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        artist:
          type: string
          maxLength: 500
        year:
          type: integer
        artworkId:
          type: string
          description: Opaque server artwork id, never a URL.
      required:
      - title
    WishSource:
      type: object
      properties:
        type:
          type: string
          description: 'Known values: search, shelf, artist, album, playlist, api. No
            private upstream account.'
        id:
          type: string
          maxLength: 500
      required:
      - type
    Wish:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        kind:
          type: string
          description: 'Known values: artist, album, song. Open output set.'
        externalIds:
          type: object
          additionalProperties:
            type: string
          description: 'Canonical MusicBrainz UUID for the kind: musicbrainzArtistId, musicbrainzReleaseGroupId or musicbrainzRecordingId.'
        snapshot:
          $ref: '#/components/schemas/WishSnapshot'
        source:
          $ref: '#/components/schemas/WishSource'
        addedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        state:
          type: string
          description: 'Open set: wanted, requested, searching, unavailable, fulfilled. Only complete local matches
            can fulfil; admins may set the first four.'
        note:
          type:
          - string
          - 'null'
        noteAt:
          type:
          - string
          - 'null'
          format: date-time
        fulfilledAt:
          type:
          - string
          - 'null'
          format: date-time
        libraryItem:
          oneOf:
          - type: object
            properties:
              id:
                type: string
              type:
                type: string
            required:
            - id
            - type
          - type: 'null'
        availability:
          $ref: '#/components/schemas/DiscoverAvailability'
        revision:
          type: string
      required:
      - id
      - userId
      - kind
      - externalIds
      - snapshot
      - source
      - addedAt
      - updatedAt
      - state
      - note
      - noteAt
      - fulfilledAt
      - libraryItem
      - availability
      - revision
    WishPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Wish'
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
    WishAdd:
      type: object
      properties:
        kind:
          type: string
          description: 'Known values: artist, album, song. Open output set.'
        externalIds:
          type: object
          additionalProperties:
            type: string
          description: 'Canonical MusicBrainz UUID for the kind: musicbrainzArtistId, musicbrainzReleaseGroupId or musicbrainzRecordingId.'
        snapshot:
          $ref: '#/components/schemas/WishSnapshot'
        source:
          $ref: '#/components/schemas/WishSource'
        operationId:
          type: string
          format: uuid
      required:
      - kind
      - externalIds
      - snapshot
      - source
      - operationId
    WishRemove:
      type: object
      properties:
        addOperationId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
      required:
      - addOperationId
      - operationId
    WishMutation:
      type: object
      properties:
        applied:
          type: boolean
        wish:
          oneOf:
          - $ref: '#/components/schemas/Wish'
          - type: 'null'
        removed:
          type: boolean
      required:
      - applied
      - wish
      - removed
    WishStateUpdate:
      type: object
      properties:
        state:
          type: string
          enum:
          - wanted
          - requested
          - searching
          - unavailable
        note:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Omit to preserve note and noteAt. Explicit null clears both. A string sets note and refreshes noteAt, even when unchanged.
      required:
      - state
    WishRejectMatch:
      type: object
      properties:
        target:
          type: object
          properties:
            kind:
              type: string
              description: 'Known values: artist, album, song. Open output set.'
            externalIds:
              type: object
              additionalProperties:
                type: string
              description: 'Canonical MusicBrainz UUID for the kind: musicbrainzArtistId, musicbrainzReleaseGroupId
                or musicbrainzRecordingId.'
          required:
          - kind
          - externalIds
        libraryItem:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
              enum:
              - artist
              - album
              - track
          required:
          - id
          - type
        operationId:
          type: string
          format: uuid
      required:
      - libraryItem
      - operationId

    WishlistChangedEvent:
      type: object
      required: [op, id, revision]
      description: Owner-only wishlist.changed webhook data. Actual mutations only; delete omits wish. Signed through the durable outbox.
      properties:
        op: {type: string, description: 'Known values: upsert, delete.'}
        id: {type: string}
        revision: {type: string}
        wish: {$ref: '#/components/schemas/Wish'}
    WishlistRequestedEvent:
      type: object
      required: [wish]
      description: Admin-only wishlist.requested webhook data. One per actual new wish, including an intentional re-add with a new id. The owner is wish.userId; the outer webhook userId remains the subscriber.
      properties:
        wish: {$ref: '#/components/schemas/Wish'}
