  /me/tokens:
    get:
      tags: [Account]
      operationId: listTokens
      summary: List the user's personal access tokens and authorized app sessions
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tokens. Secrets are never returned after creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
              example:
                items:
                  - id: tok_7a
                    kind: oauth
                    name: Dulcet on iPhone
                    clientName: Dulcet
                    scopes: [catalog:read, media:read, user:read, user:write, plays:write, offline_access]
                    createdAt: '2026-10-02T08:00:00.000Z'
                    lastUsedAt: '2026-10-12T07:55:00.000Z'
                    expiresAt: null
                    hint: dulcet_rt_Hq2n
                    parentId: null
                nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    post:
      tags: [Account]
      operationId: createPersonalToken
      summary: Create a scoped personal access token for a script or integration
      description: |
        The secret is returned once, in this response. **A new token never holds more than the token
        that creates it:** its scopes must be a subset of the calling token's scopes (and of what the
        user's role allows), or the call answers `403 insufficient-scope`. A token created through an
        OAuth grant is that grant's child: it is listed with `parentId`, and it is revoked when the
        grant is revoked, expires or is signed out. Lifetime is required: `expiresInDays` up to the
        server's maximum (365 on Dulcet Server), or `noExpiry: true`, which only a personal token or
        a first-party session may ask for and which the server may refuse.
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalTokenCreate'
            example:
              name: Home Assistant now-playing
              scopes: [user:read]
              expiresInDays: 365
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalTokenCreated'
              example:
                id: tok_9c
                kind: personal
                name: Home Assistant now-playing
                scopes: [user:read]
                createdAt: '2026-10-12T10:00:00.000Z'
                lastUsedAt: null
                expiresAt: '2027-10-12T10:00:00.000Z'
                hint: dulcet_pat_Xw3
                parentId: tok_7a
                secret: dulcet_pat_Xw3e8Rk1Lq0Zt5Nv2Bc7Hy4M
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        default:
          $ref: '#/components/responses/Default'

