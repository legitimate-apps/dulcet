      tags: [Catalog]
      operationId: getTrackLyrics
      summary: Get a track's lyrics, synced where available
      description: |
        Returns every lyrics document the server has for the track: the main lyrics and any
        translations or pronunciations, each in a BCP 47 language. Lines may carry start and end
        times; words may carry their own timing. An empty `documents` list means the server has no
        lyrics, which is an answer, not an error.
      security:
        - oauth2: [catalog:read]
        - personalToken: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/TrackId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Lyrics.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lyrics'
              example:
                trackId: trk_4f1
                documents:
                  - kind: main
                    language: en
                    synced: true
                    offsetMs: 0
                    source: sidecar
                    lines:
                      - startMs: 12500
                        endMs: 16100
                        text: Under the blue hour
                        words:
                          - {startMs: 12500, endMs: 13000, text: Under}
                          - {startMs: 13000, endMs: 13300, text: the}
                          - {startMs: 13300, endMs: 13900, text: blue}
                          - {startMs: 13900, endMs: 16100, text: hour}
                      - startMs: 16100
                        text: we keep the lights low
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /genres:
    get:
      tags: [Catalog]
      operationId: listGenres
      summary: List genres
      security:
        - oauth2: [catalog:read]
        - personalToken: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: A page of genres.
          headers:
            Dulcet-Sync-Cursor:
              $ref: '#/components/headers/SyncCursor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenrePage'
              example:
                items:
                  - {id: gen_jazz, type: genre, name: Jazz, albumCount: 41, trackCount: 503}
                nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Default'

  /search:
    get:
      tags: [Search]
      operationId: search
      summary: Search artists, albums, tracks and playlists
      description: |
        Matching and ranking are the server's choice; results come back best match first. Each type
        pages on its own cursor: to see more tracks, repeat the request with `types=track` and that
        type's `nextCursor`.
      security:
        - oauth2: [catalog:read]
        - personalToken: [catalog:read]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 500}
          example: blue hour
        - name: types
          in: query
          description: 'Comma-separated. Known values: `artist`, `album`, `track`, `playlist`. Default: all.'
          schema: {type: string}
          example: album,track
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          description: Results per type.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Results, grouped by type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
              example:
                albums:
                  items:
                    - {id: alb_7d, type: album, title: Night Lines, artistDisplay: Example Quartet, releaseDate: '2024-03-15', trackCount: 9, durationMs: 2563000, artwork: {id: img_a81c}, userState: {favoritedAt: null, rating: 8, playCount: 4, lastPlayedAt: '2026-10-11T18:00:00.000Z', libraryAddedAt: '2026-09-01T12:00:00.000Z'}, revision: r_10440}
                  nextCursor: null
                tracks:
                  items:
                    - {id: trk_4f1, type: track, title: Blue Hour, album: {id: alb_7d, title: Night Lines}, artistDisplay: Example Quartet, discNumber: 1, trackNumber: 3, durationMs: 284000, userState: {favoritedAt: null, rating: null, playCount: 7, lastPlayedAt: '2026-10-11T18:00:00.000Z', libraryAddedAt: null}, revision: r_10431}
                  nextCursor: c_c2VhcmNoLjI
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Default'

  /artwork/{artworkId}:
    get:
      tags: [Media]
      operationId: getArtwork
      summary: Fetch an image, resized
      description: |
        Artwork ids identify image content, so a response never changes for a given id and size and
        is served with `Cache-Control: private, max-age=31536000, immutable` (private, because this
        request carries `Authorization`). When a track's art changes, the track gets a new artwork
        id. A loader that sends headers keys its cache by artwork id and size. For a context that
        cannot send headers (lock screen, car, web `<img>`), get a signed URL from `POST /media/urls`;
        artwork URLs are stable for a user, id and size for `limits.artworkUrlTtlSeconds`, so image
        caches keep hitting.
      security:
        - oauth2: [catalog:read]
        - personalToken: [catalog:read]
      parameters:
        - name: artworkId
          in: path
          required: true
          schema: {type: string}
        - name: size
          in: query
          description: Longest edge in pixels. The server may round up to a size it caches.
          schema: {type: integer, minimum: 16, maximum: 3000}
        - name: format
          in: query
          description: 'Preferred format. Known values: `jpeg`, `png`, `webp`, `avif`. The server may answer another.'
          schema: {type: string}
      responses:
        '200':
          description: Image bytes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            image/*:
              schema:
                type: string
                contentMediaType: image/*
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /playback/decisions:
    post:
      tags: [Media]
      operationId: createPlaybackDecision
      summary: Ask the server how to play or download a track on this device
      description: |
        The client declares what it can play and its constraints; the server decides between the
        original file and a transcode and answers with a plan holding a short-lived signed URL that
        a native player (AVPlayer, ExoPlayer) opens with no headers. Asking for a plan records
        nothing: a play is recorded only by `POST /me/plays`.

        A signed URL lives for `limits.mediaUrlTtlSeconds` (at least an hour), independent of the
        access token that asked for it, and dies early only when that token's grant is revoked.
        Resolve URLs lazily, a track or two ahead of playback, never for a whole queue at once.

        With `startMs` above zero, a transcode begins at that point: stream time zero is media time
        `offsetMs` (equal to `startMs`, or the nearest earlier frame the server could cut at),
        `durationMs` is still the whole track, `streamDurationMs` is what the stream holds, and
        `contentLength` counts the stream's bytes. A player shows `offsetMs + stream time` and counts
        listened time the same way.
      security:
        - oauth2: [media:read]
        - personalToken: [media:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackRequest'
            example:
              trackId: trk_4f1
              purpose: stream
              startMs: 0
              profile:
                name: Example Player on iPhone
                maxBitrate: 320000
                network: cellular
                directPlay:
                  - {container: mp4, codec: aac}
                  - {container: mp4, codec: alac}
                  - {container: flac, codec: flac, maxSampleRate: 96000, maxBitDepth: 24}
                  - {container: mp3, codec: mp3}
                transcodeTargets:
                  - {container: mp4, codec: aac}
                  - {container: mp3, codec: mp3}
      responses:
        '200':
          description: The plan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackPlan'
              example:
                trackId: trk_4f1
                mode: transcode
                reasons: [bitrateAboveLimit]
                url: https://music.example.com/dulcet/v1/media/mg_Q2xvdWQtbGluZXMuNGYxLnRyYW5zY29kZQ
                expiresAt: '2026-10-12T16:00:00Z'
                id: pp_6b1e
                mimeType: audio/mp4
                container: mp4
                codec: aac
                bitrate: 256000
                sampleRate: 44100
                channels: 2
                offsetMs: 0
                durationMs: 284000
                streamDurationMs: 284000
                contentLength: 9088000
                lengthExact: false
                byteRanges: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Default'

  /media/urls:
    post:
      tags: [Media]
      operationId: createMediaUrls
      summary: Get short-lived signed URLs for artwork or original-file downloads
      description: |
        Batch-signs URLs for contexts that cannot send an `Authorization` header. Streams come from
        `POST /playback/decisions`, which also chooses the format. An `original` download requires the
        user's `download` permission.
      security:
        - oauth2: [media:read]
        - personalToken: [media:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUrlRequest'
            example:
              requests:
                - {kind: artwork, id: img_a81c, size: 600}
                - {kind: original, id: trk_4f1}
      responses:
        '200':
          description: One signed URL per request, in request order.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUrls'
              example:
                urls:
                  - {kind: artwork, id: img_a81c, url: 'https://music.example.com/dulcet/v1/media/mg_aW1nX2E4MWMuNjAw', expiresAt: '2026-10-12T16:00:00Z'}
                  - {kind: original, id: trk_4f1, url: 'https://music.example.com/dulcet/v1/media/mg_dHJrXzRmMS5vcmln', expiresAt: '2026-10-12T16:00:00Z'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /media/{grant}:
    get:
      tags: [Media]
      operationId: getMedia
      summary: Fetch media bytes through a signed URL
      description: |
        Needs no header: the opaque `grant` path segment authorizes exactly one resource for one
        user until it expires. Supports `Range` (206, and 416 when unsatisfiable). Expiry is checked
        when a request starts; a response already flowing is not cut off. A grant dies early when the
        token it was issued under is revoked. Servers and proxies log this path as `/media/***`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Grant'
        - name: Range
          in: header
          schema: {type: string}
          example: bytes=0-
      responses:
        '200':
          description: The whole body.
          headers:
            Accept-Ranges:
              schema: {type: string, const: bytes}
            Content-Length:
              schema: {type: integer}
          content:
            audio/*:
              schema: {type: string, contentMediaType: audio/*}
            image/*:
              schema: {type: string, contentMediaType: image/*}
        '206':
          description: Part of the body.
          headers:
            Content-Range:
              schema: {type: string}
          content:
            audio/*:
              schema: {type: string, contentMediaType: audio/*}
        '403':
          $ref: '#/components/responses/MediaGrantInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: The range cannot be satisfied.
          headers:
            Content-Range:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Default'
    head:
      tags: [Media]
      operationId: headMedia
      summary: Read media headers through a signed URL
      security: []
      parameters:
        - $ref: '#/components/parameters/Grant'
      responses:
        '200':
          description: Headers only.
        '403':
          $ref: '#/components/responses/MediaGrantInvalid'
        default:
          $ref: '#/components/responses/Default'

  /me/library:
    get:
      tags: [My Library]
      operationId: listMyLibrary
      summary: List the user's My Library members, newest addition first
      description: |
        Direct members only, each with its `libraryAddedAt`. To browse My Library the way the catalog
        is browsed (albums by title, for example), use the catalog lists with `scope=library`.
      security:
