  /mcp:
    post:
      tags: [AI]
      operationId: mcpMessage
      summary: Model Context Protocol endpoint (Streamable HTTP transport)
      description: |
        A JSON-RPC 2.0 message from an MCP client. Authorization follows the MCP authorization
        specification with this server's OAuth 2.1 authorization server, found through
        `/.well-known/oauth-protected-resource/dulcet/v1/mcp`, whose `resource` is this URL. The
        tool list depends on the token's scopes: read tools need `catalog:read` or `user:read`;
        write tools need `user:write`; tools that delete (a playlist, playlist entries, My Library
        members, plays) need `user:delete` and carry `destructiveHint: true`. A tool is never listed
        without its scope. No tool administers the server or reaches outside the user's own data.
        Every tool's `inputSchema`, `outputSchema` and annotations are published in
        `docs/dulcet-api/mcp-tools.json`, and `tools/list` returns exactly those the token's scopes
        allow, and no others. Each is returned with the file's `x-dulcet-scope` replaced by
        `_meta: {"dulcet/scopes": [...]}`, naming the scopes it needs.

        The server validates `Origin` on every request and refuses any origin it does not expect
        (DNS-rebinding defence), binds each `Mcp-Session-Id` to the token that opened it, and never
        accepts a session id as authentication. List tools page with `cursor` and return at most
        100 items per call.
      security:
        - oauth2: [catalog:read]
        - personalToken: [catalog:read]
      parameters:
        - name: Mcp-Session-Id
          in: header
          schema: {type: string}
        - name: MCP-Protocol-Version
          in: header
          schema: {type: string}
          example: '2025-11-25'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcMessage'
            example:
              jsonrpc: '2.0'
              id: 1
              method: tools/call
              params:
                name: search_catalog
                arguments: {query: blue hour, types: [track]}
      responses:
        '200':
          description: A JSON-RPC response, or an SSE stream of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcMessage'
              example:
                jsonrpc: '2.0'
                id: 1
                result:
                  content:
                    - {type: text, text: 'Blue Hour by Example Quartet (trk_4f1)'}
                  structuredContent:
                    tracks:
                      - {id: trk_4f1, title: Blue Hour, artist: Example Quartet, album: Night Lines, durationMs: 284000}
            text/event-stream:
              schema:
                type: string
        '202':
          description: Accepted (for notifications and responses sent by the client).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    get:
      tags: [AI]
      operationId: mcpStream
      summary: Open the MCP server-to-client SSE stream
      security:
        - oauth2: [catalog:read]
        - personalToken: [catalog:read]
      parameters:
        - name: Mcp-Session-Id
          in: header
          schema: {type: string}
      responses:
        '200':
          description: An SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: The server offers no standalone stream.
        default:
          $ref: '#/components/responses/Default'

