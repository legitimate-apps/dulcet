openapi: 3.1.0
info:
  title: Dulcet API
  version: 1.0.0
  summary: An open, resource-oriented HTTPS + JSON standard for music servers and clients.
  description: |
    Dulcet API v1 is a public standard for talking to a personal or shared music server: browsing a
    catalog, streaming, per-user state (favourites, ratings, plays, playlists, My Library), syncing
    through a per-user change feed, live events, signed webhooks and an MCP endpoint for AI agents.

    This document is the single source of truth for the contract. The human guide is
    `docs/dulcet-api/README.md`; a compact guide for language models is `docs/dulcet-api/llms.txt`.

    Rules every client and server follows (README "Principles" and "Evolution"):

    - **Header-only authentication.** A token is sent as `Authorization: Bearer <token>` and never in
      a URL. The only URLs that grant access are short-lived signed media URLs, which reach one
      resource and nothing else.
    - **Ignore what you do not know.** Clients ignore unknown fields. Enumerated string values are
      open: a client maps a value it does not recognise to a neutral default and keeps working.
    - **v1 is additive only.** Nothing documented here is removed or changes meaning within v1.
    - **Ids are opaque strings**, unique across every resource type on a server, never reused, and
      stable across retags and file moves.
    - **Errors are RFC 9457 problem details** (`application/problem+json`) with a stable `type` URN.
    - **Collections page by cursor**, never by offset.
    - **Durations are integer milliseconds; timestamps are RFC 3339 in UTC; bitrates are bits per
      second.**
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Dulcet project
    url: https://github.com/legitimate-apps/dulcet

servers:
  - url: https://{host}/dulcet/v1
    description: |
      Any Dulcet API server. The base URL is discovered from `/.well-known/dulcet`; `/dulcet/v1` is
      the path every conforming server uses for v1.
    variables:
      host:
        default: music.example.com
        description: The server's host and optional port.

security:
  - oauth2: []
  - personalToken: []

tags:
  - name: Discovery
    description: Finding a server's API versions, capabilities and authorization server.
  - name: Auth
    description: OAuth 2.1 endpoints. Their real locations come from the authorization server metadata.
  - name: Account
    description: The signed-in user, their tokens and their authorized apps.
  - name: Catalog
    description: Artists, albums, tracks, genres and libraries, as the server holds them (Browse).
  - name: Media
    description: Artwork, playback decisions and short-lived signed media URLs.
  - name: Search
    description: Full-text search across the catalog or My Library.
  - name: My Library
    description: The user's personal collection, separate from the whole catalog.
  - name: User state
    description: Favourites and ratings, and a batch endpoint for offline outboxes.
  - name: Plays
    description: Play history, play submission (scrobbling) and now playing.
  - name: Playlists
    description: Ordered, user-owned lists of tracks.
  - name: Queues
    description: Play queues saved per device and resumable from any other device.
  - name: Sync
    description: The per-user change feed.
  - name: Events
    description: Server-Sent Events for live changes.
  - name: Webhooks
    description: Signed HTTP callbacks for integrations.
  - name: Admin
    description: Users, scans and server administration.
  - name: AI
    description: The Model Context Protocol endpoint.

paths:
  /.well-known/dulcet:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [Discovery]
      operationId: getDiscovery
      summary: Discover the API versions and endpoints a server offers
      description: |
        The first request a client makes. Needs no authentication. A server that does not answer it
        with this document does not speak Dulcet API; a Dulcet app then falls back to OpenSubsonic.
      security: []
      responses:
        '200':
          description: The discovery document.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
              example:
                standard: dulcet
                apis:
                  - version: '1'
                    baseUrl: https://music.example.com/dulcet/v1
                    status: current
                server:
                  name: Dulcet Server
                  version: 0.2.0
                  instanceId: srv_9f2c41d0
                authorizationServer: https://music.example.com
                openapi: https://music.example.com/dulcet/v1/openapi.yaml
                mcp: https://music.example.com/dulcet/v1/mcp
        '404':
          $ref: '#/components/responses/NotFound'

  /capabilities:
    get:
      tags: [Discovery]
      operationId: getCapabilities
      summary: List the capabilities, limits and minor API version this server supports
      description: |
        Authentication is optional. Without a token the server answers with what any client may know
        (API version, auth flows, public capabilities). With a token it also reports what that user
        may do, so a client can show or hide features without trial requests.
      security:
        - {}
        - oauth2: []
        - personalToken: []
      responses:
        '200':
          description: Capabilities.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              example:
                apiVersion: '1.0'
                server:
                  name: Dulcet Server
                  version: 0.2.0
                  instanceId: srv_9f2c41d0
                capabilities:
                  dulcet.sync: {versions: [1]}
                  dulcet.events: {versions: [1]}
                  dulcet.webhooks: {versions: [1]}
                  dulcet.transcoding: {versions: [1]}
                  dulcet.lyrics: {versions: [1]}
                  dulcet.queues: {versions: [1]}
                  dulcet.mcp: {versions: [1]}
                  dulcet.admin: {versions: [1]}
                  org.example.radio: {versions: [2]}
                limits:
                  maxPageSize: 500
                  maxBatchSize: 500
                  syncRetentionDays: 90
                  mediaUrlTtlSeconds: 21600
                auth:
                  flows: [authorization_code, device_code, refresh_token, personal_token]
                  scopes: [library:read, media:read, user:read, user:write, plays:write, account, admin, offline_access]
                permissions:
                  scopes: [library:read, media:read, user:read, user:write, plays:write]
                  download: true
                  admin: false
        '304':
          $ref: '#/components/responses/NotModified'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /openapi.yaml:
    get:
      tags: [Discovery]
      operationId: getOpenApiDocument
      summary: Fetch this OpenAPI document as the server implements it
      security: []
      responses:
        '200':
          description: The OpenAPI document, including any vendor extensions the server adds.
          content:
            application/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /.well-known/oauth-authorization-server:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [Auth]
      operationId: getAuthorizationServerMetadata
      summary: OAuth 2.0 authorization server metadata (RFC 8414)
      description: |
        Names the authorize, token, device authorization, revocation and registration endpoints.
        Clients must read endpoint locations from here, never assume the paths below.
      security: []
      responses:
        '200':
          description: Authorization server metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'
              example:
                issuer: https://music.example.com
                authorization_endpoint: https://music.example.com/oauth/authorize
                token_endpoint: https://music.example.com/oauth/token
                device_authorization_endpoint: https://music.example.com/oauth/device_authorization
                revocation_endpoint: https://music.example.com/oauth/revoke
                registration_endpoint: https://music.example.com/oauth/register
                grant_types_supported: [authorization_code, refresh_token, 'urn:ietf:params:oauth:grant-type:device_code']
                response_types_supported: [code]
                code_challenge_methods_supported: [S256]
                token_endpoint_auth_methods_supported: [none]
                client_id_metadata_document_supported: true
                scopes_supported: [library:read, media:read, user:read, user:write, plays:write, account, admin, offline_access]
        '404':
          $ref: '#/components/responses/NotFound'

  /.well-known/oauth-protected-resource:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [Auth]
      operationId: getProtectedResourceMetadata
      summary: OAuth 2.0 protected resource metadata (RFC 9728)
      description: Lets MCP clients and other generic OAuth clients find the authorization server.
      security: []
      responses:
        '200':
          description: Protected resource metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'
              example:
                resource: https://music.example.com/dulcet/v1
                authorization_servers: [https://music.example.com]
                bearer_methods_supported: [header]
                scopes_supported: [library:read, media:read, user:read, user:write, plays:write, account, admin, offline_access]
        '404':
          $ref: '#/components/responses/NotFound'

  /oauth/authorize:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    get:
      tags: [Auth]
      operationId: authorize
      summary: Start an authorization code flow with PKCE (browser redirect)
      description: |
        Opened in a browser or system authentication session, never called by a client's HTTP stack.
        The server signs the user in on its own page, shows the client's name and requested scopes,
        and redirects to `redirect_uri` with `code` and `state`. Only `S256` PKCE is accepted. The
        location comes from metadata; this path is the reference server's.
      security: []
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, const: code}}
        - {name: client_id, in: query, required: true, schema: {type: string}, description: 'A client id metadata document URL, or an id from dynamic registration.'}
        - {name: redirect_uri, in: query, required: true, schema: {type: string, format: uri}}
        - {name: scope, in: query, required: true, schema: {type: string}, example: 'library:read media:read user:read user:write plays:write offline_access'}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, const: S256}}
        - {name: resource, in: query, required: false, schema: {type: string, format: uri}, description: RFC 8707 resource indicator; the API base URL.}
      responses:
        '200':
          description: The server's own sign-in and consent page.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect back to the client with `code` and `state`, or with `error`.
        '400':
          $ref: '#/components/responses/BadRequest'

  /oauth/token:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    post:
      tags: [Auth]
      operationId: requestToken
      summary: Exchange a code, device code or refresh token for tokens
      description: |
        Standard OAuth 2.1 token endpoint. Errors use the OAuth error format (RFC 6749 §5.2), not
        problem details, so stock OAuth libraries work. Refresh tokens rotate: each use returns a new
        refresh token and invalidates the old one; replaying a used refresh token revokes the whole
        grant.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              grant_type: authorization_code
              code: SplxlOBeZQQYbYS6WxSbIA
              redirect_uri: com.example.player:/oauth/callback
              client_id: https://player.example.org/oauth/client.json
              code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      responses:
        '200':
          description: Tokens.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: dulcet_at_3kTq9LZb0mR2vX7yN4pW8cJ1
                token_type: Bearer
                expires_in: 3600
                refresh_token: dulcet_rt_Hq2nV8sK5tY1zB6xM3fR9dL0
                scope: library:read media:read user:read user:write plays:write offline_access
        '400':
          description: An OAuth error, such as `invalid_grant`, `authorization_pending` or `slow_down`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: authorization_pending
                error_description: The user has not finished signing in yet.

  /oauth/device_authorization:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    post:
      tags: [Auth]
      operationId: requestDeviceAuthorization
      summary: Start a device authorization grant (RFC 8628) for TVs and CLIs
      description: |
        The device shows `user_code` and `verification_uri` (and may render
        `verification_uri_complete` as a QR code), then polls the token endpoint with
        `grant_type=urn:ietf:params:oauth:grant-type:device_code` no faster than `interval` seconds.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
            example:
              client_id: https://tv.example.org/oauth/client.json
              scope: library:read media:read user:read plays:write offline_access
      responses:
        '200':
          description: Device codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
              example:
                device_code: GmRhmhcxhwAzkoEqiMEg_DnyEysNkuNhszIySk9eS
                user_code: WDJB-MJHT
                verification_uri: https://music.example.com/device
                verification_uri_complete: https://music.example.com/device?user_code=WDJB-MJHT
                expires_in: 900
                interval: 5
        '400':
          description: An OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth/revoke:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    post:
      tags: [Auth]
      operationId: revokeToken
      summary: Revoke an access or refresh token (RFC 7009)
      description: Revoking a refresh token revokes its whole grant, including every access token and signed media URL issued from it.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevocationRequest'
            example:
              token: dulcet_rt_Hq2nV8sK5tY1zB6xM3fR9dL0
              token_type_hint: refresh_token
              client_id: https://player.example.org/oauth/client.json
      responses:
        '200':
          description: Revoked, or the token was already invalid.
        '400':
          description: An OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth/register:
    servers:
      - url: https://{host}
        variables:
          host:
            default: music.example.com
    post:
      tags: [Auth]
      operationId: registerClient
      summary: Register a public client dynamically (RFC 7591)
      description: |
        For clients that cannot publish a client id metadata document. Servers may require an admin
        to approve registrations, or turn this endpoint off; the metadata says whether it exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
            example:
              client_name: Example Player
              redirect_uris: ['http://127.0.0.1/callback']
              grant_types: [authorization_code, refresh_token]
              token_endpoint_auth_method: none
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'
              example:
                client_id: cli_5d1a7e
                client_name: Example Player
                redirect_uris: ['http://127.0.0.1/callback']
                grant_types: [authorization_code, refresh_token]
                token_endpoint_auth_method: none
        '400':
          description: An OAuth registration error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the signed-in user
      security:
        - oauth2: []
        - personalToken: []
      responses:
        '200':
          description: The user behind the token, with the scopes that token holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: usr_01
                username: robin
                displayName: Robin
                roles: []
                permissions: {download: true, share: true}
                libraryIds: [lib_main]
                createdAt: '2026-10-01T09:00:00Z'
                token:
                  id: tok_7a
                  kind: oauth
                  scopes: [library:read, media:read, user:read, user:write, plays:write, offline_access]
                  clientName: Dulcet
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/tokens:
    get:
      tags: [Account]
      operationId: listTokens
      summary: List the user's personal access tokens and authorized app sessions
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tokens. Secrets are never returned after creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
              example:
                items:
                  - id: tok_7a
                    kind: oauth
                    name: Dulcet on iPhone
                    clientName: Dulcet
                    scopes: [library:read, media:read, user:read, user:write, plays:write, offline_access]
                    createdAt: '2026-10-02T08:00:00Z'
                    lastUsedAt: '2026-10-12T07:55:00Z'
                    expiresAt: null
                    hint: dulcet_rt_Hq2n
                nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Account]
      operationId: createPersonalToken
      summary: Create a scoped personal access token for a script or integration
      description: The secret is returned once, in this response. A token can never hold a scope the user's role does not allow.
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalTokenCreate'
            example:
              name: Home Assistant now-playing
              scopes: [user:read]
              expiresInDays: 365
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalTokenCreated'
              example:
                id: tok_9c
                kind: personal
                name: Home Assistant now-playing
                scopes: [user:read]
                createdAt: '2026-10-12T10:00:00Z'
                lastUsedAt: null
                expiresAt: '2027-10-12T10:00:00Z'
                hint: dulcet_pat_Xw3
                secret: dulcet_pat_Xw3e8Rk1Lq0Zt5Nv2Bc7Hy4M
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /me/tokens/{tokenId}:
    delete:
      tags: [Account]
      operationId: revokeTokenById
      summary: Revoke a personal access token or sign an app session out
      description: Takes effect at once, for the token and for every signed media URL issued under it.
      security:
        - oauth2: [account]
        - personalToken: [account]
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Revoked, or already gone.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/export:
    get:
      tags: [Account]
      operationId: exportUserData
      summary: Export everything the server holds about the user
      description: |
        Streams the user's favourites, ratings, My Library, playlists, queues and full play history
        as JSON Lines, one record per line, each with a `kind` field. Catalog items carry their
        external ids (MusicBrainz, ISRC) so another server can match them. Portability is part of
        the standard: every Core server implements this.
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      responses:
        '200':
          description: The export.
          content:
            application/x-ndjson:
              schema:
                type: string
              example: |
                {"kind":"header","standard":"dulcet","apiVersion":"1.0","exportedAt":"2026-10-12T10:00:00Z","userId":"usr_01"}
                {"kind":"favorite","itemId":"trk_4f1","itemType":"track","favoritedAt":"2026-09-30T20:11:00Z","externalIds":{"isrc":"USXXX2600001"}}
                {"kind":"play","id":"7c0e4a52-1f8b-4f8e-9a51-2e0c35a5b0d1","trackId":"trk_4f1","startedAt":"2026-10-11T18:00:00Z","listenedMs":201000}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /libraries:
    get:
      tags: [Catalog]
      operationId: listLibraries
      summary: List the music libraries (top-level folders) the user can see
      security:
        - oauth2: [library:read]
        - personalToken: [library:read]
      responses:
        '200':
          description: Libraries.
          headers:
            Dulcet-Sync-Cursor:
              $ref: '#/components/headers/SyncCursor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryPage'
              example:
                items:
                  - {id: lib_main, type: library, name: Music, trackCount: 12840}
                nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /artists:
    get:
      tags: [Catalog]
      operationId: listArtists
      summary: List artists
      security:
        - oauth2: [library:read]
        - personalToken: [library:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Ids'
        - name: role
          in: query
          description: 'Only artists credited in this role. Known values: `albumArtist` (default), `artist`, `composer`. Open set.'
          schema: {type: string, default: albumArtist}
        - name: sort
          in: query
          description: 'Known values: `name`, `-addedAt`, `-playCount`, `-lastPlayedAt`, `-libraryAddedAt`. A leading `-` sorts descending.'
          schema: {type: string, default: name}
      responses:
        '200':
          description: A page of artists.
          headers:
            Dulcet-Sync-Cursor:
              $ref: '#/components/headers/SyncCursor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistPage'
              example:
                items:
                  - id: art_2b
                    type: artist
                    name: Example Quartet
                    sortName: Example Quartet
                    albumCount: 3
                    trackCount: 31
                    artwork: {id: img_a81c}
                    externalIds: {musicbrainzArtistId: 5b11f4ce-a62d-471e-81fc-a69a8278c7da}
                    userState: {favoritedAt: null, rating: null, playCount: 12, lastPlayedAt: '2026-10-11T18:00:00Z', libraryAddedAt: '2026-09-01T12:00:00Z'}
                    revision: r_10443
                nextCursor: c_YXJ0XzJi
                total: 412
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /artists/{artistId}:
    get:
      tags: [Catalog]
      operationId: getArtist
      summary: Get an artist
      security:
        - oauth2: [library:read]
        - personalToken: [library:read]
