        - name: sort
          in: query
          description: 'Known values: `title` (default), `artist`, `album`, `-addedAt`, `-playCount`, `-lastPlayedAt`, `-libraryAddedAt`, `-favoritedAt`, `random`.'
          schema: {type: string, default: title}
      responses:
        '200':
          description: A page of tracks.
          headers:
            Dulcet-Sync-Cursor:
              $ref: '#/components/headers/SyncCursor'
