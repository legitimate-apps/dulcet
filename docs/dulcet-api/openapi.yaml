  /me/library/{itemId}:
    put:
      tags: [My Library]
      operationId: addToMyLibrary
      summary: Add an artist, album or track to My Library
      description: |
        Idempotent. Adding a member keeps its original `libraryAddedAt`. Membership is per item:
        adding an album does not add its tracks, and adding a track does not add its album.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/ActionTime'
      responses:
        '200':
          description: The item's state for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemState'
              example:
                itemId: trk_4f1
                itemType: track
                favoritedAt: '2026-09-30T20:11:00.000Z'
                rating: 8
                playCount: 7
                lastPlayedAt: '2026-10-11T18:00:00.000Z'
                libraryAddedAt: '2026-10-12T10:00:00.000Z'
                revision: r_10452
                applied: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    delete:
      tags: [My Library]
      operationId: removeFromMyLibrary
      summary: Remove an item from My Library
      description: |
        Idempotent. Removing a non-member, or an id the catalog no longer holds, succeeds. Removal
        discards the original `libraryAddedAt`, so it needs the separate `user:delete` scope.
      security:
        - oauth2: [user:delete]
        - personalToken: [user:delete]
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/ActionTime'
      responses:
        '204':
          description: Not a member.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'

  /me/favorites:
