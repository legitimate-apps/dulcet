  /admin/test/settings:
    get:
      tags: [Testing]
      operationId: getTestSettings
      summary: Read the test-mode overrides in effect
      description: |
        Testing profile only (README "Testing"). Exists only on a server started in test mode and
        answers `404` everywhere else, exactly as an unknown path would. Needs `admin`.
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      responses:
        '200':
          description: The overrides in effect. Absent fields mean the normal behaviour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSettings'
              example:
                autoApprove: [{clientId: 'http://127.0.0.1/conformance', userId: usr_02}]
                syncRetentionSeconds: 5
                mediaUrlTtlSeconds: 2
                rateLimit: {requestsPerWindow: 10, windowSeconds: 5}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    put:
      tags: [Testing]
      operationId: replaceTestSettings
      summary: Set the test-mode overrides
      description: |
        Replaces every override at once; send `{}` to restore normal behaviour. Overrides live in
        memory and end when the server stops. They may go below the minimums `limits` promises
        (`limits` keeps reporting the configured values; this resource reports the effective ones).

        - `autoApprove`: for each listed client id, `/oauth/authorize` skips the sign-in and consent
          pages and redirects at once with a code for `userId`, and a device code requested by that
          client is approved for `userId` as soon as it is issued. Every other rule still applies:
          PKCE, exact redirects, `iss`, scope limits, and an unverified client never getting `admin`
          or `account`.
        - `syncRetentionSeconds`: journal entries older than this are compacted at once and on
          every later write, so an old cursor answers `410`.
        - `mediaUrlTtlSeconds`, `artworkUrlTtlSeconds`: lifetimes of signed URLs issued from now on.
        - `rateLimit`: the limiter for every non-test endpoint, per token; a request over it answers
          `429` with `Retry-After`. Test endpoints are never limited.
        - `trustedClients`: client id metadata documents, given inline, that the server treats as
          fetched and verified (README "Registered"), so a verified client, which may be granted
          `account`, can sign in with no network. Each document's `client_id` is its key; every
          other rule still applies.
        - `webhooks.allowPrivateTargets`: webhook targets may be `http://`, on any port, and on
          loopback or private addresses (never link-local or cloud metadata ones), so a receiver
          can run beside the suite. Outside test mode the target rules are unchanged.
        - `webhooks.retryScheduleSeconds`: after a failed delivery, the server tries again after
          each of these delays in turn, then gives that delivery up.
        - `webhooks.disableAfterFailures`: after this many consecutive failed attempts the webhook
          becomes `active: false` with `disabledReason: delivery-failures` and gets no more
          deliveries until re-enabled.
      security:
        - oauth2: [admin]
        - personalToken: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSettings'
            example:
              autoApprove: [{clientId: 'http://127.0.0.1/conformance', userId: usr_02}]
              syncRetentionSeconds: 5
      responses:
        '200':
          description: The overrides now in effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSettings'
              example:
                autoApprove: [{clientId: 'http://127.0.0.1/conformance', userId: usr_02}]
                syncRetentionSeconds: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

