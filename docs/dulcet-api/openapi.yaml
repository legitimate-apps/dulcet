  /me/batch:
    post:
      tags: [User state]
      operationId: applyUserStateBatch
      summary: Apply many favourite, rating and My Library changes in one request
      description: |
        For flushing an offline outbox. Operations apply in order and each reports its own result;
        one failure does not undo the others. A repeat with the same `Idempotency-Key` returns the
        first response.

        Each operation should carry `at`, the time the person acted. The server orders edits to one
        field by `at`, not by arrival (last writer wins; a later `at` already applied makes an older
        edit a no-op, reported with `applied: false`). A favourite keeps the earliest `at` among
        favourites, and a stored timestamp is the action time, not the flush time. An `at` in the
        future is treated as the time of receipt. `libraryRemove` needs `user:delete` as well; without
        it that operation alone answers `403`.
      security:
        - oauth2: [user:write]
        - personalToken: [user:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStateBatch'
            example:
              operations:
                - {op: favorite, itemId: trk_4f1, at: '2026-10-12T09:58:12.250Z'}
                - {op: rate, itemId: alb_7d, rating: 8, at: '2026-10-12T09:58:30.000Z'}
                - {op: libraryAdd, itemId: alb_7d, at: '2026-10-12T09:59:01.000Z'}
                - {op: libraryRemove, itemId: trk_gone, at: '2026-10-12T09:59:40.000Z'}
      responses:
        '200':
          description: One result per operation, in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStateBatchResult'
              example:
                results:
                  - {status: 200, applied: true}
                  - {status: 200, applied: false}
                  - {status: 200, applied: true}
                  - {status: 204, applied: true}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        default:
          $ref: '#/components/responses/Default'

  /me/plays:
    get:
      tags: [Plays]
      operationId: listPlays
      summary: List the user's play history, newest first
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: since
          in: query
          description: Only plays that started at or after this time.
          schema: {type: string, format: date-time}
        - name: trackId
          in: query
          schema: {type: string}
      responses:
        '200':
          description: A page of plays.
          headers:
            Dulcet-Sync-Cursor:
              $ref: '#/components/headers/SyncCursor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayPage'
              example:
                items:
                  - id: 7c0e4a52-1f8b-4f8e-9a51-2e0c35a5b0d1
                    trackId: trk_4f1
                    startedAt: '2026-10-11T18:00:00.000Z'
                    listenedMs: 201000
                    completed: false
                    deviceId: dev_iphone_3c
                    client: Example Player/1.4
                    context: {type: album, id: alb_7d}
                    offline: false
                    recordedAt: '2026-10-11T18:03:22.410Z'
                nextCursor: c_cGxheV83YzBl
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    post:
      tags: [Plays]
      operationId: submitPlays
      summary: Record finished plays (scrobble), singly or as an offline batch
      description: |
        Each play carries a client-generated UUID `id`. The server records a given id once, ever:
        resubmitting it (after a lost response, from an offline queue) answers `duplicate` and counts
        nothing again. That makes delivery at-least-once and recording exactly-once. The client
        decides when a listen counts (its threshold over progressing media time) and submits only
        those; the server may still ignore a play it judges invalid, and says so per play. A play of
        an id the user cannot see is answered `unknownTrack` and not stored. An id that was deleted
        with `DELETE /me/plays/{playId}` answers `duplicate`: deleting a play never lets a retry
        bring it back.
      security:
        - oauth2: [plays:write]
        - personalToken: [plays:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaySubmission'
            example:
              plays:
                - id: 7c0e4a52-1f8b-4f8e-9a51-2e0c35a5b0d1
                  trackId: trk_4f1
                  startedAt: '2026-10-11T18:00:00Z'
                  listenedMs: 201000
                  completed: false
                  deviceId: dev_iphone_3c
                  context: {type: album, id: alb_7d}
                  offline: false
      responses:
        '200':
          description: One result per play, in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaySubmissionResult'
              example:
                results:
                  - {id: 7c0e4a52-1f8b-4f8e-9a51-2e0c35a5b0d1, status: recorded}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Default'

  /me/plays/{playId}:
    delete:
      tags: [Plays]
      operationId: deletePlay
      summary: Delete one play from the history
      description: |
        Removes the play and takes it out of play counts. The server keeps the id (and nothing else)
        so a resubmission is answered `duplicate` and not recorded again. Needs `user:delete`.
      security:
        - oauth2: [user:delete]
        - personalToken: [user:delete]
      parameters:
        - name: playId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Deleted, or already gone.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'

  /me/now-playing:
    put:
      tags: [Plays]
      operationId: setNowPlaying
      summary: Report what this device is playing now
      description: |
        A heartbeat, not a play: it never changes play counts. Send it on start, pause, seek and track
        change, and at least every `ttlSeconds / 2` while playing. The entry expires on its own. It
        is separate from the shared queue: any device may report now playing, including one playing
        offline-cached music outside the queue. The response carries ids only, because
        `plays:write` grants nothing else.
      security:
        - oauth2: [plays:write]
        - personalToken: [plays:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NowPlayingReport'
            example:
              deviceId: dev_iphone_3c
              deviceName: Robin's iPhone
              trackId: trk_4f1
              state: playing
              positionMs: 64000
              ttlSeconds: 120
      responses:
        '200':
          description: The stored entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NowPlaying'
              example:
                deviceId: dev_iphone_3c
                deviceName: Robin's iPhone
                trackId: trk_4f1
                state: playing
                positionMs: 64000
                ttlSeconds: 120
                userId: usr_01
                updatedAt: '2026-10-12T10:00:00.000Z'
                expiresAt: '2026-10-12T10:02:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'
    delete:
      tags: [Plays]
      operationId: clearNowPlaying
      summary: Stop reporting now playing for a device
      description: |
        The device is named by the `deviceId` query parameter or, when that is absent, by the
        `Dulcet-Device-Id` header. With neither, the server answers `400`.
      security:
        - oauth2: [plays:write]
        - personalToken: [plays:write]
      parameters:
        - name: deviceId
          in: query
          required: false
          description: The device to clear; defaults to the `Dulcet-Device-Id` header.
          schema: {type: string}
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '204':
          description: Cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'

  /now-playing:
    get:
      tags: [Plays]
      operationId: listNowPlaying
      summary: List what is playing now, on the user's devices and those shared with them
      description: |
        A user sees their own devices, plus other users who turned on `settings.shareNowPlaying`
        (off by default); an admin sees everyone. `track` is included only when the token also holds
        `catalog:read`.
      security:
        - oauth2: [user:read]
        - personalToken: [user:read]
      responses:
        '200':
          description: Active entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NowPlaying'
              example:
                items:
                  - {deviceId: dev_iphone_3c, deviceName: Robin's iPhone, trackId: trk_4f1, state: playing, positionMs: 64000, ttlSeconds: 120, userId: usr_01, userName: Robin, updatedAt: '2026-10-12T10:00:00.000Z', expiresAt: '2026-10-12T10:02:00.000Z'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Default'

