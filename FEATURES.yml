signed app copy under a separate bundle identifier, launched by NSWorkspace with activates=false): macOS did not relaunch that killed copy for its background session within the 60 s watch; a separate measurement watched for 120 s. The system finished the transfer while the app was not running and the next harness launch reconciled it. Unattended relaunch in the sandboxed distribution app remains ASSUMED; this proof does not establish a general macOS relaunch rule (spec §28, 2026-10-07; docs/download-background-blockers.md). The row's Download is driven through the Mac app hosted over the production root view (DulcetMacDownloadRowAppTest), with the device's downloads recorded in place of the session: a click on the button drawn beside the row asks for that track by the server's id, and the control and the row's accessibility value follow the download through Downloading, Retry Download (whose click asks again) and Downloaded. The button used to be read with the row's label, so VoiceOver heard the track's name for it; that proof fails without the fix. Not covered on the Mac: a downloaded track played from the reader's library with the server unreachable, through the UI."
