      "id": "library.sync",
      "title": "Synchronize and browse the library",
      "spec": "docs/superpowers/specs/2026-08-18-dulcet-design.md#162-shape-of-a-full-import",
      "gates": ["account:authenticated"],
      "conformance": ["CONF-31", "CONF-32", "CONF-33"],
      "platforms": {
        "macos": {
          "status": "planned",
          "reason": "The macOS app now reads music folders, artists, paged album summaries, and bounded-concurrency album track listings directly from the connected OpenSubsonic server, with explicit loading, empty, error, and cancellation behavior. It has no SQLDelight cache, generations, checkpoints, stability witness, scheduled refresh, or offline metadata, and every return to Library fetches the complete browse again. The LibraryBrowseTest and DulcetKit production-data-source tests cover this narrower read-through behavior, but they are intentionally not listed as CONF-31/32/33 evidence because those controls specify the deferred durable library engine."
        }, "ios": {"status": "planned"},
        "ipados": {"status": "planned"}, "tvos": {"status": "planned"},
        "android": {"status": "planned"}, "androidtv": {"status": "planned"}
      }
    },
    {
      "id": "search.query",
      "title": "Search the local and server library",
      "spec": "docs/superpowers/specs/2026-08-18-dulcet-design.md#181-search",
      "gates": ["account:authenticated"],
      "conformance": ["CONF-41"],
      "platforms": {
        "macos": {
          "status": "planned",
          "reason": "The server half is implemented as a read-through search3 query with per-type counts and offsets, a 250 ms presentation debounce, in-flight cancellation, explicit ranking, independently paged result types, and Objective-C class DTOs copied into Swift value types. On macOS, double-click and Return now send one semantic presentation action: an activatable track builds a search-sourced queue from the ranked result set, an album opens album detail, and an artist opens artist detail through the existing library read. A track result whose server response omits duration remains visible but unactivatable because the authoritative queue contract requires duration; an album or artist that search3 returns but the subsequent complete library read omits cannot open detail and surfaces a library protocol error. The required apple-ci/apple-ci job runs SearchTest/ranksExactPrefixWordStartSubstringThenTypeWithCompatibilityNormalization and the DulcetKit tests serverSearchDebouncesCancelsAndPagesEachResultTypeIndependently and searchResultActivationRoutesTracksAlbumsAndArtistsThroughPresentationIntent, but the registered CONF-41 local/server merge control does not exist, and this build deliberately has no local database, normalized index column, instant local results, or local/server merge. The broader feature therefore remains planned rather than using narrower server-only controls as promotion evidence. The registry and the design's representative-test table were reconciled: they now name the same conformance ids, CONF-41 is search merge in both, and getCoverArt moved to CONF-44. tools/parity_gate.py now fails if either document names an id the other does not."
        }, "ios": {"status": "planned"},
        "ipados": {"status": "planned"}, "tvos": {"status": "planned"},
        "android": {"status": "planned"}, "androidtv": {"status": "planned"}
      }
    },
