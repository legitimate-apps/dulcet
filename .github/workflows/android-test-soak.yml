name: Android emulator loader diagnostic

# Diagnostic branch only: zero native tests, no images, AVDs, application builds or package installs.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-engine-loader-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  loader:
    name: Loader engine ${{ matrix.pin.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pin:
          - version: '37.2.12'
            build: '16428233'
            sha256: b08fc43d8608d2955f607f1b287beb525041e730086bdca3af152accac3af9c1
          - version: '37.2.13'
            build: '16740729'
            sha256: cbc7c3cfb83220b8a0f9c513fdab557712e74d339ec19ddffa43f23350ae9bdd
    env:
      EMULATOR_PIN: ${{ toJSON(matrix.pin) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify the official archive and execute the version command once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine-loader" "$RUNNER_TEMP/loader-sdk"
          git rev-parse HEAD > "$RUNNER_TEMP/engine-loader/source-sha.txt"
          printf '%s\n' "$EMULATOR_PIN" > "$RUNNER_TEMP/engine-loader/pin.json"
          printf '%s\n' '{"nativeTestsExecuted":0,"scope":"loader-only; no images, AVD, app, fixture or apt"}' > "$RUNNER_TEMP/engine-loader/scope.json"
          DULCET_EMULATOR_LOADER_RECEIPTS="$RUNNER_TEMP/engine-loader/receipts" ANDROID_HOME="$RUNNER_TEMP/loader-sdk" python3 tools/ci/android-system-image install-emulator --api-level 34 --target google_apis --arch x86_64 --emulator-pin "$EMULATOR_PIN" 2>&1 | tee "$RUNNER_TEMP/engine-loader/install.log"
      - name: Preserve loader receipts without claiming native acceptance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-engine-loader-${{ matrix.pin.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-loader
          if-no-files-found: error
          retention-days: 14
