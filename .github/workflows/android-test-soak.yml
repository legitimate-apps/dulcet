name: Android host-test soak
run-name: ${{ inputs.design_tour != 'off' && inputs.design_tour != '' && format('Android design tour ({0})', inputs.design_tour) || 'Android host-test soak' }}

# Runs one filtered set of Android host (Robolectric/JVM) tests many times on the runner that
# core-ci uses, and counts every repetition from its JUnit XML. New host tests have repeatedly
# passed in local loops on Apple Silicon and then raced on ubuntu-latest after merge; a local loop
# does not sample this environment, and this workflow does. Dispatch it for the changed classes
# before opening a pull request that adds or changes Android host tests (CLAUDE.md).
#
# workflow_dispatch only: it never runs automatically, and it is an instrument, never a gate.

on:
  workflow_dispatch:
    inputs:
      design_tour:
        description: 'Capture design screenshots instead of host-test soak'
        type: choice
        default: 'off'
        options: ['off', phone, phone-light, phone-dark, phone-font2, tv, all]
      design_section:
        description: 'Design section to capture (navigation is main plus supplement)'
        type: choice
        default: all
        options: [all, navigation, main, supplement, details, system, dulcet, states, states-mixed, states-routes, states-details, states-busy, empty, connection, dialogs]
      task:
        description: Gradle test task to repeat
        required: true
        default: ':android:app:testProdDebugUnitTest'
        type: string
      tests:
        description: Comma-separated Gradle --tests filters, e.g. *DownloadExecutorTest,*LibraryDepthTest
        required: true
        type: string
      repeat:
        # A string, not a number: workflow_dispatch inputs reach the API as strings, and a JSON
        # number in a dispatch request is rejected. Validated as an integer below.
        description: Repetitions (1 to 100)
        required: true
        default: '20'
        type: string
      disposable_conformance:
        description: Start the local disposable Navidrome and enable production app conformance tests
        required: false
        default: false
        type: boolean
      discover_fixture:
        description: Use the finite Discover and Wishlist fixture for PhoneWishlistIntegrationTest
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Phone and TV samples on the same ref are independent and must not cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.task }}-${{ inputs.design_tour || 'off' }}-${{ inputs.design_section || 'all' }}
  cancel-in-progress: true

jobs:
  android-test-soak:
    name: android-test-soak
    if: ${{ inputs.design_tour == 'off' || inputs.design_tour == '' }}
    runs-on: ubuntu-latest
    # The loop stops starting repetitions after SOAK_BUDGET_SECONDS and reports what it drew, so a
    # slow class yields a partial (failing) result instead of a timed-out job that uploads nothing.
    timeout-minutes: 120
    env:
      SOAK_TASK: ${{ inputs.task }}
      SOAK_TESTS: ${{ inputs.tests }}
      SOAK_REPEAT: ${{ inputs.repeat }}
      SOAK_BUDGET_SECONDS: "6000"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the requested soak
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$SOAK_TASK" =~ ^(:[A-Za-z0-9_-]+)+$ ]]; then
            echo "SOAK ERROR task must be a Gradle task path such as :android:app:testProdDebugUnitTest: $SOAK_TASK"
            exit 2
          fi
          if [[ -z "${SOAK_TESTS//[[:space:]]/}" ]]; then
            echo "SOAK ERROR tests filter is required"
            exit 2
          fi
          if ! [[ "$SOAK_REPEAT" =~ ^[0-9]+$ ]] || (( SOAK_REPEAT < 1 || SOAK_REPEAT > 100 )); then
            echo "SOAK ERROR repeat must be an integer from 1 to 100: $SOAK_REPEAT"
            exit 2
          fi
          echo "SOAK PLAN task=$SOAK_TASK tests=$SOAK_TESTS repeat=$SOAK_REPEAT"
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-${{ steps.pins.outputs.compile_sdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Start disposable conformance environment
        if: ${{ inputs.disposable_conformance && !inputs.discover_fixture }}
        run: |
          root="$(tools/conformance-env/new-class-root --parent "$RUNNER_TEMP" --label android-soak)"
          echo "SOAK_CONFORMANCE_ROOT=$root" >> "$GITHUB_ENV"
          tools/conformance-env/linux-local --root "$root" up
      - name: Provision the Discover fixture
        if: ${{ inputs.discover_fixture }}
        timeout-minutes: 10
        run: |
          # Use the same Ubuntu archive fallback as the existing server conformance leg.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg lsof
          tools/run-gradle-exclusive --no-daemon --max-workers=2 :server:installDist
          python3 tools/ci/prepare-discover-fixture
      - name: Repeat the filtered tests
        shell: bash
        run: |
          set -uo pipefail
          # :android:app:testProdDebugUnitTest -> android/app/build/test-results/testProdDebugUnitTest
          project_path="${SOAK_TASK%:*}"
          task_name="${SOAK_TASK##*:}"
          project_dir="${project_path#:}"
          project_dir="${project_dir//://}"
          results_dir="$project_dir/build/test-results/$task_name"
          failures_dir="$RUNNER_TEMP/android-test-soak-failures"
          mkdir -p "$failures_dir"
          command=(./gradlew --max-workers=2 --no-build-cache)
          test_args=()
          IFS=',' read -ra filters <<< "$SOAK_TESTS"
          for filter in "${filters[@]}"; do
            # Trim surrounding whitespace while preserving Gradle's wildcard syntax.
            filter="${filter#"${filter%%[![:space:]]*}"}"
            filter="${filter%"${filter##*[![:space:]]}"}"
            if [[ -z "$filter" ]]; then
              echo "SOAK ERROR each tests filter must be nonempty"
              exit 2
            fi
            test_args+=(--tests "$filter")
          done
          if [[ -n "${SOAK_CONFORMANCE_ROOT:-}" ]]; then
            command=(tools/conformance-env/linux-local --root "$SOAK_CONFORMANCE_ROOT" run -- "${command[@]}" -Pdulcet.productionSearchConformance)
          fi

          if [[ "${{ inputs.discover_fixture }}" == true ]]; then
            command=(tools/ci/with-discover-wishlist-fixture -- "${command[@]}" -Pdulcet.discoverWishlistConformance)
          fi
          passed=0
          failed=0
          started=$SECONDS
          for ((iteration = 1; iteration <= SOAK_REPEAT; iteration++)); do
            if (( SECONDS - started > SOAK_BUDGET_SECONDS )); then
              echo "SOAK BUDGET EXHAUSTED after $((iteration - 1)) of $SOAK_REPEAT repetitions"
              break
            fi
            label="$(printf '%03d' "$iteration")"
            # Deleting the results first is what makes every count below this repetition's own:
            # any XML present afterwards was written by this execution. --rerun forces the task to
            # execute, and --no-build-cache stops its outputs being restored from an earlier one.
            rm -rf "$results_dir"
            # The runner starts bash with -e: a failing Gradle run must be recorded, not end the soak.
            gradle_exit=0
            "${command[@]}" "$SOAK_TASK" "${test_args[@]}" --rerun \
              > "$RUNNER_TEMP/soak-$label.log" 2>&1 || gradle_exit=$?
            mkdir -p "$RUNNER_TEMP/android-test-soak-results/repetition-$label"
            cp "$results_dir"/TEST-*.xml "$RUNNER_TEMP/android-test-soak-results/repetition-$label/" 2>/dev/null || true
            counts="$(python3 - "$results_dir" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(sys.argv[1])
          tests = failures = skipped = 0
          names = []
          for report in sorted(root.glob("TEST-*.xml")) if root.is_dir() else []:
              suite = ET.parse(report).getroot()
              for case in suite.iter("testcase"):
                  tests += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failures += 1
                      names.append(f"{case.get('classname')}.{case.get('name')}")
                  elif case.find("skipped") is not None:
                      skipped += 1
          print(tests, failures, skipped, ",".join(names) or "-")
          PY
            )" || counts="0 0 0 -"
            read -r tests failures skipped names <<< "$counts"
            executed=$((tests - skipped))
            echo "SOAK ITERATION $label gradle_exit=$gradle_exit tests=$tests failed=$failures skipped=$skipped failing=$names"
            if (( executed == 0 )); then
              # A filter matching nothing, or a build that never reached the tests, is not a pass.
              tail -n 60 "$RUNNER_TEMP/soak-$label.log"
              echo "SOAK ERROR repetition $label executed zero tests; the filter matched nothing or the build failed first"
              echo "SOAK RESULT passed=$passed failed=$failed"
              exit 2
            fi
            if (( failures > 0 )); then
              failed=$((failed + 1))
              mkdir -p "$failures_dir/repetition-$label"
              cp "$results_dir"/TEST-*.xml "$failures_dir/repetition-$label/"
              cp "$RUNNER_TEMP/soak-$label.log" "$failures_dir/repetition-$label/gradle.log"
            elif (( gradle_exit != 0 )); then
              # Every test passed and Gradle still failed: the instrument broke, not a test.
              tail -n 60 "$RUNNER_TEMP/soak-$label.log"
              echo "SOAK ERROR repetition $label: Gradle exited $gradle_exit with no failing testcase"
              echo "SOAK RESULT passed=$passed failed=$failed"
              exit 2
            else
              passed=$((passed + 1))
            fi
          done

          echo "SOAK RESULT passed=$passed failed=$failed"
          {
            echo "### Android host-test soak"
            echo "\`$SOAK_TASK --tests $SOAK_TESTS\`: passed=$passed failed=$failed of $SOAK_REPEAT requested"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( failed > 0 )); then
            exit 1
          fi
          if (( passed < SOAK_REPEAT )); then
            echo "SOAK ERROR only $passed of $SOAK_REPEAT repetitions ran inside the budget"
            exit 1
          fi
      - name: Stop disposable conformance environment
        if: ${{ always() && inputs.disposable_conformance }}
        run: |
          if [[ -n "${SOAK_CONFORMANCE_ROOT:-}" ]]; then
            tools/conformance-env/linux-local --root "$SOAK_CONFORMANCE_ROOT" down
          fi
      - name: Upload every repetition's XML
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-soak-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-test-soak-results
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failing repetitions
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-soak-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-test-soak-failures
          if-no-files-found: ignore
          retention-days: 14

  android-review-check:
    name: android-review-check
    # This workflow is dispatch-only. Keep the regression blocking on every manual run;
    # PR/push workflows and the existing host-test soak job are unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned review image dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==12.2.0
      - name: Prove paused transport preserves explicit review metadata states
        run: python3 tools/test-android-restyle-review

  android-design-tour:
    name: android-design-tour (${{ matrix.surface }})
    if: ${{ inputs.design_tour != 'off' && inputs.design_tour != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        surface: ${{ fromJSON(inputs.design_tour == 'phone' && '["phone-light","phone-dark","phone-font2"]' || inputs.design_tour == 'all' && '["phone-light","phone-dark","phone-font2","tv"]' || format('["{0}"]', inputs.design_tour)) }}
    env:
      TZ: UTC
      EMULATOR_API_LEVEL: '34'
      EMULATOR_TARGET: ${{ matrix.surface == 'tv' && 'android-tv' || 'google_apis' }}
      EMULATOR_ARCH: ${{ matrix.surface == 'tv' && 'x86' || 'x86_64' }}
      # Keep aligned with sdk-installer.ts in the pinned emulator-runner action below.
      EMULATOR_BUILD_TOOLS: '37.0.0'
      # AGP 9.1's default build tools, used by Gradle before emulator-runner starts.
      EMULATOR_GRADLE_BUILD_TOOLS: '36.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      # ubuntu-latest includes sdkmanager. Bootstrap with it, so setup-android does not download
      # SDK dependencies outside the retry/classification path. emulator-runner also sees this
      # existing cmdline-tools directory and skips its own command-line-tools archive download.
      - name: Use hosted SDK command-line tools
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      # Download failures are infrastructure, before any emulator or disposable server starts.
      # Retry all action and build SDK dependencies, without a multi-GB repository image cache.
      - name: Install Android emulator SDK packages (infrastructure, bounded retry)
        shell: bash
        env:
          COMPILE_SDK: ${{ steps.pins.outputs.compile_sdk }}
        run: |
          set -euo pipefail
          python3 tools/ci/android-system-image install --api-level "$EMULATOR_API_LEVEL" --target "$EMULATOR_TARGET" --arch "$EMULATOR_ARCH" --sdk-package "build-tools;$EMULATOR_BUILD_TOOLS" --sdk-package "build-tools;$EMULATOR_GRADLE_BUILD_TOOLS" --sdk-package platform-tools --sdk-package "platforms;android-$EMULATOR_API_LEVEL" --sdk-package "platforms;android-$COMPILE_SDK" --sdk-package emulator --action-log "$RUNNER_TEMP/android-sdk-action-install.log" 2>&1 | tee "$RUNNER_TEMP/android-system-image-install.log"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # Standard Linux runners expose /dev/kvm to root only; the emulator needs it as the runner user.
      # `udevadm trigger` returns before the rule is applied: MEASURED, one leg of the first run
      # found /dev/kvm still unwritable. `settle` waits for the event queue to drain.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -w /dev/kvm
      - name: Prepare the finite design fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg lsof
          python3 tools/ci/prepare-discover-fixture
      - name: Build the app, tours and disposable server
        run: ./gradlew --no-daemon --max-workers=2 ${{ matrix.surface == 'tv' && ':android:tv:assembleDebug :android:tv:assembleDebugAndroidTest' || ':android:app:assembleDevDebug :android:app:assembleDevDebugAndroidTest' }} :server:installDist
      - name: Capture design matrix on the hosted emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          emulator-build: ${{ steps.pins.outputs.android_emulator_build }}
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ matrix.surface == 'tv' && 'tv_1080p' || 'pixel_6' }}
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: |
            python3 tools/ci/android-system-image verify-booted --api-level "$EMULATOR_API_LEVEL" --target "$EMULATOR_TARGET" --arch "$EMULATOR_ARCH"
            tools/ci/run-android-design-tour '${{ matrix.surface }}' "$RUNNER_TEMP/android-design-tour" --section '${{ inputs.design_section || 'all' }}'
      - name: Upload design captures and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-design-tour-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-design-tour/main
            ${{ runner.temp }}/android-design-tour/empty
            ${{ runner.temp }}/android-design-tour/empty-detail
            ${{ runner.temp }}/android-design-tour/connection
            ${{ runner.temp }}/android-design-tour/supplement
            ${{ runner.temp }}/android-design-tour/details
            ${{ runner.temp }}/android-design-tour/dialogs
            ${{ runner.temp }}/android-design-tour/dulcet
            ${{ runner.temp }}/android-design-tour/system
            ${{ runner.temp }}/android-design-tour/states-*
            ${{ runner.temp }}/android-design-tour/*.log
            ${{ runner.temp }}/android-design-tour/results.json
            ${{ runner.temp }}/android-design-tour/runtime/logs
            ${{ runner.temp }}/android-design-tour/runtime/server/navidrome.log
            ${{ runner.temp }}/android-system-image-install.log
          if-no-files-found: error
          retention-days: 14
