name: resource-loader-spike

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-loader-spike:
    name: resource-loader-spike
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select compatible Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
      - name: Install pinned fixture encoder
        run: |
          brew install lame
          test "$(brew info --json=v2 lame | jq -r '.formulae[0].installed[0].version')" = 4.0
      - name: Measure AVAsset resource loading
        run: >-
          swift run
          --package-path tools/resource-loader-spike
          resource-loader-spike
          --expect-hls-segments routed
