            --binary "$PWD/core-conformance/build/bin/iosSimulatorArm64/debugTest/test.kexe" \
            --output "$RUNNER_TEMP" -- \
            ./gradlew --no-daemon :core-conformance:iosSimulatorArm64Test \
            -Pdulcet.iosSimulatorUdid="$conformance_sim"
          xcrun simctl shutdown "$conformance_sim" || true
          xcrun simctl delete "$conformance_sim" || true
          # Same shared conformance suite again, this time compiled and executed
          # as a tvOS test binary. Keep its simulator identity and result directory
          # separate so tvOS evidence cannot be substituted by an iOS run.
          tvos_conformance_sim="$(xcrun simctl create \
            dulcet-tvos-conformance \
            com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-1080p)"
          python3 tools/ci/isolate-simulator --phase conformance-tvos --keep "$tvos_conformance_sim"
          ./gradlew --no-daemon :core-conformance:linkDebugTestTvosSimulatorArm64
          # UNCHANGED ARM -- the in-run control. Still after its simulator create+boot, but that boot
          # is now waited on (`bootstatus -b`) and linked past before this restart runs, so this is
          # no longer the arrangement the pre-registered criteria were read against.
          restart_navidrome_cold tvos unchanged true
          SIMCTL_CHILD_DULCET_CONFORMANCE_BASE_URL=http://127.0.0.1:4533 \
            SIMCTL_CHILD_DULCET_CONFORMANCE_DISPOSABLE=true \
            SIMCTL_CHILD_DULCET_REDIRECT_CONFORMANCE_ROOT=http://127.0.0.1:4540 \
            SIMCTL_CHILD_DULCET_UNTRUSTED_TLS_URL=https://127.0.0.1:4542 \
            SIMCTL_CHILD_DULCET_CONFORMANCE_DISPOSABLE=true \
            DULCET_CONFORMANCE_BASE_URL=http://127.0.0.1:4533 \
            DULCET_CONFORMANCE_DISPOSABLE=true \
            DULCET_REDIRECT_CONFORMANCE_ROOT=http://127.0.0.1:4540 \
            DULCET_UNTRUSTED_TLS_URL=https://127.0.0.1:4542 \
            DULCET_CONFORMANCE_DISPOSABLE=true \
            ./gradlew --no-daemon :core-conformance:tvosSimulatorArm64Test \
            -Pdulcet.tvosSimulatorUdid="$tvos_conformance_sim"
          xcrun simctl shutdown "$tvos_conformance_sim" || true
          xcrun simctl delete "$tvos_conformance_sim" || true
          # ---- iPadOS playback + scrobble evidence -------------------------------------------
          # INSIDE this step because Navidrome's lifetime IS this step's shell: `trap cleanup EXIT`
          # kills it, so a later step finds nothing on 127.0.0.1:4533.
          #
          # LAST, deliberately. The UI tests in this step are the job's only app-launching tests,
          # and this file records an unexplained, still-live launch flake (runs 33420584120,
          # 33457633113). Under `set -e` an upstream position would mean one flaked launch destroys
          # every conformance suite's evidence too. The canary's count survives
          # `restart_navidrome_cold` (it is in the DB), and CONF-22/23 target the 29s and 31s
          # tracks, never this one, so running last costs the assertion nothing.
          #
          # The XCUITest deliberately never reads a play count -- a test that could call
          # /rest/scrobble itself cannot evidence that the APP scrobbled. The server-side half is
          # asserted here, either side of the run. BOTH are required: progressing media time alone
          # does not show a scrobble was delivered, and a count change alone does not show our app
          # caused it.
          #
          # The XCUITest returns only after the app's DEBUG delivery marker reports the server
          # acknowledged `scrobble submission=true` (delivered=1), never on the threshold alone.
          # Twice (6f20917 on 2026-09-06, run 34626315446 on 2026-09-11) it returned on the
          # displayed threshold while the app's accumulator, counted from its first sampled
          # position, had not crossed; XCUITest's teardown then killed the app before its next
          # sample, nothing was persisted, and this AFTER read found 0 with the test green.
          #
          # `--await-seconds` on the AFTER read is therefore only the gap between the app seeing
          # its `ok` envelope and the count being readable through the API, plus a loaded host;
          # it is no longer the race window. The repo's own conformance client polls for the same
          # reason (`awaitPlayCount`, 20 x 50ms). The BEFORE read has no wait -- a baseline must
          # hold immediately, and waiting for it would mask a canary another actor had already moved.
          #
          # TEST_RUNNER_-prefixed variables must be in XCODEBUILD's OWN environment; the prefix is
          # stripped on the way into the runner. A trailing `KEY=value` on the xcodebuild line is
          # parsed as a BUILD SETTING and never arrives, which presents as a ~2s failure with three
          # "Missing ..." assertions and reads like a product defect rather than a config one.
          python3 tools/read-play-count \
            --base-url http://127.0.0.1:4533 \
            --title "UI Playback Canary" \
            --expect 0
          IPAD_PLAYBACK_DESTINATION="$(python3 tools/resolve-ipad-destination)"
          echo "iPadOS playback destination: $IPAD_PLAYBACK_DESTINATION"
          python3 tools/ci/isolate-simulator --phase playback-ipad --keep "${IPAD_PLAYBACK_DESTINATION##*id=}"
          # test-without-building: `Build the iOS shell for the iPadOS conformance legs` already
          # built this scheme into this same derived-data tree. Rebuilding re-enters the Gradle
          # run-script phase while Navidrome and three python servers are live, consuming the
          # conformance step budget.
          TEST_RUNNER_DULCET_UI_TEST_SERVER_URL=http://127.0.0.1:4533 \
            TEST_RUNNER_DULCET_UI_TEST_USERNAME=dulcet-admin \
            TEST_RUNNER_DULCET_UI_TEST_PASSWORD=dulcet-ci-canary-password \
            xcodebuild test-without-building \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetiOS \
              -configuration Debug \
              -destination "$IPAD_PLAYBACK_DESTINATION" \
              -derivedDataPath "$RUNNER_TEMP/DulcetiPadOSDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-ipados-playback.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:DulcetiOSUITests/DulcetiOSUITests/testSimulatorPlaybackAdvancesPastScrobbleThreshold 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-ipados-playback.log"
          # The evidence assertion comes BEFORE junit generation: under `set -e` a junit failure
          # would otherwise abort with the evidence question unanswered.
          python3 tools/read-play-count \
            --base-url http://127.0.0.1:4533 \
            --title "UI Playback Canary" \
            --expect 1 \
            --await-seconds 15
          # Named-test execution guard, as the three macOS invocations above use. `swift-testing-junit`
          # cannot substitute: it writes a well-formed `tests="0"` JUnit for an empty bundle, so a
          # renamed test or a silently-matching-nothing `-only-testing` would ship green.
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ipados-playback.xcresult" \
            DulcetiOSUITests.DulcetiOSUITests \
            testSimulatorPlaybackAdvancesPastScrobbleThreshold
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ipados-playback.xcresult" \
            "$RUNNER_TEMP/dulcet-ipados-playback-junit/TEST-DulcetiOSUITests.xml" \
            DulcetiOSUITests
          # ---- iOS + iPadOS search-activation evidence --------------------------------------
          # Same shape as the playback proof above and inside this step for the same reason:
          # Navidrome's lifetime is this step's shell. The typed query, the ranked render and
          # the activation-to-Now-Playing assertions all live in the UI test; this file supplies
          # only the disposable fixture coordinates. The iPhone run evidences the ios cell, the
          # iPad run the ipados cell -- the test itself fails on the wrong window class, so one
          # destination's evidence cannot be mistaken for the other's.
          # iPad first: the iPad playback proof above already has it booted, so this order costs one
          # simulator boot fewer than iPhone-then-iPad.
          python3 tools/ci/isolate-simulator --phase search-ipad --keep "${IPAD_PLAYBACK_DESTINATION##*id=}"
          TEST_RUNNER_DULCET_UI_TEST_SERVER_URL=http://127.0.0.1:4533 \
            TEST_RUNNER_DULCET_UI_TEST_USERNAME=dulcet-admin \
            TEST_RUNNER_DULCET_UI_TEST_PASSWORD=dulcet-ci-canary-password \
            xcodebuild test-without-building \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetiOS \
              -configuration Debug \
              -destination "$IPAD_PLAYBACK_DESTINATION" \
              -derivedDataPath "$RUNNER_TEMP/DulcetiPadOSDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-ipados-search.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:DulcetiOSUITests/DulcetiOSUITests/testSimulatorSearchQueryRanksAndActivatesTrackOnIPadOS 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-ipados-search.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ipados-search.xcresult" \
            DulcetiOSUITests.DulcetiOSUITests \
            testSimulatorSearchQueryRanksAndActivatesTrackOnIPadOS
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ipados-search.xcresult" \
            "$RUNNER_TEMP/dulcet-ipados-search-junit/TEST-DulcetiOSUITests.xml" \
            DulcetiOSUITests
          python3 tools/ci/isolate-simulator --phase search-iphone --keep-name "iPhone 17 Pro"
          TEST_RUNNER_DULCET_UI_TEST_SERVER_URL=http://127.0.0.1:4533 \
            TEST_RUNNER_DULCET_UI_TEST_USERNAME=dulcet-admin \
            TEST_RUNNER_DULCET_UI_TEST_PASSWORD=dulcet-ci-canary-password \
            xcodebuild test-without-building \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetiOS \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
              -derivedDataPath "$RUNNER_TEMP/DulcetiOSDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-ios-search.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:DulcetiOSUITests/DulcetiOSUITests/testSimulatorSearchQueryRanksAndActivatesTrackOnIPhone 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-ios-search.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ios-search.xcresult" \
            DulcetiOSUITests.DulcetiOSUITests \
            testSimulatorSearchQueryRanksAndActivatesTrackOnIPhone
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ios-search.xcresult" \
            "$RUNNER_TEMP/dulcet-ios-search-junit/TEST-DulcetiOSUITests.xml" \
            DulcetiOSUITests
          # tvOS setup supplies an account and nothing else. The control reaches Search through
          # the section bar by remote, types into the real field, activates the focused result,
          # and returns to Library the same way, so it evidences reachability and not only that
          # the surface works once something else reaches it. Keep this inside the disposable
          # fixture lifetime and retain simulator signing: the account hook uses the production
          # Keychain store.
          python3 tools/ci/isolate-simulator --phase search-tvos --keep-name "Apple TV 4K (3rd generation)"
          TEST_RUNNER_DULCET_UI_TEST_SERVER_URL=http://127.0.0.1:4533 \
            TEST_RUNNER_DULCET_UI_TEST_USERNAME=dulcet-admin \
            TEST_RUNNER_DULCET_UI_TEST_PASSWORD=dulcet-ci-canary-password \
            xcodebuild test \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetTV \
              -configuration Debug \
              -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest' \
              -derivedDataPath "$RUNNER_TEMP/DulcetTVDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-tvos-search.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:DulcetTVUITests/DulcetTVUITests/testSimulatorSearchQueryRanksAndActivatesTrack 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-tvos-search.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-tvos-search.xcresult" \
            DulcetTVUITests.DulcetTVUITests \
            testSimulatorSearchQueryRanksAndActivatesTrack
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-tvos-search.xcresult" \
            "$RUNNER_TEMP/dulcet-tvos-search-junit/TEST-DulcetTVUITests.xml" \
            DulcetTVUITests
      # The required `apple-ci` job resolves FEATURES.yml evidence from these directories on another
      # machine, so every JUnit directory this job wrote travels as one artifact named per job and
      # attempt. Only a successful job uploads it: `apple-ci` fails before reading evidence from a
      # leg that did not succeed, and the failure diagnostics below carry the same directories.
      - name: Upload Apple parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-apple-parity-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dulcet-*-junit
          if-no-files-found: error
          retention-days: 14
      # Per-phase memory and CPU pressure for THIS run, green or red. A stall that is paging shows
      # pageouts/swapouts in the phase it hit; a green run supplies the same numbers as its control.
      - name: Summarise host pressure by phase
        if: ${{ always() }}
        run: >-
          python3 tools/ci/host-pressure summarize "$DULCET_HOST_PRESSURE_LOG"
          || echo "host-pressure record unavailable; see the summary line above"
      # Every Apple test step here writes an .xcresult and discards it with the runner -- including
      # the platform download and Keychain runs -- along with the JUnit directories
      # `verify-parity-evidence` consumes
      # and the reference server's own log. Runs 33420584120 and 33457633113 (the latter on main)
      # failed with "Timed out while launching application via Xcode" and left ~58 seconds of silence
      # between `t = 1.05s Launch` and the failure; the evidence that would explain it was deleted.
      # This does not attempt to fix that flake -- two proposed causes have already been refuted.
      #
      # `!success()` covers BOTH failure and cancellation. A `timeout-minutes` expiry cancels the job
      # rather than failing it (observed in the 2026-08-30 sample of 12 runs).
      # A `failure()`-only condition would therefore miss the long-hang case, which is the one
      # worth the most here. `concurrency.cancel-in-progress` supersessions also land in this branch,
      # but they are killed early and so have little on disk for the globs to match.
      #
      # NOTE these globs are duplicated in the inventory step below. Keep the two lists in step.
      - name: Inventory the Apple failure diagnostics
        if: ${{ !success() }}
        shell: bash
        run: |
          set -o pipefail
          # Sizes, not just names: a killed `tee` leaves a partial .log and a killed xcodebuild an
          # unfinalized .xcresult, and a name-only listing renders both exactly like healthy ones.
          # Globs are collected into one array rather than passed to a single `ls`: `ls a/*.x b/*.y`
          # exits non-zero when EITHER pattern fails to expand, which printed the files it found and
          # then reported "NONE" underneath them.
          shopt -s nullglob
          found=("$RUNNER_TEMP"/*.xcresult "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/dulcet-*-junit "$RUNNER_TEMP"/*/logs/*.log)
          echo "APPLE FAILURE DIAGNOSTICS count=${#found[@]}"
          if [ "${#found[@]}" -eq 0 ]; then
            echo "  NONE - nothing was written before the job stopped"
          else
            du -sk "${found[@]}" | sed 's/^/  /'
          fi
      - name: Upload Apple failure diagnostics
        if: ${{ !success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-apple-failure-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/dulcet-*-junit
            ${{ runner.temp }}/*/logs/*.log
          if-no-files-found: warn
          # .xcresult payload is already-compressed media; the three sibling binary uploads in this
          # file set this for the same reason. Deflate would burn a capped macOS slot for ratio ~1.
          compression-level: 0
          retention-days: 14
      - name: Upload macosArm64 core-conformance JUnit results
        if: ${{ always() && steps.darwin_conformance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-core-conformance-macosArm64-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: core-conformance/build/test-results/macosArm64Test
          if-no-files-found: error
          retention-days: 14
      - name: Upload iosSimulatorArm64 core-conformance JUnit results
        if: ${{ always() && steps.darwin_conformance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-core-conformance-iosSimulatorArm64-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: core-conformance/build/test-results/iosSimulatorArm64Test
          if-no-files-found: error
          retention-days: 14
      - name: Upload tvosSimulatorArm64 core-conformance JUnit results
        if: ${{ always() && steps.darwin_conformance.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-core-conformance-tvosSimulatorArm64-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: core-conformance/build/test-results/tvosSimulatorArm64Test
          if-no-files-found: error
          retention-days: 14

  # The required status check. Branch protection matches it by NAME and FEATURES.yml cites it by job
  # id, so both are `apple-ci`. It needs every leg and runs `if: always()`: without that, a failed
  # leg SKIPS this job, and a skipped required check does not block a merge. Any leg result other
  # than `success` -- `failure`, `cancelled` (a timeout reports as cancelled) or `skipped` -- fails
  # it. It then resolves every apple-ci evidence row against the JUnit the legs uploaded, as
  # `core-ci` does for Android. It runs no Apple tooling, so it takes no macOS runner.
  apple-ci:
    name: apple-ci
    if: ${{ always() }}
    needs: [apple-platform, apple-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPLE_PLATFORM_RESULT: ${{ needs.apple-platform.result }}
      APPLE_CONFORMANCE_RESULT: ${{ needs.apple-conformance.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every Apple leg
        run: |
          echo "apple-platform=$APPLE_PLATFORM_RESULT"
          echo "apple-conformance=$APPLE_CONFORMANCE_RESULT"
          test "$APPLE_PLATFORM_RESULT" = success
          test "$APPLE_CONFORMANCE_RESULT" = success
          echo "APPLE CI LEGS PASS apple-platform=$APPLE_PLATFORM_RESULT apple-conformance=$APPLE_CONFORMANCE_RESULT"
      # Each download names the attempt that PRODUCED the artifact, read from that leg's `attempt`
      # output -- never this job's own `github.run_attempt`. Re-running failed jobs re-runs the
      # failed leg and this job; the leg that passed is not re-run and keeps its earlier artifact
      # and output, so an artifact named after this job's attempt would never have been written.
      # The JUnit directories land in RUNNER_TEMP and the conformance results in the workspace,
      # exactly where the evidence check below read them when this was one job.
      - name: Download platform parity evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-apple-parity-evidence-apple-platform-${{ github.run_id }}-${{ needs.apple-platform.outputs.attempt }}
          path: ${{ runner.temp }}
      - name: Download conformance parity evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-apple-parity-evidence-apple-conformance-${{ github.run_id }}-${{ needs.apple-conformance.outputs.attempt }}
          path: ${{ runner.temp }}
      - name: Download macosArm64 core-conformance JUnit results
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-core-conformance-macosArm64-junit-${{ github.run_id }}-${{ needs.apple-conformance.outputs.attempt }}
          path: core-conformance/build/test-results/macosArm64Test
      - name: Download iosSimulatorArm64 core-conformance JUnit results
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-core-conformance-iosSimulatorArm64-junit-${{ github.run_id }}-${{ needs.apple-conformance.outputs.attempt }}
          path: core-conformance/build/test-results/iosSimulatorArm64Test
      - name: Download tvosSimulatorArm64 core-conformance JUnit results
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-core-conformance-tvosSimulatorArm64-junit-${{ github.run_id }}-${{ needs.apple-conformance.outputs.attempt }}
          path: core-conformance/build/test-results/tvosSimulatorArm64Test
      - name: Verify Apple parity evidence executed and passed
        run: |
          python3 tools/verify-parity-evidence \
            core-conformance/build/test-results/macosArm64Test \
            core-conformance/build/test-results/iosSimulatorArm64Test \
            core-conformance/build/test-results/tvosSimulatorArm64Test \
            "$RUNNER_TEMP/dulcet-swift-testing-junit" \
            "$RUNNER_TEMP/dulcet-ios-swift-testing-junit" \
            "$RUNNER_TEMP/dulcet-ios-keychain-attributes-junit" \
            "$RUNNER_TEMP/dulcet-ipados-swift-testing-junit" \
            "$RUNNER_TEMP/dulcet-ipados-ui-testing-junit" \
            "$RUNNER_TEMP/dulcet-ipados-keychain-attributes-junit" \
            "$RUNNER_TEMP/dulcet-ipados-playback-junit" \
            "$RUNNER_TEMP/dulcet-ios-search-junit" \
            "$RUNNER_TEMP/dulcet-ipados-search-junit" \
            "$RUNNER_TEMP/dulcet-tvos-search-junit" \
            "$RUNNER_TEMP/dulcet-tvos-swift-testing-junit" \
            "$RUNNER_TEMP/dulcet-tvos-keychain-attributes-junit" \
            "$RUNNER_TEMP/dulcet-mac-app-test-junit" \
            "$RUNNER_TEMP/dulcet-mac-search-ui-test-junit" \
            "$RUNNER_TEMP/dulcet-mac-library-sync-test-junit" \
            "$RUNNER_TEMP/dulcet-tvos-library-sync-junit" \
            "$RUNNER_TEMP/dulcet-ipados-library-sync-junit" \
            "$RUNNER_TEMP/dulcet-ios-library-sync-junit" \
            "$RUNNER_TEMP/dulcet-mac-download-junit" \
            "$RUNNER_TEMP/dulcet-ios-download-junit" \
            "$RUNNER_TEMP/dulcet-ipados-download-junit"
