            -string "$DULCET_CONFORMANCE_BASE_URL" "$download_xctestrun"
          /usr/bin/plutil -insert \
            'DulcetPlaybackIntegrationTests.EnvironmentVariables.DULCET_CONFORMANCE_DISPOSABLE' \
            -string "$DULCET_CONFORMANCE_DISPOSABLE" "$download_xctestrun"
          xcodebuild test-without-building \
              -xctestrun "$download_xctestrun" \
