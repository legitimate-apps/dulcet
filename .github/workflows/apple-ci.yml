              -derivedDataPath "$RUNNER_TEMP/DulcetMacAppTestDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-mac-search-ui-test.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:DulcetMacTests/DulcetMacAccountConnectAppTest/searchQueryRanksAndActivatesTrackThroughHostedAppUI \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGN_ENTITLEMENTS= \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= \
              DULCET_TEST_CONFORMANCE_BASE_URL=http://127.0.0.1:4533 \
              DULCET_TEST_CONFORMANCE_DISPOSABLE=true 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-mac-search-ui-test.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-mac-search-ui-test.xcresult" \
            DulcetMacTests.DulcetMacAccountConnectAppTest \
            searchQueryRanksAndActivatesTrackThroughHostedAppUI
          defaults write NSGlobalDomain AppleKeyboardUIMode -int 3
          xcodebuild test-without-building \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetMac \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DulcetMacAppTestDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-mac-keyboard-test.xcresult" \
              -only-testing:DulcetMacTests/DulcetMacAccountConnectAppTest/accountConnectKeyboardTraversalFocusRestorationAndPrimaryAction \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGN_ENTITLEMENTS= \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-mac-keyboard-test.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-mac-keyboard-test.xcresult" \
            DulcetMacTests.DulcetMacAccountConnectAppTest \
            accountConnectKeyboardTraversalFocusRestorationAndPrimaryAction
          xcodebuild test-without-building \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetMac \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DulcetMacAppTestDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-mac-double-return-test.xcresult" \
              -only-testing:DulcetMacTests/DulcetMacAccountConnectAppTest/accountConnectDoubleReturnKeepsSingleConnectionActive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGN_ENTITLEMENTS= \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-mac-double-return-test.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-mac-double-return-test.xcresult" \
            DulcetMacTests.DulcetMacAccountConnectAppTest \
            accountConnectDoubleReturnKeepsSingleConnectionActive
          # A macOS host test does not inherit xcodebuild's shell environment. Build its launch
          # manifest, inject only the disposable loopback contract, then execute that manifest.
          xcodebuild build-for-testing \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetPlaybackIntegration \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DulcetDownloadIntegrationDerivedData" \
              -parallel-testing-enabled NO \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGN_ENTITLEMENTS= \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-mac-download-build.log"
          download_xctestrun="$(find \
            "$RUNNER_TEMP/DulcetDownloadIntegrationDerivedData/Build/Products" \
            -name 'DulcetPlaybackIntegration_*.xctestrun' -print -quit)"
          test -n "$download_xctestrun"
          /usr/bin/plutil -remove \
            'DulcetPlaybackIntegrationTests.EnvironmentVariables.DULCET_CONFORMANCE_BASE_URL' \
            "$download_xctestrun" 2>/dev/null || true
          /usr/bin/plutil -remove \
            'DulcetPlaybackIntegrationTests.EnvironmentVariables.DULCET_CONFORMANCE_DISPOSABLE' \
            "$download_xctestrun" 2>/dev/null || true
          /usr/bin/plutil -insert \
