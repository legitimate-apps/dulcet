              -only-testing:DulcetPlaybackIntegrationTests/DulcetAppleDownloadIntegrationTest/downloadTriggerPromotesValidatedResponseAtomically 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-mac-download-conf51.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-mac-download-conf51.xcresult" \
            DulcetPlaybackIntegrationTests.DulcetAppleDownloadIntegrationTest \
            downloadTriggerPromotesValidatedResponseAtomically
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-mac-download-conf51.xcresult" \
            "$RUNNER_TEMP/dulcet-mac-download-junit/TEST-CONF-51.xml" \
            DulcetAppleDownloadIntegrationTest
          xcodebuild test-without-building \
              -xctestrun "$download_xctestrun" \
              -destination 'platform=macOS' \
              -resultBundlePath "$RUNNER_TEMP/dulcet-mac-download-conf52.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:DulcetPlaybackIntegrationTests/DulcetAppleDownloadIntegrationTest/offlinePlaybackLoadsIdenticalBytesAfterNetworkClientsClose 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-mac-download-conf52.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-mac-download-conf52.xcresult" \
            DulcetPlaybackIntegrationTests.DulcetAppleDownloadIntegrationTest \
            offlinePlaybackLoadsIdenticalBytesAfterNetworkClientsClose
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-mac-download-conf52.xcresult" \
            "$RUNNER_TEMP/dulcet-mac-download-junit/TEST-CONF-52.xml" \
            DulcetAppleDownloadIntegrationTest
          # The iOS test runner does not inherit the host shell's environment. TEST_RUNNER_
          # variables are stripped into the runner process, where the test independently rejects
          # anything except the disposable loopback Navidrome. Each named test gets its own
          # xcresult because the execution guard requires exactly one individual result.
          TEST_RUNNER_DULCET_CONFORMANCE_BASE_URL=http://127.0.0.1:4533 \
            TEST_RUNNER_DULCET_CONFORMANCE_DISPOSABLE=true \
            xcodebuild test \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetiOSDownloadIntegration \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
              -derivedDataPath "$RUNNER_TEMP/DulcetiOSDownloadIntegrationDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-ios-download-conf51.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:DulcetiOSDownloadIntegrationTests/DulcetAppleDownloadIntegrationTest/downloadTriggerPromotesValidatedResponseAtomicallyOnIOS 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-ios-download-conf51.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ios-download-conf51.xcresult" \
            DulcetiOSDownloadIntegrationTests.DulcetAppleDownloadIntegrationTest \
            downloadTriggerPromotesValidatedResponseAtomicallyOnIOS
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ios-download-conf51.xcresult" \
            "$RUNNER_TEMP/dulcet-ios-download-junit/TEST-CONF-51.xml" \
            DulcetAppleDownloadIntegrationTest
          TEST_RUNNER_DULCET_CONFORMANCE_BASE_URL=http://127.0.0.1:4533 \
            TEST_RUNNER_DULCET_CONFORMANCE_DISPOSABLE=true \
            xcodebuild test-without-building \
              -project apple/Dulcet.xcodeproj \
              -scheme DulcetiOSDownloadIntegration \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
              -derivedDataPath "$RUNNER_TEMP/DulcetiOSDownloadIntegrationDerivedData" \
              -resultBundlePath "$RUNNER_TEMP/dulcet-ios-download-conf52.xcresult" \
              -parallel-testing-enabled NO \
              -only-testing:DulcetiOSDownloadIntegrationTests/DulcetAppleDownloadIntegrationTest/offlinePlaybackLoadsIdenticalBytesAfterNetworkClientsCloseOnIOS 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-ios-download-conf52.log"
          python3 tools/verify-xcode-test-execution \
