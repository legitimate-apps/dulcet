name: apple-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # spec §21.5: two parallel legs on the standard hosted image behind the required `apple-ci`
  # job below. This leg is the platform half -- the macOS presentation and captures, then the
  # iPhone, iPadOS and tvOS shells and the compact shell. It talks to no loopback fixture.
  #
  # Cap history of the single job this was split from: 30 -> 45 on 2026-08-27 after a legitimate
  # 30m36s run, then 75, then 120 once a healthy 77.9m run was killed (34040853135). A job timeout
  # implicates whichever step is active rather than a failed assertion, which is why the heavy
  # steps carry their own caps; those are unchanged by the split.
  #
  # 90 = ceil(1.5 x 60 / 5) x 5. 60 minutes is this leg's PROJECTED maximum, not a measurement: the
  # sum, per green single-job run since #136, of the steps now in this job and the job's own
  # overhead, plus a framework link costed at the whole `Build all Apple frameworks` step. The
  # largest is 58.7 (run 35955374570), plus 1.5 for the compact-shell isolation step that run
  # predates. Re-measure once the leg has history.
  apple-platform:
    name: apple-platform
    runs-on: macos-26
    timeout-minutes: 90
    # The required job downloads this leg's artifacts by the attempt that PRODUCED them. See there.
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      TZ: UTC
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require partial promotion conditions to resolve or declare a block
        run: python3 tools/verify_promotion_conditions.py
      - name: Prove account-removal recovery rejects stale cleanup
        run: python3 tools/test-account-removal-recovery
      - name: Prove nonexistent promotion targets are rejected
        run: python3 tools/test-promotion-condition-resolvability
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      # Samples vm_stat, swap and load every 5 s for the rest of the job. The file ends in .log so the
      # failure upload's `$RUNNER_TEMP/*.log` glob carries it; the summary step prints it per phase.
      - name: Start host-pressure sampling
        run: |
          echo "DULCET_HOST_PRESSURE_LOG=$RUNNER_TEMP/dulcet-host-pressure.log" >> "$GITHUB_ENV"
          nohup python3 tools/ci/host-pressure sample \
            --output "$RUNNER_TEMP/dulcet-host-pressure.log" --interval 5 >/dev/null 2>&1 &
          python3 tools/ci/host-pressure mark "$RUNNER_TEMP/dulcet-host-pressure.log" job-start
      - name: Prove app-hosted execution guard rejects a missing control
        run: python3 tools/test-xcode-test-execution-guard
      - name: Prove uncataloged SwiftUI copy fails the source policy
        run: python3 tools/test-string-catalog-policy-gate
      - name: Prove the iPad destination resolver rejects a non-iPad
        run: python3 tools/test-ipad-destination-resolver
      - name: Require SwiftUI user-facing literals to use the string catalog
        run: python3 tools/verify_string_catalog_policy.py
      - name: Prove the DulcetCore build-order guard accepts a valid project and rejects ten broken ones
        run: python3 tools/test-dulcet-core-build-order
      - name: Require every DulcetCore linker to reach an ordered framework producer
        run: python3 tools/verify_dulcet_core_build_order.py
      - name: Select compatible Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ steps.pins.outputs.xcode }}.app/Contents/Developer"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        timeout-minutes: 5
      # The frameworks this job reads: macOS for the restoration check and the captures, and the
      # macOS, iOS-simulator and tvOS-simulator ones for the OS-floor assertion. Jobs share no files,
      # so this job links its own. `Build all Apple frameworks` -- the two device links and
      # `:core:macosArm64Test` -- runs once, in apple-conformance. 10, the cap that step carries.
      - name: Build the Apple frameworks the platform legs read
        timeout-minutes: 10
        run: >-
          ./gradlew --no-daemon
          :core:linkDebugFrameworkMacosArm64
          :core:linkDebugFrameworkIosSimulatorArm64
          :core:linkDebugFrameworkTvosSimulatorArm64
      - name: Build macOS shell
        timeout-minutes: 6
        run: >-
          xcodebuild build
          -project apple/Dulcet.xcodeproj
          -scheme DulcetMac
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DulcetMacDerivedData"
          CODE_SIGNING_ALLOWED=NO
      - name: Prove direct uncataloged foreground modifiers fail the source policy
        run: python3 tools/test-contrast-foreground-policy-gate
      - name: Require direct custom foreground modifiers to use the contrast registry
        run: python3 tools/verify_contrast_foreground_policy.py
      - name: Test native macOS presentation and registered-pair contrast ratios
        timeout-minutes: 4
        run: |
          set -o pipefail
          cd apple/DulcetKit
          # -parallel-testing-enabled NO restores the serial execution `swift test` gave us before
          # the move to result bundles. xcodebuild parallelises by default, and these suites drive
          # real AVFoundation: under contention a readiness wait that normally settles in ~4s
          # exceeded its 20s timeout while unrelated instant tests took 6s. The iOS and tvOS
          # invocations below already pass this flag; the macOS package was the one that did not.
          xcodebuild test \
            -scheme DulcetKit-Package \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/DulcetKitDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-swift-testing.xcresult" 2>&1 | \
            tee "$RUNNER_TEMP/dulcet-swift-testing.log"
          cd "$GITHUB_WORKSPACE"
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-swift-testing.xcresult" \
            "$RUNNER_TEMP/dulcet-swift-testing-junit/TEST-DulcetKitTests.xml" \
            DulcetKitTests
      - name: Verify stale queue restoration through the production playback controller
        timeout-minutes: 4
        run: >-
          python3 tools/check-playback-restoration.py
          --framework-dir core/build/bin/macosArm64/debugFramework
      - name: Prove macOS capture rejects an inapplicable Dynamic Type label
        run: |
          swift build --package-path apple/DulcetKit --product DulcetCapture
          capture_binary="$(swift build --package-path apple/DulcetKit --show-bin-path)/DulcetCapture"
          test -x "$capture_binary"
          set +e
          capture_output="$("$capture_binary" \
            --output "$RUNNER_TEMP/rejected-dynamic-type" \
            --state empty-library-no-account --appearance light \
            --dynamic-type accessibility5 2>&1)"
          capture_exit_code=$?
          set -e
          printf '%s\n' "$capture_output"
          test "$capture_exit_code" -eq 1
          grep -Fxq 'DULCET CAPTURE ERROR macOS capture cannot claim Dynamic Type accessibility5: SwiftUI dynamicTypeSize does not affect text size on macOS' <<< "$capture_output"
          test ! -e "$RUNNER_TEMP/rejected-dynamic-type"
          echo "DYNAMIC TYPE NEGATIVE CONTROL PASS setup=binary-built exact-diagnostic=true label=accessibility5 rejected=true output-created=false"
      - name: Prove deterministic capture mismatch forensics measure a known delta
        run: python3 tools/test-design-capture-forensics
      - name: Prove the capture variant census distinguishes states from processes
        run: python3 tools/test-design-capture-variant-census
      - name: Prove macOS capture rejects a focused responder
        run: |
          capture_binary="$(swift build --package-path apple/DulcetKit --show-bin-path)/DulcetCapture"
          test -x "$capture_binary"
          set +e
          capture_output="$("$capture_binary" \
            --output "$RUNNER_TEMP/rejected-focused-responder" \
            --state empty-library-no-account --appearance light \
            --negative-control-focused-responder 2>&1)"
          capture_exit_code=$?
          set -e
          printf '%s\n' "$capture_output"
          test "$capture_exit_code" -eq 1
          grep -Fq \
            'DULCET CAPTURE ERROR capture focus state mismatch: stage=after-pinning expected=no-focused-control/window-first-responder observed=non-window-first-responder' \
            <<< "$capture_output"
          test ! -e "$RUNNER_TEMP/rejected-focused-responder/manifest.json"
          test -z "$(find "$RUNNER_TEMP/rejected-focused-responder" -name '*.jpg' -print -quit)"
          echo "FOCUS STATE NEGATIVE CONTROL PASS wrong-responder=created assertion=rejected-before-bitmap-write"
      - name: Capture deterministic macOS design evidence twice
        timeout-minutes: 9
        id: deterministic_design_capture
        env:
          CAPTURE_ROOT: ${{ runner.temp }}/dulcet-design-captures
        run: |
          swift run --package-path apple/DulcetKit DulcetCapture \
            --output "$CAPTURE_ROOT/run-a/standard" \
            --diagnostics-output "$CAPTURE_ROOT/diagnostics/run-a.json" \
            --state all --appearance all --include-control
          swift run --package-path apple/DulcetKit DulcetCapture \
            --output "$CAPTURE_ROOT/run-b/standard" \
            --diagnostics-output "$CAPTURE_ROOT/diagnostics/run-b.json" \
            --state all --appearance all --include-control
          set +e
          diff -qr "$CAPTURE_ROOT/run-a" "$CAPTURE_ROOT/run-b" \
            > "$CAPTURE_ROOT/recursive-byte-diff.txt" 2>&1
          diff_status=$?
          set -e
          if [[ "$diff_status" -ne 0 ]]; then
            cat "$CAPTURE_ROOT/recursive-byte-diff.txt"
            if [[ "$diff_status" -eq 1 ]]; then
              set +e
              python3 tools/design_capture_forensics.py \
                "$CAPTURE_ROOT/run-a" \
                "$CAPTURE_ROOT/run-b" \
                --run-a-diagnostics "$CAPTURE_ROOT/diagnostics/run-a.json" \
                --run-b-diagnostics "$CAPTURE_ROOT/diagnostics/run-b.json" \
                --output "$CAPTURE_ROOT/forensics"
              forensics_status=$?
              set -e
              if [[ -f "$CAPTURE_ROOT/forensics/report.json" ]]; then
                cp \
                  "$CAPTURE_ROOT/recursive-byte-diff.txt" \
                  "$CAPTURE_ROOT/forensics/recursive-byte-diff.txt"
                echo 'forensics_available=true' >> "$GITHUB_OUTPUT"
                {
                  echo '## Deterministic macOS capture mismatch'
                  echo
                  echo 'The exact byte gate failed. Both differing image versions and decoded-pixel measurements are retained in the failure artifact.'
                  echo
                  echo '```text'
                  cat "$CAPTURE_ROOT/forensics/summary.txt"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              if [[ "$forensics_status" -ne 1 ]]; then
                echo "DESIGN CAPTURE FORENSICS unexpected-exit=$forensics_status"
              fi
            else
              echo "DESIGN CAPTURE DIFF ERROR exit=$diff_status"
            fi
            exit 1
          fi
          for appearance in light dark; do
            control="macos-CONTROL-DELIBERATELY-BAD-library-browse-${appearance}.jpg"
            cmp \
              "apple/DulcetKit/Sources/DulcetCapture/Resources/PinnedControls/$control" \
              "$CAPTURE_ROOT/run-a/standard/$control"
          done
          capture_verification="$(python3 tools/verify_design_captures.py "$CAPTURE_ROOT/run-a")"
          echo "$capture_verification"
          current_run_references="$(
            sed -n 's/.* current-run-references=\([0-9][0-9]*\) .*/\1/p' \
              <<< "$capture_verification"
          )"
          pinned_controls="$(
            sed -n 's/.* pinned-controls=\([0-9][0-9]*\) .*/\1/p' \
              <<< "$capture_verification"
          )"
          if [[ -z "$current_run_references" || -z "$pinned_controls" ]]; then
            echo 'DESIGN CAPTURE SUMMARY FAIL counted fields missing from verifier output'
            exit 1
          fi
          tools/test-design-capture-gates "$CAPTURE_ROOT/run-a"
          {
            echo '## macOS design captures'
            echo
            echo 'Two complete render runs were byte-identical.'
            echo
            echo "Artifact contains ${current_run_references} current-run references plus ${pinned_controls} byte-pinned control JPEGs and makes no inapplicable Dynamic Type claim."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deterministic macOS capture mismatch forensics
        if: ${{ always() && steps.deterministic_design_capture.outputs.forensics_available == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-macos-design-capture-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dulcet-design-captures/forensics
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload macOS design evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-macos-design-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dulcet-design-captures/run-a
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Capture non-deterministic macOS shipping reference
        id: shipping_reference
        continue-on-error: true
        env:
          SHIPPING_REFERENCE_ROOT: ${{ runner.temp }}/dulcet-macos-shipping-reference
        run: |
          swift run --package-path apple/DulcetKit DulcetShippingReferenceCapture \
            --output "$SHIPPING_REFERENCE_ROOT" \
            --pinned-control-directory \
              apple/DulcetKit/Sources/DulcetCapture/Resources/PinnedControls
          python3 - "$SHIPPING_REFERENCE_ROOT/manifest.json" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(manifest["warning"])
          print(
              "shipping captures="
              f'{manifest["successfulShippingCaptureCount"]}/'
              f'{manifest["expectedShippingCaptureCount"]}'
          )
          for missing in manifest["missingCaptures"]:
              print(
                  "missing "
                  f'{missing["fixtureState"]}/{missing["appearance"]}: '
                  f'{missing["error"]}'
              )
          PY
      - name: Upload non-deterministic macOS shipping reference
        if: ${{ always() && steps.shipping_reference.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-macos-shipping-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dulcet-macos-shipping-reference
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Build iOS shell and test DulcetKit plus stored Keychain attributes on iPhone
        timeout-minutes: 17
        run: |
          set -o pipefail
          xcodebuild test \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetiOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DulcetiOSDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-ios-swift-testing.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetKitIOSTests 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-ios-swift-testing.log"
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ios-swift-testing.xcresult" \
            "$RUNNER_TEMP/dulcet-ios-swift-testing-junit/TEST-DulcetKitIOSTests.xml" \
            DulcetKitIOSTests
          xcodebuild test-without-building \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetiOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DulcetiOSDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-ios-keychain-attributes.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetKeychainIOSTests/DulcetKeychainAttributeTests/testProductionSaveRecordsDeviceOnlyNonSynchronizableAttributesOnIOSSimulator 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-ios-keychain-attributes.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ios-keychain-attributes.xcresult" \
            DulcetKeychainIOSTests.DulcetKeychainAttributeTests \
            testProductionSaveRecordsDeviceOnlyNonSynchronizableAttributesOnIOSSimulator
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ios-keychain-attributes.xcresult" \
            "$RUNNER_TEMP/dulcet-ios-keychain-attributes-junit/TEST-DulcetKeychainIOSTests.xml" \
            DulcetKeychainIOSTests
      - name: Verify iPhone uses the full display
        # 12, not 5. Measured across seven CI runs this step takes 165-290s, so the slowest
        # SUCCESSFUL run sat at 97% of a 300s cap and one run was killed at 322s. The cap was
        # sized from a local measurement and never matched CI. Peer simulator steps in this file
        # use 6, 17, 18 and 23 minutes for comparable launch-and-test work, and xcodebuild is
        # known to idle in "Finalize test log" for minutes after a test has already finished.
        # This is not a stall being hidden: the step's observed working range simply exceeded
        # its own ceiling.
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetiOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DulcetiOSDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-ios-full-display.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetiOSUITests/DulcetiOSUITests/testIPhoneWindowUsesFullDisplay 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-ios-full-display.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ios-full-display.xcresult" \
            DulcetiOSUITests.DulcetiOSUITests \
            testIPhoneWindowUsesFullDisplay
      - name: Boot iPadOS simulator before the layout launch
        timeout-minutes: 6
        id: ipados_layout_destination
        run: |
          set -o pipefail
          IPAD_UDID="$(python3 tools/resolve-ipad-destination --print udid)"
          echo "iPadOS simulator prerequisite: udid=$IPAD_UDID"

          # bootstatus -b turns simulator readiness from hidden work inside Xcode's application-
          # launch budget into an explicit prerequisite. Do not install or launch Dulcet here: the
          # UI test must still exercise a cold product launch, and a product launch failure must
          # remain a failure rather than being disguised by an app warm-up.
          if ! xcrun simctl bootstatus "$IPAD_UDID" -b; then
            echo "::error title=iPadOS simulator prerequisite failed::CoreSimulator did not finish booting; the layout test did not run"
            exit 1
          fi
          # `bootstatus -b` proves CoreSimulator considers boot complete; it does NOT prove the
          # device bootstrap is accepting process launches yet. That gap is left open deliberately.
          # A `simctl spawn` readiness gate was written to close it and MEASURED to hang on the
          # hosted runner after bootstatus had already succeeded -- and XCUITest reaches the app by
          # a different launch path regardless. So app.launch() provides the launch evidence, and
          # this prerequisite can never reject a destination that would in fact have run the test.
          echo "IPADOS SIMULATOR PREREQUISITE PASS booted=true app-launched=false"
          echo "udid=$IPAD_UDID" >> "$GITHUB_OUTPUT"
      - name: Launch iPadOS shell and prove layout plus stored Keychain attributes
        timeout-minutes: 23
        env:
          IPAD_UDID: ${{ steps.ipados_layout_destination.outputs.udid }}
        run: |
          set -o pipefail
          # The model name is NOT the thing being proved -- the UI test asserts regular width itself
          # and rejects anything narrower. Pinning `iPad Pro 13-inch (M4)` broke when the hosted image
          # rotated to M5 models, so resolve whatever iPad this image actually ships. The resolver
          # fails loudly rather than falling back to an iPhone, which would keep CI green while
          # proving nothing.
          IPAD_DESTINATION="platform=iOS Simulator,id=$IPAD_UDID"
          echo "iPadOS destination: $IPAD_DESTINATION"
          set +e
          xcodebuild test \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetiOS \
            -configuration Debug \
            -destination "$IPAD_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DulcetiPadOSDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-ipados-ui-testing.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetiOSUITests/DulcetiOSUITests/testAccountConnectUsesRegularWidthSplitLayout 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-ipados-ui-testing.log"
          xcode_status=${PIPESTATUS[0]}
          set -e
          if [[ "$xcode_status" -ne 0 ]]; then
            if grep -Fq \
              "DULCET IPADOS APP LAUNCH PASS layout-assertions-starting=true" \
              "$RUNNER_TEMP/dulcet-ipados-ui-testing.log"; then
              echo "::error title=iPadOS layout assertion failed::Dulcet launched successfully; the regular-width layout proof failed after launch"
            elif grep -Eiq \
              'failed to launch .* via Xcode|timed out while launching application via Xcode' \
              "$RUNNER_TEMP/dulcet-ipados-ui-testing.log"; then
              echo "::error title=Dulcet application launch failed::The simulator prerequisite passed, but Xcode could not launch Dulcet; layout assertions did not run"
            else
              echo "::error title=iPadOS test setup failed::The test command failed before confirming app launch; layout assertions did not run"
            fi
            exit "$xcode_status"
          fi
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ipados-ui-testing.xcresult" \
            DulcetiOSUITests.DulcetiOSUITests \
            testAccountConnectUsesRegularWidthSplitLayout
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ipados-ui-testing.xcresult" \
            "$RUNNER_TEMP/dulcet-ipados-ui-testing-junit/TEST-DulcetiOSUITests.xml" \
            DulcetiOSUITests
          xcodebuild test-without-building \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetiOS \
            -configuration Debug \
            -destination "$IPAD_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DulcetiPadOSDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-ipados-swift-testing.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetKitIOSTests 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-ipados-swift-testing.log"
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ipados-swift-testing.xcresult" \
            "$RUNNER_TEMP/dulcet-ipados-swift-testing-junit/TEST-DulcetKitIOSTests.xml" \
            DulcetKitIOSTests
          xcodebuild test-without-building \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetiOS \
            -configuration Debug \
            -destination "$IPAD_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DulcetiPadOSDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-ipados-keychain-attributes.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetKeychainIOSTests/DulcetKeychainAttributeTests/testProductionSaveRecordsDeviceOnlyNonSynchronizableAttributesOnIPadOSSimulator 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-ipados-keychain-attributes.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ipados-keychain-attributes.xcresult" \
            DulcetKeychainIOSTests.DulcetKeychainAttributeTests \
            testProductionSaveRecordsDeviceOnlyNonSynchronizableAttributesOnIPadOSSimulator
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-ipados-keychain-attributes.xcresult" \
            "$RUNNER_TEMP/dulcet-ipados-keychain-attributes-junit/TEST-DulcetKeychainIOSTests.xml" \
            DulcetKeychainIOSTests
      - name: Build DulcetTV and test DulcetKit plus stored Keychain attributes on tvOS
        timeout-minutes: 18
        run: |
          set -o pipefail
          xcodebuild test \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetTV \
            -configuration Debug \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DulcetTVDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-tvos-swift-testing.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetKitTVOSTests 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-tvos-swift-testing.log"
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-tvos-swift-testing.xcresult" \
            "$RUNNER_TEMP/dulcet-tvos-swift-testing-junit/TEST-DulcetKitTVOSTests.xml" \
            DulcetKitTVOSTests
          xcodebuild test-without-building \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetTV \
            -configuration Debug \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DulcetTVDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-tvos-keychain-attributes.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetKeychainTVOSTests/DulcetKeychainAttributeTests/testProductionSaveRecordsDeviceOnlyNonSynchronizableAttributesOnTVOSSimulator 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-tvos-keychain-attributes.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-tvos-keychain-attributes.xcresult" \
            DulcetKeychainTVOSTests.DulcetKeychainAttributeTests \
            testProductionSaveRecordsDeviceOnlyNonSynchronizableAttributesOnTVOSSimulator
          python3 tools/swift-testing-junit \
            "$RUNNER_TEMP/dulcet-tvos-keychain-attributes.xcresult" \
            "$RUNNER_TEMP/dulcet-tvos-keychain-attributes-junit/TEST-DulcetKeychainTVOSTests.xml" \
            DulcetKeychainTVOSTests
      - name: Leave only the iPhone booted before the compact-shell launch
        # Not measured -- the tool's own bounds: 120 s per `simctl shutdown` and for the boot, 300 s
        # for `bootstatus -b`, so 13 minutes with the three devices the earlier legs booted. A cap
        # here reports a hang as this step instead of as the launch after it.
        timeout-minutes: 15
        # The iPhone, iPadOS and tvOS legs above each boot a device and nothing shuts them down, and
        # this is the first simulator launch after all three. spec 21.5 rule 2 is scoped to phases
        # that talk to the loopback fixtures; this one does not, but the launch it precedes ran on a
        # starved host (see the next step), and isolation is the mechanism the host-contention
        # finding supports. It prints `SIMULATOR ISOLATION ... isolated=true|false` and marks the
        # host-pressure record with the phase.
        run: python3 tools/ci/isolate-simulator --phase compact-iphone --keep-name "iPhone 17 Pro"
      - name: Verify the compact shell keeps the album and opens Now Playing from the bar
        # 12 was inherited from `Verify iPhone uses the full display` and was too small. OBSERVED on
        # run 35985802454: the step was killed at 12.05 minutes, seconds after its test had passed
        # and its execution check had printed "valid". Its xcresult times the launch actions at
        # 688.5 s: `Launch DulcetiOSUITests` 579.9 s and `Launch Dulcet DEV` 128.7 s, before a
        # 150.3 s test. Over that launch window the host-pressure record shows load1 196-562 on 3
        # CPUs and 1,715-2,261 MB of swap. The same iPhone had run the two iPhone steps above, and no
        # step shut it or the iPad and Apple TV down. That a re-boot or the other booted devices
        # caused the slow launch is ASSUMED; what was measured is the runner launch and the
        # pressure. The step before this one now leaves only this iPhone booted.
        # Under the step's earlier name its shorter test took 2.80-9.58 minutes, median 5.77,
        # across the 20 most recent successful runs that have it. 25 is ceil(2 x 12.05), the rule
        # the job-level comment applies to its measured steps; the input is one observation of
        # this workload, so re-measure once the step has its own history.
        timeout-minutes: 25
        run: |
          set -o pipefail
          # Placed after every platform UI and Keychain proof on purpose. This job is one
          # sequential list, so a step's position decides what its failure SKIPS; putting a new
          # iPhone step above the iPadOS launch would let it gate iPadOS layout evidence that
          # nothing else produces.
          # Compact-width shell (tab bar, album layout, now-playing bar and sheet) on the
          # deterministic layout fixture -- no disposable server, so this step cannot fail for a
          # reason that belongs to the fixture server and can run here rather than inside the
          # conformance step.
          xcodebuild test-without-building \
            -project apple/Dulcet.xcodeproj \
            -scheme DulcetiOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DulcetiOSDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/dulcet-ios-compact-nav.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:DulcetiOSUITests/DulcetiOSUITests/testCompactShellKeepsTheAlbumAndOpensNowPlayingFromTheBar 2>&1 | \
          tee "$RUNNER_TEMP/dulcet-ios-compact-nav.log"
          python3 tools/verify-xcode-test-execution \
            "$RUNNER_TEMP/dulcet-ios-compact-nav.xcresult" \
            DulcetiOSUITests.DulcetiOSUITests \
            testCompactShellKeepsTheAlbumAndOpensNowPlayingFromTheBar
      - name: Assert Kotlin and Xcode OS floors
        run: >-
          python3 tools/verify_os_floors.py
          --macos-framework core/build/bin/macosArm64/debugFramework/DulcetCore.framework/Versions/A/DulcetCore
          --ios-framework core/build/bin/iosSimulatorArm64/debugFramework/DulcetCore.framework/DulcetCore
          --tvos-framework core/build/bin/tvosSimulatorArm64/debugFramework/DulcetCore.framework/DulcetCore
          --macos-app "$RUNNER_TEMP/DulcetMacDerivedData/Build/Products/Debug/Dulcet DEV.app/Contents/MacOS/Dulcet DEV"
          --ios-app "$RUNNER_TEMP/DulcetiOSDerivedData/Build/Products/Debug-iphonesimulator/Dulcet DEV.app/Dulcet DEV"
          --tvos-app "$RUNNER_TEMP/DulcetTVDerivedData/Build/Products/Debug-appletvsimulator/Dulcet DEV.app/Dulcet DEV"
      # The required `apple-ci` job resolves FEATURES.yml evidence from these directories on another
      # machine, so every JUnit directory this job wrote travels as one artifact named per job and
      # attempt. Only a successful job uploads it: `apple-ci` fails before reading evidence from a
      # leg that did not succeed, and the failure diagnostics below carry the same directories.
      - name: Upload Apple parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-apple-parity-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dulcet-*-junit
          if-no-files-found: error
          retention-days: 14
      # Per-phase memory and CPU pressure for THIS run, green or red. A stall that is paging shows
      # pageouts/swapouts in the phase it hit; a green run supplies the same numbers as its control.
      - name: Summarise host pressure by phase
        if: ${{ always() }}
        run: >-
          python3 tools/ci/host-pressure summarize "$DULCET_HOST_PRESSURE_LOG"
          || echo "host-pressure record unavailable; see the summary line above"
      # Every Apple test step here writes an .xcresult and discards it with the runner -- including
      # the platform download and Keychain runs -- along with the JUnit directories
      # `verify-parity-evidence` consumes
      # and the reference server's own log. Runs 33420584120 and 33457633113 (the latter on main)
      # failed with "Timed out while launching application via Xcode" and left ~58 seconds of silence
      # between `t = 1.05s Launch` and the failure; the evidence that would explain it was deleted.
      # This does not attempt to fix that flake -- two proposed causes have already been refuted.
      #
      # `!success()` covers BOTH failure and cancellation. A `timeout-minutes` expiry cancels the job
      # rather than failing it (observed in the 2026-08-30 sample of 12 runs).
      # A `failure()`-only condition would therefore miss the long-hang case, which is the one
      # worth the most here. `concurrency.cancel-in-progress` supersessions also land in this branch,
      # but they are killed early and so have little on disk for the globs to match.
      #
      # NOTE these globs are duplicated in the inventory step below. Keep the two lists in step.
      - name: Inventory the Apple failure diagnostics
        if: ${{ !success() }}
        shell: bash
        run: |
          set -o pipefail
          # Sizes, not just names: a killed `tee` leaves a partial .log and a killed xcodebuild an
          # unfinalized .xcresult, and a name-only listing renders both exactly like healthy ones.
          # Globs are collected into one array rather than passed to a single `ls`: `ls a/*.x b/*.y`
          # exits non-zero when EITHER pattern fails to expand, which printed the files it found and
          # then reported "NONE" underneath them.
          shopt -s nullglob
          found=("$RUNNER_TEMP"/*.xcresult "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/dulcet-*-junit "$RUNNER_TEMP"/*/logs/*.log)
          echo "APPLE FAILURE DIAGNOSTICS count=${#found[@]}"
          if [ "${#found[@]}" -eq 0 ]; then
            echo "  NONE - nothing was written before the job stopped"
          else
            du -sk "${found[@]}" | sed 's/^/  /'
          fi
      - name: Upload Apple failure diagnostics
        if: ${{ !success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-apple-failure-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/dulcet-*-junit
            ${{ runner.temp }}/*/logs/*.log
          if-no-files-found: warn
          # .xcresult payload is already-compressed media; the three sibling binary uploads in this
          # file set this for the same reason. Deflate would burn a capped macOS slot for ratio ~1.
          compression-level: 0
          retention-days: 14

  # The conformance half: the checksum-pinned Darwin closure and the native Navidrome fixtures,
  # `:core:macosArm64Test`, the macOS, iOS and tvOS conformance suites, and every app-host and UI
  # proof that talks to the disposable server. It builds the app schemes its
  # `test-without-building` legs reuse, so it is the longer leg and the run's critical path.
  #
  # 110 = ceil(1.5 x 71.3 / 5) x 5. 71.3 minutes is this leg's PROJECTED maximum, not a
  # measurement: the largest per-run sum, over the green single-job runs since #136, of the steps
  # now in this job and the job's own overhead (62.3 in run 36010624442, framework build
  # included), plus 9 minutes ASSUMED for the three app builds above the composite. It must stay
  # above the composite's own 67-minute cap plus the rest of the leg, or a slow-but-healthy
  # composite would be killed by the job and reported against whichever step was active.
  # Re-measure once the leg has history.
  apple-conformance:
    name: apple-conformance
    runs-on: macos-26
    timeout-minutes: 110
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      TZ: UTC
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove conformance access logging and structural redaction
        run: python3 tools/test-conformance-access-log
      - name: Prove the conformance wrapper collects host stacks
        run: python3 tools/test-capture-conformance-stall
      - name: Prove phase-gap calibration rejects invalid evidence
        run: python3 tools/test-measure-conformance-phase-gaps
      - name: Prove the host-pressure summary reports a known delta and refuses an empty record
        run: python3 tools/test-host-pressure
      - name: Prove simulator isolation keeps the device OS=latest would pick and shuts down the rest
        run: python3 tools/test-isolate-simulator
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      # Samples vm_stat, swap and load every 5 s for the rest of the job. The file ends in .log so the
      # failure upload's `$RUNNER_TEMP/*.log` glob carries it; the summary step prints it per phase.
      - name: Start host-pressure sampling
        run: |
          echo "DULCET_HOST_PRESSURE_LOG=$RUNNER_TEMP/dulcet-host-pressure.log" >> "$GITHUB_ENV"
          nohup python3 tools/ci/host-pressure sample \
            --output "$RUNNER_TEMP/dulcet-host-pressure.log" --interval 5 >/dev/null 2>&1 &
          python3 tools/ci/host-pressure mark "$RUNNER_TEMP/dulcet-host-pressure.log" job-start
      - name: Prove ffmpeg version gate rejects prefix collisions
        run: python3 tools/test-ffmpeg-version-gate
      - name: Prove corpus probes reject mislabeled containers and empty tags
        run: python3 tools/test-seed-corpus-gates
      - name: Prove fresh-pour gate rejects a retained keg
        run: python3 tools/test-darwin-fresh-pour-gate
      - name: Prove Darwin bottle integrity gate rejects a tampered blob
        run: python3 tools/test-darwin-bottle-integrity-gate
      - name: Prove Homebrew name resolution is asserted against the pin before any pour
        run: python3 tools/test-darwin-resolver-drift-gate
      - name: Prove every Darwin bottle pin is validated before any download
        run: python3 tools/test-darwin-pin-prevalidation-gate
      - name: Prove authenticated bottle metadata fails closed without formula-index access
        run: python3 tools/test-darwin-embedded-formula-gate
      - name: Prove Darwin live-shape drift and outage remain advisory
        run: python3 tools/test-darwin-live-shape-advisory
      - name: Select compatible Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ steps.pins.outputs.xcode }}.app/Contents/Developer"
      # FIRST, before any build. Homebrew pin drift is deterministic and fails 100% of runs (CLAUDE.md
      # trap 36), and this step used to sit behind ~55 minutes of platform builds and UI tests: run
      # 35796413810 on main (2026-09-22) spent 55.6 minutes of a hosted macOS slot before this
      # step reported six drifted formulae in 49 seconds. Nothing between Xcode selection and the
      # old position reads Homebrew, the conformance root, or the pinned ffmpeg.
      - name: Create isolated Darwin conformance root
        id: conformance_root
        run: >-
          echo "path=$(tools/conformance-env/new-class-root
          --parent "$RUNNER_TEMP" --label darwin-self-check)" >> "$GITHUB_OUTPUT"
      - name: Install and verify checksum-pinned Darwin conformance closure
        timeout-minutes: 9
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
        run: |
          tools/conformance-env/prepare-darwin --output "$ROOT/bin"
          tools/conformance-env/install-darwin-ffmpeg
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        timeout-minutes: 5
      - name: Build all Apple frameworks
        timeout-minutes: 10
        run: >-
          ./gradlew --no-daemon
          :core:linkDebugFrameworkMacosArm64
          :core:linkDebugFrameworkIosArm64
          :core:linkDebugFrameworkIosSimulatorArm64
          :core:linkDebugFrameworkTvosArm64
          :core:linkDebugFrameworkTvosSimulatorArm64
          :core:macosArm64Test
      # The composite below runs the iPhone, iPadOS and tvOS app-host and UI proofs with
      # `test-without-building`, against products the platform legs built when this was one job.
      # Jobs share no files, so the same three schemes are built here, into the same derived-data
      # roots the composite names. Nothing is tested by these steps and a build boots no simulator.
      # Not measured as steps of their own: the build half of the platform legs' first
      # `xcodebuild test` took about 2 to 4 minutes in run 36010624442. 10 bounds a hang.
      - name: Resolve the iPadOS simulator the conformance legs use
        id: ipados_conformance_destination
        timeout-minutes: 2
        run: |
          set -o pipefail
          IPAD_UDID="$(python3 tools/resolve-ipad-destination --print udid)"
          echo "iPadOS conformance destination: udid=$IPAD_UDID"
          echo "udid=$IPAD_UDID" >> "$GITHUB_OUTPUT"
      - name: Build the iOS shell for the iPhone conformance legs
        timeout-minutes: 10
        run: >-
          xcodebuild build-for-testing
          -project apple/Dulcet.xcodeproj
          -scheme DulcetiOS
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -derivedDataPath "$RUNNER_TEMP/DulcetiOSDerivedData"
      - name: Build the iOS shell for the iPadOS conformance legs
        timeout-minutes: 10
        env:
          IPAD_UDID: ${{ steps.ipados_conformance_destination.outputs.udid }}
        run: >-
          xcodebuild build-for-testing
          -project apple/Dulcet.xcodeproj
          -scheme DulcetiOS
          -configuration Debug
          -destination "platform=iOS Simulator,id=$IPAD_UDID"
          -derivedDataPath "$RUNNER_TEMP/DulcetiPadOSDerivedData"
      - name: Build DulcetTV for the tvOS conformance legs
        timeout-minutes: 10
        run: >-
          xcodebuild build-for-testing
          -project apple/Dulcet.xcodeproj
          -scheme DulcetTV
          -configuration Debug
          -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest'
          -derivedDataPath "$RUNNER_TEMP/DulcetTVDerivedData"
      - name: Exercise redirect oracle defence-in-depth mutation controls
        run: python3 tools/test-redirect-credential-detector
      - name: Prove the measurement rejects the observed first-only state
        run: |
          set +e
          output="$(swift run --package-path tools/resource-loader-spike resource-loader-spike \
            --expect-hls-segments all-routed 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          observed_rejected=false
          if test "$status" -ne 0; then observed_rejected=true; fi
          observed_first_only=false
          if grep -q 'HLS_MEDIA_SEGMENTS=FIRST_ONLY missing=segment1.aac' <<< "$output"; then
            observed_first_only=true
          fi
          observed_segment0_requests="$(grep -c 'REQUEST path=segment0.aac' <<< "$output" || true)"
          observed_segment1_requests="$(grep -c 'REQUEST path=segment1.aac' <<< "$output" || true)"
          test "$status" -ne 0
          grep -q 'HLS_PLAYBACK_ERROR surfaced=' <<< "$output"
          grep -q 'HLS_MEDIA_SEGMENTS=FIRST_ONLY missing=segment1.aac' <<< "$output"
          grep -q 'REQUEST path=segment0.aac' <<< "$output"
          if grep -q 'REQUEST path=segment1.aac' <<< "$output"; then exit 1; fi
          echo "NEGATIVE CONTROL PASS expected=all-routed observed_first_only=$observed_first_only observed_rejected=$observed_rejected observed_segment0_requests=$observed_segment0_requests observed_segment1_requests=$observed_segment1_requests"
      - name: Record progressive routing and Apple HLS fallback
        run: >-
          swift run
          --package-path tools/resource-loader-spike
          resource-loader-spike
          --expect-hls-segments first-only-playback-failed
      - name: Generate deterministic Darwin corpus
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
        run: >-
          tools/seed-corpus
          --output "$ROOT/music"
          --runtime native
          --ffmpeg "$(tools/conformance-env/read-pin ffmpeg.darwin.path)"
      - name: Render Darwin Navidrome configuration
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
        run: >-
          tools/conformance-env/render-config
          --output "$ROOT/config/navidrome.toml"
          --music-folder "$ROOT/music"
          --data-folder "$ROOT/data"
          --cache-folder "$ROOT/cache"
          --address 127.0.0.1
          --ffmpeg-path "$(tools/conformance-env/read-pin ffmpeg.darwin.path)"
      - name: Assert Darwin conformance preconditions
        timeout-minutes: 67
        id: darwin_conformance
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
          # Passed as env, never interpolated into the script below. A `run:` block containing a
          # ${{ }} expression is a TEMPLATE, and a template is capped far lower than a plain block:
          # MEASURED 2026-09-07, this 29,212-character script was rejected with an expression in it
          # and main's 29,893-character version loads without one.
          IPAD_UDID: ${{ steps.ipados_conformance_destination.outputs.udid }}
          DULCET_CONFORMANCE_BASE_URL: http://127.0.0.1:4533
          DULCET_CONFORMANCE_DISPOSABLE: "true"
        run: |
          set -o pipefail
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -config tools/conformance-env/untrusted-tls-openssl.cnf \
            -keyout "$ROOT/untrusted-tls.key" -out "$ROOT/untrusted-tls.crt"
          # The reader suite's second server: the fixture configuration with PurgeMissing left at
          # Navidrome's default, serving a copy of two corpus albums (CONF-74, spec §16.11). Only
          # its files are prepared here, before this step has started any server, so a failure in
          # the preparation cannot leave one running. The process itself lives only around the
          # macOS conformance leg, the one phase that uses it; see that leg below.
          tools/conformance-env/purge-default-server prepare \
            --corpus "$ROOT/music" --music-folder "$ROOT/purge-default/music"
          mkdir -p "$ROOT/purge-default/data" "$ROOT/purge-default/cache"
          tools/conformance-env/render-config --output "$ROOT/purge-default/config/navidrome.toml" \
            --music-folder "$ROOT/purge-default/music" --data-folder "$ROOT/purge-default/data" \
            --cache-folder "$ROOT/purge-default/cache" --address 127.0.0.1 --port 4534 \
            --purge-missing server-default --ffmpeg-path "$(tools/conformance-env/read-pin ffmpeg.darwin.path)"
          purge_default_pid=
          "$ROOT/bin/navidrome" --configfile "$ROOT/config/navidrome.toml" > "$ROOT/logs/navidrome.log" 2>&1 &
          navidrome_pid=$!
          # Both fixture processes write capped, query-free access logs to RUNNER_TEMP by default.
          # The existing failure upload below includes these dulcet-conformance-access-*.log files.
          python3 tools/conformance-env/redirect-server --port 4540 --target-port 4541 &
          redirect_pid=$!
          python3 tools/conformance-env/untrusted-tls-server --port 4542 \
            --certificate "$ROOT/untrusted-tls.crt" --key "$ROOT/untrusted-tls.key" &
          tls_pid=$!
          python3 tools/conformance-env/redirect-server --port 4543 --forward-proxy-auth &
          proxy_pid=$!
          cleanup() {
            kill "$redirect_pid" >/dev/null 2>&1 || true
            wait "$redirect_pid" 2>/dev/null || true
            kill "$tls_pid" >/dev/null 2>&1 || true
            wait "$tls_pid" 2>/dev/null || true
            kill "$proxy_pid" >/dev/null 2>&1 || true
            wait "$proxy_pid" 2>/dev/null || true
            kill "$navidrome_pid" >/dev/null 2>&1 || true
            wait "$navidrome_pid" 2>/dev/null || true
            # Backstop only: the macOS leg stops this server itself, and clears the pid when it has.
            kill "$purge_default_pid" >/dev/null 2>&1 || true
            wait "$purge_default_pid" 2>/dev/null || true
            tail -200 "$ROOT/logs/navidrome.log" || true
          }
          trap cleanup EXIT
          # `restart_navidrome_cold` runs three times, and across 99 green apple-ci runs 2026-09-02..
          # 2026-09-10 its readiness window was elevated exactly where a `simctl create`+`boot`
          # immediately preceded it (restart #2 median 9.49 s, max 89.01 s, against 2.61 s for #1).
          # Restart #2 was then moved AHEAD of its simulator create+boot as a pre-registered
          # experiment, with #3 left in place as the in-run control. Read 2026-09-22 over 23 green
          # runs it is SUPPORTED: #2/#1 fell to 1.02x while #3/#1 stayed at 2.13x (23/23 above 1).
          # The markers stay so the arrangement remains legible in every log; design, criteria and
          # result are in docs/investigations/2026-09-10-restart-sequencing-experiment.md.
          restart_index=0
          restart_navidrome_cold() {
            restart_index=$((restart_index + 1))
            # Names which restarts were resequenced and which were not, so the comparison can be
            # made from the log without inferring the arm from nearby simctl lines.
            echo "RESTART SEQUENCING index=${restart_index} phase=$1 arm=$2 simulator_created_before=$3"
            # Navidrome 0.63.2 exposes its latest successful library ScanEnd as
            # scanStatus.lastScan. Snapshot it while this process is still alive, then require the
            # replacement process to advance it. The database survives this restart, so a non-zero
            # count and queryable album alone would only prove that the previous scan left rows.
            previous_last_scan="$(tools/conformance-env/await-library-ready \
              --base-url http://127.0.0.1:4533 --print-last-scan)"
            kill "$navidrome_pid"
            wait "$navidrome_pid" 2>/dev/null || true
            tools/conformance-env/reset-transcode-cache --root "$ROOT"
            "$ROOT/bin/navidrome" --configfile "$ROOT/config/navidrome.toml" >> "$ROOT/logs/navidrome.log" 2>&1 &
            navidrome_pid=$!
            for _ in {1..100}; do
              if curl --fail --silent http://127.0.0.1:4533/app/ >/dev/null; then break; fi
              sleep 0.1
            done
            curl --fail --silent http://127.0.0.1:4533/app/ >/dev/null
            # HTTP readiness is not current-process scan readiness. Wait for this restart's
            # successful ScanEnd timestamp, then require the retained library to remain queryable.
            tools/conformance-env/await-library-ready \
              --base-url http://127.0.0.1:4533 --after-last-scan "$previous_last_scan"
            tools/conformance-env/observe-transcode-cache \
              --log-file "$ROOT/logs/navidrome.log" --expect-cached false
