name: apple-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-ci:
    name: apple-ci
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TZ: UTC
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - name: Prove ffmpeg version gate rejects prefix collisions
        run: python3 tools/test-ffmpeg-version-gate
      - name: Prove corpus probes reject mislabeled containers and empty tags
        run: python3 tools/test-seed-corpus-gates
      - name: Prove fresh-pour gate rejects a retained keg
        run: python3 tools/test-darwin-fresh-pour-gate
      - name: Select compatible Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ steps.pins.outputs.xcode }}.app/Contents/Developer"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build all Apple frameworks
        run: >-
          ./gradlew --no-daemon
          :core:linkDebugFrameworkMacosArm64
          :core:linkDebugFrameworkIosArm64
          :core:linkDebugFrameworkIosSimulatorArm64
          :core:linkDebugFrameworkTvosArm64
          :core:linkDebugFrameworkTvosSimulatorArm64
          :core:macosArm64Test
      - name: Build macOS shell
        run: >-
          xcodebuild build
          -project apple/Dulcet.xcodeproj
          -scheme DulcetMac
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DulcetMacDerivedData"
          CODE_SIGNING_ALLOWED=NO
      - name: Test native macOS presentation and computed WCAG contrast gates
        run: swift test --package-path apple/DulcetKit
      - name: Prove macOS capture rejects an inapplicable Dynamic Type label
        run: |
          set +e
          output="$(swift run --package-path apple/DulcetKit DulcetCapture \
            --output "$RUNNER_TEMP/rejected-dynamic-type" \
            --state empty-library-no-account --appearance light \
            --dynamic-type accessibility5 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q 'macOS capture cannot claim Dynamic Type accessibility5' <<< "$output"
          test ! -e "$RUNNER_TEMP/rejected-dynamic-type"
          echo "DYNAMIC TYPE NEGATIVE CONTROL PASS label=accessibility5 rejected=true output-created=false"
      - name: Capture deterministic macOS design evidence twice
        env:
          CAPTURE_ROOT: ${{ runner.temp }}/dulcet-design-captures
        run: |
          swift run --package-path apple/DulcetKit DulcetCapture \
            --output "$CAPTURE_ROOT/run-a/standard" \
            --state all --appearance all --include-control
          swift run --package-path apple/DulcetKit DulcetCapture \
            --output "$CAPTURE_ROOT/run-b/standard" \
            --state all --appearance all --include-control
          diff -qr "$CAPTURE_ROOT/run-a" "$CAPTURE_ROOT/run-b"
          python3 tools/verify_design_captures.py "$CAPTURE_ROOT/run-a"
          tools/test-design-capture-gates "$CAPTURE_ROOT/run-a"
          {
            echo '## macOS design captures'
            echo
            echo 'Two complete render runs were byte-identical.'
            echo
            echo 'Artifact contains 16 standard/control JPEGs and makes no inapplicable Dynamic Type claim.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS design evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-macos-design-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dulcet-design-captures/run-a
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build iOS and iPadOS shell
        run: >-
          xcodebuild build
          -project apple/Dulcet.xcodeproj
          -scheme DulcetiOS
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DulcetiOSDerivedData"
          CODE_SIGNING_ALLOWED=NO
      - name: Build tvOS shell
        run: >-
          xcodebuild build
          -project apple/Dulcet.xcodeproj
          -scheme DulcetTV
          -configuration Debug
          -destination 'generic/platform=tvOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DulcetTVDerivedData"
          CODE_SIGNING_ALLOWED=NO
      - name: Assert Kotlin and Xcode OS floors
        run: >-
          python3 tools/verify_os_floors.py
          --macos-framework core/build/bin/macosArm64/debugFramework/DulcetCore.framework/Versions/A/DulcetCore
          --ios-framework core/build/bin/iosSimulatorArm64/debugFramework/DulcetCore.framework/DulcetCore
          --tvos-framework core/build/bin/tvosSimulatorArm64/debugFramework/DulcetCore.framework/DulcetCore
          --macos-app "$RUNNER_TEMP/DulcetMacDerivedData/Build/Products/Debug/Dulcet DEV.app/Contents/MacOS/Dulcet DEV"
          --ios-app "$RUNNER_TEMP/DulcetiOSDerivedData/Build/Products/Debug-iphonesimulator/Dulcet DEV.app/Dulcet DEV"
          --tvos-app "$RUNNER_TEMP/DulcetTVDerivedData/Build/Products/Debug-appletvsimulator/Dulcet DEV.app/Dulcet DEV"
      - name: Create isolated Darwin conformance root
        id: conformance_root
        run: >-
          echo "path=$(tools/conformance-env/new-class-root
          --parent "$RUNNER_TEMP" --label darwin-self-check)" >> "$GITHUB_OUTPUT"
      - name: Install and verify checksum-pinned Darwin conformance closure
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
        run: |
          tools/conformance-env/prepare-darwin --output "$ROOT/bin"
          tools/conformance-env/install-darwin-ffmpeg
      - name: Prove the measurement rejects the observed first-only state
        run: |
          set +e
          output="$(swift run --package-path tools/resource-loader-spike resource-loader-spike \
            --expect-hls-segments all-routed 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          observed_rejected=false
          if test "$status" -ne 0; then observed_rejected=true; fi
          observed_first_only=false
          if grep -q 'HLS_MEDIA_SEGMENTS=FIRST_ONLY missing=segment1.aac' <<< "$output"; then
            observed_first_only=true
          fi
          observed_segment0_requests="$(grep -c 'REQUEST path=segment0.aac' <<< "$output" || true)"
          observed_segment1_requests="$(grep -c 'REQUEST path=segment1.aac' <<< "$output" || true)"
          test "$status" -ne 0
          grep -q 'HLS_PLAYBACK_ERROR surfaced=' <<< "$output"
          grep -q 'HLS_MEDIA_SEGMENTS=FIRST_ONLY missing=segment1.aac' <<< "$output"
          grep -q 'REQUEST path=segment0.aac' <<< "$output"
          if grep -q 'REQUEST path=segment1.aac' <<< "$output"; then exit 1; fi
          echo "NEGATIVE CONTROL PASS expected=all-routed observed_first_only=$observed_first_only observed_rejected=$observed_rejected observed_segment0_requests=$observed_segment0_requests observed_segment1_requests=$observed_segment1_requests"
      - name: Record progressive routing and Apple HLS fallback
        run: >-
          swift run
          --package-path tools/resource-loader-spike
          resource-loader-spike
          --expect-hls-segments first-only-playback-failed
      - name: Generate deterministic Darwin corpus
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
        run: >-
          tools/seed-corpus
          --output "$ROOT/music"
          --runtime native
          --ffmpeg "$(tools/conformance-env/read-pin ffmpeg.darwin.path)"
      - name: Render Darwin Navidrome configuration
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
        run: >-
          tools/conformance-env/render-config
          --output "$ROOT/config/navidrome.toml"
          --music-folder "$ROOT/music"
          --data-folder "$ROOT/data"
          --cache-folder "$ROOT/cache"
          --address 127.0.0.1
          --ffmpeg-path "$(tools/conformance-env/read-pin ffmpeg.darwin.path)"
      - name: Assert Darwin conformance preconditions
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
        run: |
          "$ROOT/bin/navidrome" --configfile "$ROOT/config/navidrome.toml" > "$ROOT/logs/navidrome.log" 2>&1 &
          navidrome_pid=$!
          cleanup() {
            kill "$navidrome_pid" >/dev/null 2>&1 || true
            wait "$navidrome_pid" 2>/dev/null || true
            tail -200 "$ROOT/logs/navidrome.log" || true
          }
          trap cleanup EXIT
          tools/conformance-env/health-check \
            --base-url http://127.0.0.1:4533 \
            --runtime darwin/arm64 \
            --expected-server-version "$(tools/conformance-env/read-pin navidrome.version)" \
            --expected-ffmpeg-version "$(tools/conformance-env/read-pin ffmpeg.darwin.version)" \
            --ffmpeg-command-json "[\"$(tools/conformance-env/read-pin ffmpeg.darwin.path)\"]" \
            --corpus-manifest "$ROOT/music/corpus-manifest.json"
