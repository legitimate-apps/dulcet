name: signed-ipad-account-connect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-ipad-account-connect
  cancel-in-progress: true

jobs:
  main-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
  signed-ipad-account-connect:
    needs: main-only
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, dulcet-signed-ipad]
    timeout-minutes: 60
    steps:
      - name: Prove signed iPad connection and scrub evidence
        env:
          DULCET_CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          control=/Users/Shared/dulcet-signed-ipad-control
          for item in "$control" "$control/job"; do
            if [ ! -e "$item" ] || [ -L "$item" ] || [ "$(stat -f %u "$item")" != "$(id -u)" ] || [ "$(stat -f %Lp "$item")" != 700 ]; then
              echo "The signed-device control files are not private to the runner account."
              exit 1
            fi
          done
          exec "$control/job"
      - name: Publish checked JUnit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-signed-ipad-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/proof.xml
          if-no-files-found: error
          retention-days: 7
