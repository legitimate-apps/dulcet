name: iPhone Library movement proof
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic-iphone:
    name: Trace Library movement then three clean exact repetitions
    runs-on: xcode-27
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        device:
        - iphone
    env:
      TZ: UTC
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 4
    - name: Read toolchain pins
      id: pins
      run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
    - name: Start host-pressure sampling
      run: |
        echo "DULCET_HOST_PRESSURE_LOG=$RUNNER_TEMP/dulcet-host-pressure.log" >> "$GITHUB_ENV"
        nohup python3 tools/ci/host-pressure sample \
          --output "$RUNNER_TEMP/dulcet-host-pressure.log" --interval 5 >/dev/null 2>&1 &
        python3 tools/ci/host-pressure mark "$RUNNER_TEMP/dulcet-host-pressure.log" job-start
    - name: Select compatible Xcode
      run: sudo xcode-select -s "/Applications/Xcode_${{ steps.pins.outputs.xcode }}.app/Contents/Developer"
    - name: Stop Spotlight indexing on the runner
      run: sudo mdutil -a -i off || echo "mdutil failed; Spotlight indexing left as it was"
    - name: Create isolated Darwin conformance root
      id: conformance_root
      run: echo "path=$(tools/conformance-env/new-class-root --parent "$RUNNER_TEMP" --label darwin-self-check)"
        >> "$GITHUB_OUTPUT"
    - name: Compute the pinned Darwin ffmpeg cache key
      id: ffmpeg_key
      run: |
        echo "key=$(tools/conformance-env/install-darwin-ffmpeg cache-key)" >> "$GITHUB_OUTPUT"
        echo "prefix=$(tools/conformance-env/read-pin ffmpeg.darwin.prefix)" >> "$GITHUB_OUTPUT"
    - name: Restore the pinned Darwin ffmpeg build
      id: ffmpeg_cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.ffmpeg_key.outputs.prefix }}
        key: ${{ steps.ffmpeg_key.outputs.key }}
    - name: Install the pinned Navidrome and build or verify the pinned Darwin ffmpeg
      timeout-minutes: 30
      env:
        ROOT: ${{ steps.conformance_root.outputs.path }}
      run: |
        tools/conformance-env/prepare-darwin --output "$ROOT/bin"
        tools/conformance-env/install-darwin-ffmpeg
    - name: Save the pinned Darwin ffmpeg build
      if: ${{ steps.ffmpeg_cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.ffmpeg_key.outputs.prefix }}
        key: ${{ steps.ffmpeg_key.outputs.key }}
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: ${{ steps.pins.outputs.jdk }}
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      timeout-minutes: 5
    - name: Build the disposable Dulcet Server
      timeout-minutes: 10
      run: tools/run-gradle-exclusive --no-daemon --max-workers=2 :server:installDist
    - name: Build the Apple framework the iPhone and iPadOS conformance legs read
      timeout-minutes: 10
      run: tools/run-gradle-exclusive --no-daemon :core:linkDebugFrameworkIosSimulatorArm64
    - name: Build the iOS shell for the iPhone conformance legs
      if: ${{ matrix.device == 'iphone' }}
      timeout-minutes: 10
      run: xcodebuild build-for-testing -project apple/Dulcet.xcodeproj -scheme DulcetiOS -configuration Debug -destination
        'platform=iOS Simulator,name=iPhone 18 Pro,OS=latest' -derivedDataPath "$RUNNER_TEMP/DulcetiOSDerivedData"
    - name: Generate deterministic Darwin corpus
      env:
        ROOT: ${{ steps.conformance_root.outputs.path }}
      run: tools/seed-corpus --output "$ROOT/music" --runtime native --ffmpeg "$(tools/conformance-env/read-pin
        ffmpeg.darwin.path)"
    - name: Render Darwin Navidrome configuration
      env:
        ROOT: ${{ steps.conformance_root.outputs.path }}
      run: tools/conformance-env/render-config --output "$ROOT/config/navidrome.toml" --music-folder "$ROOT/music"
        --data-folder "$ROOT/data" --cache-folder "$ROOT/cache" --address 127.0.0.1 --ffmpeg-path "$(tools/conformance-env/read-pin
        ffmpeg.darwin.path)"
    - name: Stop the idle build daemons before the timed proofs
      timeout-minutes: 3
      run: python3 tools/ci/stop-build-daemons
    - name: Trace relaunch, prove three clean repetitions and measure position
      timeout-minutes: 150
      id: darwin_conformance
      env:
        ROOT: ${{ steps.conformance_root.outputs.path }}
        DULCET_CONFORMANCE_BASE_URL: http://127.0.0.1:4533
        DULCET_CONFORMANCE_DISPOSABLE: 'true'
        DULCET_DEVICE: ${{ matrix.device }}
      run: |
        set -o pipefail
        case "$DULCET_DEVICE" in
          ipad|iphone|tvos) ;;
          *) echo "unknown conformance leg device: '$DULCET_DEVICE'" >&2; exit 1 ;;
        esac
        # This job's own disposable server and the one fixture its phases use: the fault proxy,
        # which forwards every request to this server unchanged except a lyrics read a proof arms it
        # to fail (tools/ci/run-lyrics-quality-proofs) and every request during an outage a playlist
        # proof switches on (tools/ci/run-ratings-playlists-proofs). The redirect, TLS and
        # forward-proxy fixtures serve only the core-conformance suites, which run in
        # apple-conformance-core. Navidrome logs where the failure upload below finds it; the proxy
        # writes no log file.
        "$ROOT/bin/navidrome" --configfile "$ROOT/config/navidrome.toml" > "$ROOT/logs/navidrome.log" 2>&1 &
        navidrome_pid=$!
        python3 tools/conformance-env/lyrics-fault-proxy --port 4544 --upstream http://127.0.0.1:4533 &
        lyrics_proxy_pid=$!
        cleanup() {
          kill "$lyrics_proxy_pid" >/dev/null 2>&1 || true
          wait "$lyrics_proxy_pid" 2>/dev/null || true
          kill "$navidrome_pid" >/dev/null 2>&1 || true
          wait "$navidrome_pid" 2>/dev/null || true
          tail -200 "$ROOT/logs/navidrome.log" || true
        }
        trap cleanup EXIT
        for _ in {1..20}; do
          if curl --fail --silent http://127.0.0.1:4544/__dulcet/health >/dev/null; then break; fi
          sleep 0.1
        done
        curl --fail --silent http://127.0.0.1:4544/__dulcet/health >/dev/null
        tools/conformance-env/health-check \
          --base-url http://127.0.0.1:4533 \
          --runtime darwin/arm64 \
          --expected-server-version "$(tools/conformance-env/read-pin navidrome.version)" \
          --expected-ffmpeg-version "$(tools/conformance-env/read-pin ffmpeg.darwin.version)" \
          --ffmpeg-command-json "[\"$(tools/conformance-env/read-pin ffmpeg.darwin.path)\"]" \
          --corpus-manifest "$ROOT/music/corpus-manifest.json"
        set -euo pipefail
        tools/ci/with-my-library-fixture --root "$ROOT/my-library-iphone" --music "$ROOT/music" \
          --ffmpeg "$(tools/conformance-env/read-pin ffmpeg.darwin.path)" \
          --ffprobe "$(dirname "$(tools/conformance-env/read-pin ffmpeg.darwin.path)")/ffprobe" \
          -- tools/ci/run-movement-proof
    - name: Stop host-pressure sampling and bound unfinished stack captures
      if: ${{ always() }}
      timeout-minutes: 1
      run: python3 tools/ci/host-pressure stop "$DULCET_HOST_PRESSURE_LOG"
    - name: Summarise host pressure by phase
      if: ${{ always() }}
      run: python3 tools/ci/host-pressure summarize "$DULCET_HOST_PRESSURE_LOG" || echo "host-pressure record unavailable;
        see the summary line above"
    - name: Upload host-pressure observations on every verdict
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dulcet-host-pressure-${{ github.job }}-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: ${{ runner.temp }}/dulcet-host-pressure.log
        if-no-files-found: warn
        retention-days: 14
    - name: Inventory the Apple failure diagnostics
      if: ${{ always() }}
      shell: bash
      run: |
        set -o pipefail
        # Sizes, not just names: a killed `tee` leaves a partial .log and a killed xcodebuild an
        # unfinalized .xcresult, and a name-only listing renders both exactly like healthy ones.
        # Globs are collected into one array rather than passed to a single `ls`: `ls a/*.x b/*.y`
        # exits non-zero when EITHER pattern fails to expand, which printed the files it found and
        # then reported "NONE" underneath them.
        shopt -s nullglob
        found=("$RUNNER_TEMP"/*.xcresult "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/dulcet-*-junit "$RUNNER_TEMP"/*/logs/*.log "$RUNNER_TEMP"/*/my-library-*/*.log)
        echo "APPLE FAILURE DIAGNOSTICS count=${#found[@]}"
        if [ "${#found[@]}" -eq 0 ]; then
          echo "  NONE - nothing was written before the job stopped"
        else
          du -sk "${found[@]}" | sed 's/^/  /'
        fi
    - name: Upload Apple failure diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dulcet-apple-failure-diagnostics-${{ github.job }}-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: |+
          ${{ runner.temp }}/*.xcresult
          ${{ runner.temp }}/*.log
          ${{ runner.temp }}/dulcet-*-junit
          ${{ runner.temp }}/*/logs/*.log
          ${{ runner.temp }}/*/my-library-*/*.log

          ${{ runner.temp }}/*.json

        if-no-files-found: warn
        compression-level: 0
        retention-days: 14
