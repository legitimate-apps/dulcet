name: Apple trust cleanup diagnostic

# Branch-only one-shot instrument; reuses a registered dispatch workflow without merging it.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Compatibility input; this diagnostic runs only its fresh CA cycle
        required: true
        default: trust-only
        type: string

permissions:
  contents: read

concurrency:
  group: apple-trust-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-trust-diagnostic:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Diagnose one disposable OS trust cycle
        run: python3 tools/ci/diagnose-connection-apple-trust
      - name: Retain generic fresh-fixture diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dulcet-disposable-trust-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dulcet-trust-diagnostic-*/*.log
            ${{ runner.temp }}/dulcet-trust-diagnostic-*/owned-processes.json
            ${{ runner.temp }}/dulcet-trust-diagnostic-*/ca.pem
          if-no-files-found: error
          retention-days: 7
