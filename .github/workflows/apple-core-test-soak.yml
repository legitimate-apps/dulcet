name: Apple connection Mac runtime diagnostic

# Branch-only single-selector proof from the unchanged parent source; never a merge gate.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Compatibility input; this diagnostic executes the production Mac MP10 selector once
        required: true
        default: mac-mp10
        type: string

permissions:
  contents: read

concurrency:
  group: apple-connection-mac-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-connection-runtime:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TZ: UTC
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Require the exact production source
        run: |
          test "$(git rev-parse HEAD^)" = 9613fefa09c30be9c01a1da2b74583bd15871ba3
          git diff --exit-code HEAD^ -- . ':!.github/workflows/apple-core-test-soak.yml'
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - name: Select compatible Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ steps.pins.outputs.xcode }}.app/Contents/Developer"
      - name: Create isolated Darwin conformance root
        id: conformance_root
        run: >-
          echo "path=$(tools/conformance-env/new-class-root
          --parent "$RUNNER_TEMP" --label darwin-mac-connections)" >> "$GITHUB_OUTPUT"
      - name: Compute the pinned Darwin ffmpeg cache key
        id: ffmpeg_key
        run: |
          echo "key=$(tools/conformance-env/install-darwin-ffmpeg cache-key)" >> "$GITHUB_OUTPUT"
          echo "prefix=$(tools/conformance-env/read-pin ffmpeg.darwin.prefix)" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned Darwin ffmpeg build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ffmpeg_key.outputs.prefix }}
          key: ${{ steps.ffmpeg_key.outputs.key }}
      - name: Prepare the pinned Darwin tools
        timeout-minutes: 12
        env:
          ROOT: ${{ steps.conformance_root.outputs.path }}
        run: |
          tools/conformance-env/prepare-darwin --output "$ROOT/bin"
          tools/conformance-env/install-darwin-ffmpeg
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        timeout-minutes: 5
      - name: Build only the server and Mac framework
        timeout-minutes: 10
        run: tools/run-gradle-exclusive --no-daemon --max-workers=2 :server:installDist :core:linkDebugFrameworkMacosArm64
      - name: Execute the production Mac MP10 proof once
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ffmpeg="$(tools/conformance-env/read-pin ffmpeg.darwin.path)"
          tools/conformance-env/multipath-fixture --root "$RUNNER_TEMP/dulcet-connections-fixture-mac" \
            --ffmpeg "$ffmpeg" --ffprobe "$(dirname "$ffmpeg")/ffprobe" -- bash -e -c '
              tools/conformance-env/multipath-fixture-check
              tools/ci/run-connection-apple-proofs mac
            '
      - name: Retain the single-selector evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-connection-mac-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dulcet-connections-*/*.log
            ${{ runner.temp }}/dulcet-connections-*/junit/*.xml
            ${{ runner.temp }}/dulcet-connections-*/connections.xcresult
            ${{ runner.temp }}/dulcet-connections-fixture*/requests.json
          if-no-files-found: error
          retention-days: 7
