name: core-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-ci:
    name: core-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install pinned Android platform
        run: sdkmanager "platforms;android-${{ steps.pins.outputs.compile_sdk }}"
      - name: Verify CI policy
        run: python3 tools/verify_ci_policy.py
      - name: Verify deployment configuration
        run: python3 tools/verify_os_floors.py --configuration-only
      - name: Build, test, and audit dependency licences
        run: >-
          ./gradlew --no-daemon
          :core:allMetadataJar
          :core:jvmTest
          :core:testAndroidHostTest
          :core:bundleAndroidMainAar
          :core:licensee
