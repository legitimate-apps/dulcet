name: android-emulator-loss-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-loss-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-wishlist-android:
    name: discover-wishlist-android
    outputs:
      attempt: ${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: UTC
      EMULATOR_API_LEVEL: '34'
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
      EMULATOR_BUILD_TOOLS: '37.0.0'
      EMULATOR_GRADLE_BUILD_TOOLS: '36.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Use hosted SDK command-line tools
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android emulator SDK packages (infrastructure, bounded retry)
        timeout-minutes: 10
        shell: bash
        env:
          COMPILE_SDK: ${{ steps.pins.outputs.compile_sdk }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discover-android"
          python3 tools/ci/android-system-image install --api-level "$EMULATOR_API_LEVEL" --target "$EMULATOR_TARGET" --arch "$EMULATOR_ARCH" --sdk-package "build-tools;$EMULATOR_BUILD_TOOLS" --sdk-package "build-tools;$EMULATOR_GRADLE_BUILD_TOOLS" --sdk-package platform-tools --sdk-package "platforms;android-$EMULATOR_API_LEVEL" --sdk-package "platforms;android-$COMPILE_SDK" --sdk-package emulator --action-log "$RUNNER_TEMP/discover-android/sdk-action-install.log" 2>&1 | tee "$RUNNER_TEMP/discover-android/sdk-install.log"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -w /dev/kvm
      - name: Provision the pinned disposable fixture
        timeout-minutes: 5
        run: |
          # Use the same Ubuntu archive fallback as the existing server conformance leg.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg lsof
          python3 tools/ci/prepare-discover-fixture
      - name: Build the real app and fixture
        timeout-minutes: 15
        run: tools/run-gradle-exclusive --no-daemon --max-workers=2 :server:installDist :android:app:assembleDevDebug :android:app:assembleDevDebugAndroidTest
      - name: Select the phone evidence directory
        run: echo "DULCET_DISCOVER_ANDROID_OUTPUT=$RUNNER_TEMP/discover-android/native" >> "$GITHUB_ENV"
      - name: Start bounded host sampling
        run: |
          python3 tools/ci/diagnose-android-emulator-host start --output "$RUNNER_TEMP/android-host-diagnostic"
      - name: Drive Discover and Wishlist through the native phone app
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: ${{ env.EMULATOR_ARCH }}
          target: ${{ env.EMULATOR_TARGET }}
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tools/ci/android-system-image verify-booted --api-level "$EMULATOR_API_LEVEL" --target "$EMULATOR_TARGET" --arch "$EMULATOR_ARCH"
            DULCET_ADB_DIAGNOSTIC_OUTPUT="$RUNNER_TEMP/android-host-diagnostic" ANDROID_SERIAL=emulator-5554 tools/ci/with-discover-wishlist-fixture --evidence "$RUNNER_TEMP/discover-android/fixture" -- tools/ci/run-discover-wishlist-proofs android
      - name: Retain safe host and crash accounting after the real verdict
        if: ${{ always() }}
        run: python3 tools/ci/diagnose-android-emulator-host collect --output "$RUNNER_TEMP/android-host-diagnostic"
      - name: Upload safe host diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-host-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-host-diagnostic
          if-no-files-found: error
          retention-days: 7
      - name: Upload native proof and captures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: discover-wishlist-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/discover-android
          if-no-files-found: error
          retention-days: 14
