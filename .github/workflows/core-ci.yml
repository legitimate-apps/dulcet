name: core-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      emulator_reps:
        # Soak control for the android-emulator legs: a JSON list of repetition labels. Each label
        # runs both legs on its own fresh runner, emulator and server, so one dispatch draws N
        # independent samples. Push and pull_request runs have no inputs and run once.
        description: 'Emulator soak: JSON list of repetition labels, e.g. [1,2,3,4,5,6]'
        required: false
        default: '[1]'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-build:
    name: core-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The required job downloads this job's evidence by the attempt that PRODUCED it. See there.
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-${{ steps.pins.outputs.compile_sdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify CI policy
        run: python3 tools/verify_ci_policy.py
      - name: Verify deployment configuration
        run: python3 tools/verify_os_floors.py --configuration-only
      - name: Verify protected-data migration semantics
        run: python3 tools/migration_gate.py
      - name: Verify Apple presents every playback phase the core can send
        run: python3 tools/verify-playback-phase-parity
      - name: Build, test, and audit dependency licences
        run: >-
          ./gradlew --no-daemon
          --max-workers=2
          :core:verifySqlDelightMigration
          :core:allMetadataJar
          :core:jvmTest
          :core:testAndroidHostTest
          :core:bundleAndroidMainAar
          :core:licensee
      # The Android shell builds here rather than in a job of its own. This runner already provisions
      # the SDK for the core's Android target, so a separate job would duplicate that setup and widen
      # a matrix the design deliberately keeps narrow -- for no added signal.
      #
      # Both variants are assembled on purpose. The PROD variant must not be able to compile a
      # preconfigured server URL, and that guarantee is structural: `ChannelDefaults` is an interface
      # in `main`, and each flavour source set supplies its own `ActiveChannelDefaults` -- prod null,
      # dev the loopback dev server. Building prod alone would not prove the split holds; building
      # both means a mistake that collapses them fails here.
      - name: Build the Android mobile channels and TV app
        run: >-
          ./gradlew --no-daemon
          --max-workers=2
          :android:app:assembleDevDebug
          :android:app:assembleProdDebug
          :android:tv:assembleDebug
      # BOTH variants' unit tests run. The prod test asserts PROD ships no preconfigured server URL;
      # the dev test asserts DEV still carries one. The second is the positive control for the first
      # -- a refactor collapsing both flavours onto a single null-returning implementation would leave
      # the prod assertion passing while proving nothing, and the dev test is what catches that.
      - name: Test the Android mobile channels and TV app
        run: >-
          ./gradlew --no-daemon
          --max-workers=2
          :android:app:testDevDebugUnitTest
          :android:app:testProdDebugUnitTest
          :android:tv:testDebugUnitTest
      - name: Upload Android app evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-android-app-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/test-results/testDevDebugUnitTest
            android/app/build/test-results/testProdDebugUnitTest
            android/tv/build/test-results/testDebugUnitTest
          if-no-files-found: error
          retention-days: 7

  conformance-env-linux:
    name: conformance-env-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The required job downloads this job's evidence by the attempt that PRODUCED it. See there.
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-${{ steps.pins.outputs.compile_sdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Prove ffmpeg version gate rejects prefix collisions
        run: python3 tools/test-ffmpeg-version-gate
      - name: Prove corpus probes reject mislabeled containers and empty tags
        run: python3 tools/test-seed-corpus-gates
      - name: Exercise redirect oracle defence-in-depth mutation controls
        run: python3 tools/test-redirect-credential-detector
      - name: Prove the cache-search readiness probe separates a stall from a real absence
        run: python3 tools/test-cache-search-readiness
      - name: Prove a cache-search stall names which loopback layer stopped answering
        run: python3 tools/test-cache-loopback-diagnostic
      - name: Prove deleting any loopback diagnosis property fails its control
        run: python3 tools/test-cache-loopback-mutations
      - name: Prove the health request policy preserves an error envelope's message
        run: python3 tools/test-health-request-policy
      - name: Prove the playback phase parity gate rejects an unhandled phase
        run: python3 tools/test-verify-playback-phase-parity
      - name: Create fresh test-class root
        id: root
        run: echo "path=$(tools/conformance-env/new-class-root --parent "$RUNNER_TEMP" --label linux-self-check)" >> "$GITHUB_OUTPUT"
      - name: Start the shared cold Linux environment and run conformance
        env:
          ROOT: ${{ steps.root.outputs.path }}
        run: |
          cleanup() {
            tools/conformance-env/linux-local --root "$ROOT" down || true
          }
          trap cleanup EXIT
          # --purge-default: the JVM suite includes the reader suite, whose CONF-74 needs the
          # second, default-PurgeMissing server. Jobs that never run CONF-74 do not start it.
          tools/conformance-env/linux-local --root "$ROOT" up --purge-default
          tools/conformance-env/linux-local --root "$ROOT" run -- \
            ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.workers.max=2 \
            :core-conformance:jvmTest
          # CONF-14a and CONF-17 measure a cold transcode. The JVM run warms that cache, so the
          # Android target gets the same fail-loud stopped-server reset used between Apple targets.
          # `reset` proves cached=false from Navidrome's own log before this second suite starts.
          tools/conformance-env/linux-local --root "$ROOT" reset
          tools/conformance-env/linux-local --root "$ROOT" run -- \
            ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.workers.max=2 \
            :core-conformance:testAndroidHostTest
          tools/conformance-env/linux-local --root "$ROOT" reset
          # Explicit live mode excludes fixture/unit controls and fails if the server is absent.
          tools/conformance-env/linux-local --root "$ROOT" run -- \
            ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.workers.max=2 \
            -Pdulcet.productionSearchConformance \
            :android:app:testDevDebugUnitTest :android:tv:testDebugUnitTest

      # A conformance failure is a measurement disagreeing with the reference server, so the JUnit
      # XML is the evidence -- it carries the assertion message with the observed values. apple-ci
      # already uploads its three native equivalents; core-ci uploaded nothing, so a JVM conformance
      # failure could only be guessed at from the console. OBSERVED 2026-08-28 on a CONF-14a
      # failure. `always()` is the point: this artifact matters most when the step failed.
      - name: Upload Linux core-conformance JUnit results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-core-conformance-linux-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core-conformance/build/test-results/jvmTest
            core-conformance/build/test-results/testAndroidHostTest
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android core-conformance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-core-conformance-android-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core-conformance/build/test-results/testAndroidHostTest
            android/app/build/test-results/testDevDebugUnitTest
            android/tv/build/test-results/testDebugUnitTest
          if-no-files-found: error
          retention-days: 7

  # Android playback on a real emulator against the disposable server: the production play entry,
  # Media3, media time advancing, backgrounding, and exactly one server play. The phone and TV legs
  # are the only two destinations; each needs its own system image, so they cannot share a boot.
  # Results reach the required core-ci job, which fails unless both legs passed.
  android-emulator:
    name: android-emulator (${{ matrix.surface }}${{ matrix.rep != 1 && format(' rep {0}', matrix.rep) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One attempt output PER SURFACE, because a matrix combines its members' outputs into one set:
    # a single `attempt` would hold whichever member finished last, which after a partial re-run is
    # the wrong attempt for the other surface. Each member sets only its own output and evaluates
    # the other to an empty string, the pattern GitHub documents for per-member matrix outputs.
    # Only repetition 1 is downloaded by the required job, so only repetition 1 reports.
    outputs:
      attempt-phone: ${{ matrix.surface == 'phone' && matrix.rep == 1 && github.run_attempt || '' }}
      attempt-tv: ${{ matrix.surface == 'tv' && matrix.rep == 1 && github.run_attempt || '' }}
    strategy:
      fail-fast: false
      matrix:
        surface: [phone, tv]
        rep: ${{ fromJSON(github.event.inputs.emulator_reps || '[1]') }}
        include:
          - surface: phone
            target: google_apis
            arch: x86_64
            profile: pixel_6
            build: :android:app:assembleDevDebug :android:app:assembleDevDebugAndroidTest :core-conformance:assembleAndroidDeviceTest
            task: :android:app:connectedDevDebugAndroidTest
            conformance: com.legitimateapps.dulcet.conformance.PlaybackScrobbleAndroidPhoneConformanceTest
            results: android/app/build/outputs/androidTest-results/connected
          - surface: tv
            target: android-tv
            arch: x86
            profile: tv_1080p
            build: :android:tv:assembleDebug :android:tv:assembleDebugAndroidTest :core-conformance:assembleAndroidDeviceTest
            task: :android:tv:connectedDebugAndroidTest
            conformance: com.legitimateapps.dulcet.conformance.PlaybackScrobbleAndroidTvConformanceTest
            results: android/tv/build/outputs/androidTest-results/connected
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-${{ steps.pins.outputs.compile_sdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # Standard Linux runners expose /dev/kvm to root only; the emulator needs it as the runner user.
      # `udevadm trigger` returns before the rule is applied: MEASURED, one leg of the first run
      # found /dev/kvm still unwritable. `settle` waits for the event queue to drain.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -w /dev/kvm
      # Built before the emulator boots, so emulator time is spent only on the proof.
      - name: Build the app and its instrumented tests
        run: ./gradlew --no-daemon --max-workers=2 ${{ matrix.build }}
      - name: Create fresh test-class root
        id: root
        run: echo "path=$(tools/conformance-env/new-class-root --parent "$RUNNER_TEMP" --label android-emulator-${{ matrix.surface }})" >> "$GITHUB_OUTPUT"
      # The same pinned, seeded, disposable Navidrome the Linux conformance job uses, on host
      # loopback 4533. The emulator reaches host loopback as 10.0.2.2.
      - name: Start the disposable server
        run: tools/conformance-env/linux-local --root "${{ steps.root.outputs.path }}" up
      # Two proofs on one booted emulator, each line a separate command that fails the step:
      # 1. The declared playback and scrobble conformance, instrumented on this device's runtime
      #    under a per-surface identity. It runs first, while the server's transcode cache is still
      #    cold, because CONF-14a, CONF-17 and CONF-51 measure cold-cache behavior. `adb reverse`
      #    keeps the suite on device loopback, which its disposable-server guard requires.
      # 2. The app proof: production entry to exactly one server play.
      - name: Run device conformance, then play and require exactly one server play
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: |
            adb reverse tcp:4533 tcp:4533
            ./gradlew --no-daemon --max-workers=2 :core-conformance:connectedAndroidDeviceTest -Pandroid.testInstrumentationRunnerArguments.DULCET_CONFORMANCE_BASE_URL=http://127.0.0.1:4533 -Pandroid.testInstrumentationRunnerArguments.DULCET_CONFORMANCE_DISPOSABLE=true -Pandroid.testInstrumentationRunnerArguments.class=${{ matrix.conformance }}
            ./gradlew --no-daemon --max-workers=2 ${{ matrix.task }} -Pandroid.testInstrumentationRunnerArguments.dulcetServerUrl=http://10.0.2.2:4533 -Pandroid.testInstrumentationRunnerArguments.dulcetServerDisposable=true
      - name: Stop the disposable server
        if: ${{ always() }}
        run: tools/conformance-env/linux-local --root "${{ steps.root.outputs.path }}" down || true
      - name: Upload emulator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dulcet-android-emulator-${{ matrix.surface }}${{ matrix.rep != 1 && format('-rep{0}', matrix.rep) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.results }}
            core-conformance/build/outputs/androidTest-results/connected
          if-no-files-found: error
          retention-days: 7

  # The required status check. It runs `if: always()`, because a failed job would otherwise SKIP it
  # and a skipped required check does not block a merge, and it fails unless every job it needs
  # reports `success`. Only then does it read evidence, so evidence from a job that did not succeed
  # is never read at all.
  core-ci:
    name: core-ci
    if: ${{ always() }}
    needs: [core-build, conformance-env-linux, android-emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CORE_BUILD_RESULT: ${{ needs.core-build.result }}
      CONFORMANCE_ENV_LINUX_RESULT: ${{ needs.conformance-env-linux.result }}
      ANDROID_EMULATOR_RESULT: ${{ needs.android-emulator.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require build and Linux conformance environment
        run: |
          echo "core-build=$CORE_BUILD_RESULT"
          echo "conformance-env-linux=$CONFORMANCE_ENV_LINUX_RESULT"
          echo "android-emulator=$ANDROID_EMULATOR_RESULT"
          test "$CORE_BUILD_RESULT" = success
          test "$CONFORMANCE_ENV_LINUX_RESULT" = success
          test "$ANDROID_EMULATOR_RESULT" = success
          echo "CORE CI JOBS PASS build=$CORE_BUILD_RESULT conformance-env-linux=$CONFORMANCE_ENV_LINUX_RESULT android-emulator=$ANDROID_EMULATOR_RESULT"
      # Each download names the attempt that PRODUCED the artifact, read from the producing job's
      # attempt output -- never this job's own `github.run_attempt`. "Re-run failed jobs" re-runs the
      # failed jobs and this one, not the jobs that passed, so a name built from this job's attempt
      # asks for evidence that was never uploaded. OBSERVED in run 36238393531: attempt 2 re-ran only
      # the phone emulator leg and this job, and failed on
      # `dulcet-core-conformance-android-evidence-36238393531-2`, which no job had written.
      #
      # Why this cannot read stale evidence: each upload name carries its job and the attempt that
      # ran it, and an upload-artifact@v4 artifact is immutable -- a second upload of one name fails
      # rather than replacing it. A job runs at most once per attempt, and its attempt output is set
      # by that same execution, so the name here is the artifact of the job's LATEST execution. A
      # job that failed and then passed on re-run therefore supplies its passing attempt, and one
      # that passed and was then re-run supplies the re-run -- which, having passed the step above,
      # succeeded. Every attempt's artifact stays in the run, so a superseded failure keeps its
      # evidence for diagnosis.
      - name: Download Android core-conformance evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-core-conformance-android-evidence-${{ github.run_id }}-${{ needs.conformance-env-linux.outputs.attempt }}
          path: core-conformance-android-results
      - name: Download Android app evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-android-app-evidence-${{ github.run_id }}-${{ needs.core-build.outputs.attempt }}
          path: android-app-results
      - name: Download Android phone emulator evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-android-emulator-phone-${{ github.run_id }}-${{ needs.android-emulator.outputs.attempt-phone }}
          path: android-emulator-phone-results
      - name: Download Android TV emulator evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: dulcet-android-emulator-tv-${{ github.run_id }}-${{ needs.android-emulator.outputs.attempt-tv }}
          path: android-emulator-tv-results
      - name: Verify Android parity evidence executed and passed
        run: >-
          python3 tools/verify-parity-evidence
          core-conformance-android-results
          android-app-results
          android-emulator-phone-results
          android-emulator-tv-results
