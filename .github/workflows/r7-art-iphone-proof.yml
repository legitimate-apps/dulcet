name: Round 7 iPhone artwork proof

on:
  push:
    branches: [proof/r7-art-iphone]

permissions:
  contents: read

concurrency:
  group: r7-art-iphone-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-artwork:
    runs-on: xcode-27
    timeout-minutes: 95
    env:
      TZ: UTC
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the proof output directory
        run: echo "R7_ART_EVIDENCE=$RUNNER_TEMP/r7-art-evidence" >> "$GITHUB_ENV"
      - name: Read toolchain pins
        id: pins
        run: python3 tools/export_toolchain.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Select tools
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ steps.pins.outputs.xcode }}.app/Contents/Developer"
          command -v ffmpeg || brew install ffmpeg
      - name: Build the disposable server and iOS core
        timeout-minutes: 18
        run: tools/run-gradle-exclusive --no-daemon --max-workers=2 :server:installDist :core:linkDebugFrameworkIosSimulatorArm64
      - name: Build the iPhone app and proof
        timeout-minutes: 20
        working-directory: apple
        run: |
          mkdir -p "$R7_ART_EVIDENCE"
          set -o pipefail
          xcodebuild -project Dulcet.xcodeproj -scheme DulcetiOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/r7-art-dd" \
            -jobs 3 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing > "$R7_ART_EVIDENCE/build.log" 2>&1 || {
              tail -150 "$R7_ART_EVIDENCE/build.log"
              exit 1
            }
      - name: Boot the iPhone and settle its services
        timeout-minutes: 23
        run: |
          set -o pipefail
          python3 tools/ci/isolate-simulator --phase r7-artwork --keep-name 'iPhone 18 Pro' \
            --settle --require-settle --require-isolation | tee "$R7_ART_EVIDENCE/simulator.log"
          udid=$(sed -nE 's/^SIMULATOR ISOLATION phase=r7-artwork keep=([0-9A-Fa-f-]{36}) .* isolated=true .*/\1/p' "$R7_ART_EVIDENCE/simulator.log")
          test -n "$udid"
          echo "R7_ART_IPHONE_UDID=$udid" >> "$GITHUB_ENV"
      - name: Settle host pressure before starting the test runner
        timeout-minutes: 17
        run: python3 tools/ci/host-pressure settle --phase r7-artwork --output "$R7_ART_EVIDENCE/host-pressure.log"
      - name: Drive the iPhone against the disposable server
        timeout-minutes: 25
        run: bash tools/r7-art-proof/run.sh
      - name: Export the named XCTest screenshots
        if: always()
        run: bash tools/r7-art-proof/export.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r7-art-iphone-evidence
          retention-days: 7
          path: |
            ${{ env.R7_ART_EVIDENCE }}/screens/*.jpg
            ${{ env.R7_ART_EVIDENCE }}/*.log
