name: apple-design-tour
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-proof:
    runs-on: xcode-27
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build Dulcet and its iPhone tests
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          git rev-parse HEAD^ > "$RUNNER_TEMP/recovery-evidence/production-revision.txt"
          command -v ffmpeg || HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          tools/run-gradle-exclusive --max-workers=2 :server:installDist
          xcodebuild -project apple/Dulcet.xcodeproj -scheme DulcetiOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/recovery-dd" \
            -jobs 2 build-for-testing 2>&1 | tee "$RUNNER_TEMP/recovery-evidence/build.log"
          ./gradlew --stop
      - name: Capture recovery with a real stopped and restarted server
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/recovery-evidence"
          python3 tools/ci/isolate-simulator --phase recovery-proof --keep-name 'iPhone 18 Pro' --settle | tee "$evidence/simulator.log"
          udid="$(sed -nE 's/^SIMULATOR ISOLATION phase=recovery-proof keep=([0-9A-Fa-f-]+) .*isolated=true.*/\1/p' "$evidence/simulator.log")"
          test -n "$udid"
          fixture=
          cleanup() {
            if [[ -n "$fixture" ]]; then
              kill -TERM "$fixture" 2>/dev/null || true
              wait "$fixture" || true
            fi
            xcrun simctl shutdown "$udid" || true
          }
          trap cleanup EXIT
          python3 tools/r7-recovery-proof-fixture.py "$evidence/fixture" > "$evidence/fixture.log" 2>&1 &
          fixture=$!
          ready=
          for attempt in {1..90}; do
            kill -0 "$fixture"
            if grep -q '^READY ' "$evidence/fixture.log"; then ready=yes; break; fi
            sleep 1
          done
          test "$ready" = yes
          mkdir -p "$evidence/screens"
          export TEST_RUNNER_DULCET_CONNECTION_RECOVERY_CONTROL_URL=http://127.0.0.1:4909
          export TEST_RUNNER_DULCET_UI_TEST_SERVER_URL=http://127.0.0.1:4907
          export TEST_RUNNER_DULCET_UI_TEST_USERNAME=fixture
          export TEST_RUNNER_DULCET_UI_TEST_PASSWORD=fixture-canary-pw
          export TEST_RUNNER_DULCET_DESIGN_TOUR_OUT="$evidence/screens"
          tests=DulcetiOSUITests/DulcetDesignTourUITests
          xcodebuild -project apple/Dulcet.xcodeproj -scheme DulcetiOS -configuration Debug \
            test-without-building -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/recovery-dd" \
            -resultBundlePath "$evidence/recovery.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            "-only-testing:$tests/testDiscoverClearsItsRefreshFailureAfterTheServerRestarts" \
            "-only-testing:$tests/testOpenArtistClearsItsFailureAfterTheServerRestarts" \
            "-only-testing:$tests/testSearchClearsItsFailureAfterTheServerRestarts" 2>&1 | tee "$evidence/test.log"
      - name: Upload iPhone evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-recover-iphone-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recovery-evidence/*.log
            ${{ runner.temp }}/recovery-evidence/*.txt
            ${{ runner.temp }}/recovery-evidence/fixture/server.log
            ${{ runner.temp }}/recovery-evidence/screens/*.png
            ${{ runner.temp }}/recovery-evidence/recovery.xcresult
          retention-days: 7
