name: parity-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-gate:
    name: parity-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prove pull-request workflows never receive repository secrets
        run: python3 tools/test-pr-workflow-secret-boundary
      - name: Require evidence-boundary markers and revision integrity
        run: python3 tools/test-spec-evidence-boundaries
      - name: Require partial promotion conditions to resolve or declare a block
        run: python3 tools/verify_promotion_conditions.py
      - name: Prove nonexistent promotion targets are rejected
        run: python3 tools/test-promotion-condition-resolvability
      - name: Prove spec evidence-boundary regressions are rejected
        run: python3 tools/test-spec-evidence-boundary-mutations
      - name: Prove design ratings are isolated and mechanically assembled
        run: python3 tools/test-design-rating-harness
      - name: Prove partial evidence defects are rejected
        run: python3 tools/test-parity-gate
      - name: Prove xcresult evidence rejects incomplete individual results
        run: python3 tools/test-swift-testing-junit
      - name: Prove the shared Linux conformance lifecycle is disposable and pin-derived
        run: python3 tools/test-linux-conformance-local
      - name: Prove required-check drift is rejected
        run: python3 tools/test-required-checks
      - name: Prove library readiness belongs to the current Navidrome process
        run: python3 tools/test-await-library-ready
      - name: Prove the play-count reader fails closed
        run: python3 tools/test-read-play-count
      - name: Prove the main-health reporter refuses rather than reporting nothing
        run: python3 tools/test-report-main-health
      - name: Prove transcode timeouts identify their phase and obey the wall-clock budget
        run: python3 tools/test-transcode-probe-timeout-diagnostic
      - name: Prove capture-soak summaries preserve probability and exit classification
        run: python3 tools/test-capture-soak-summary
      - name: Validate FEATURES.yml
        run: python3 tools/parity_gate.py
      - name: Verify CI policy
        run: python3 tools/verify_ci_policy.py
      - name: Prove the project-spec path gate rejects a missing referenced file
        run: python3 tools/test-project-spec-paths
      - name: Require every path named in the project spec to exist
        run: python3 tools/verify_project_spec_paths.py
