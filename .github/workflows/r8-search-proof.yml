name: r8-search-proof
on:
  push:
    branches: [proof/r8-search]
permissions:
  contents: read
concurrency:
  group: r8-search-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build the app framework and disposable server
        timeout-minutes: 22
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          command -v ffmpeg || brew install ffmpeg
          ./gradlew --no-daemon --max-workers=2 :server:installDist :core:linkDebugFrameworkIosSimulatorArm64
      - name: Run the staged search on an iPhone
        timeout-minutes: 30
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/search-evidence"
          mkdir -p "$out"
          git rev-parse HEAD HEAD^ > "$out/revisions.txt"
          xcodebuild -version > "$out/toolchain.txt"
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(x["udid"] for x in json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-27-0"] if x["name"] == "iPhone 18 Pro"))')
          trap 'xcrun simctl shutdown "$udid" || true' EXIT
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          tools/ci/run-r8-search-proof "$out" "$udid" "$RUNNER_TEMP/search-dd"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r8-search-iphone
          path: |
            ${{ runner.temp }}/search-evidence/*.jpg
            ${{ runner.temp }}/search-evidence/*.log
            ${{ runner.temp }}/search-evidence/*.txt
            ${{ runner.temp }}/search-evidence/*.json
